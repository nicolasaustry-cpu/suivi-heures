<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rapports</title>
<link rel="stylesheet" href="assets/style.css">
<style>
/* Style filtre type Excel */
.filtre-container {
  position: relative;
  display: inline-block;
}
.filtre-btn {
  min-width: 180px;
  padding: 5px 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  font-size: 0.9rem;
}
.filtre-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: #fff;
  border: 1px solid #999;
  min-width: 220px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 1001;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.filtre-dropdown.open {
  display: block;
}
.filtre-dropdown input[type="text"] {
  width: calc(100% - 10px);
  margin: 5px;
  padding: 4px;
  border: 1px solid #ccc;
  font-size: 0.85rem;
  box-sizing: border-box;
}
.filtre-dropdown label {
  display: block;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 0.85rem;
  white-space: nowrap;
}
.filtre-dropdown label:hover {
  background: #e8f0fe;
}
.filtre-dropdown label.select-all {
  border-bottom: 1px solid #ccc;
  font-weight: bold;
}
.filtre-dropdown input[type="checkbox"] {
  margin-right: 6px;
  vertical-align: middle;
}
</style>
</head>
<body>
<header class="main-header">
  <div class="entreprise-nom" id="entreprise-nom"></div>
  <h1 class="page-title">Rapports</h1>
</header>

<div class="nav">
  <a href="index.html">Entreprise</a>
  <a href="salaries.html">Salariés</a>
  <a href="planning.html">Planning</a>
  <a href="rapports.html" class="active">Rapports</a>
</div>

<section>
  <div class="flex" style="gap:1.5rem;align-items:flex-end;flex-wrap:wrap;">
    
    <!-- Filtre Salariés -->
    <div>
      <label>Salarié(s) :</label><br>
      <div class="filtre-container">
        <div class="filtre-btn" id="btnSalaries" onclick="toggleFiltre('salaries')">Tous ▼</div>
        <div class="filtre-dropdown" id="dropdownSalaries">
          <input type="text" placeholder="Rechercher" oninput="rechercherSalarie(this.value)">
          <label class="select-all">
            <input type="checkbox" id="cbTousSalaries" checked onchange="cocherTousSalaries(this.checked)"> (Sélectionner tout)
          </label>
          <div id="listeSalariesRapport"></div>
        </div>
      </div>
    </div>

    <!-- Filtre Chantiers -->
    <div>
      <label>Chantier(s) :</label><br>
      <div class="filtre-container">
        <div class="filtre-btn" id="btnChantiers" onclick="toggleFiltre('chantiers')">Tous ▼</div>
        <div class="filtre-dropdown" id="dropdownChantiers">
          <input type="text" placeholder="Rechercher" oninput="rechercherChantier(this.value)">
          <label class="select-all">
            <input type="checkbox" id="cbTousChantiers" checked onchange="cocherTousChantiers(this.checked)"> (Sélectionner tout)
          </label>
          <div id="listeChantiersRapport"></div>
        </div>
      </div>
    </div>

    <!-- Filtre Années -->
    <div>
      <label>Année(s) :</label><br>
      <div class="filtre-container">
        <div class="filtre-btn" id="btnAnnees" onclick="toggleFiltre('annees')">Tous ▼</div>
        <div class="filtre-dropdown" id="dropdownAnnees">
          <label class="select-all">
            <input type="checkbox" id="cbToutesAnnees" checked onchange="cocherToutesAnnees(this.checked)"> (Sélectionner tout)
          </label>
          <div id="listeAnneesRapport"></div>
        </div>
      </div>
    </div>

    <!-- Bouton Afficher -->
    <div>
      <button class="btn btn-primary" onclick="genererRapport()">Afficher</button>
    </div>
  </div>

  <!-- Synthèse -->
  <div id="zone-synthese"
       style="margin:1.5rem 0;background:#f0f9ff;padding:1rem;border-radius:8px;border:1px solid #ccc;display:none;">
    <div style="font-size:1.1rem;font-weight:bold;margin-bottom:0.5rem;">Synthèse par salarié</div>
    <div style="display:flex;justify-content:space-around;gap:1rem;margin-bottom:1rem;">
      <div><span style="color:#666;">Total heures :</span> <strong id="total-heures-affiche">0 h</strong></div>
      <div><span style="color:#666;">Nombre d'entrées :</span> <strong id="nb-entrees">0</strong></div>
    </div>
    <table id="table-synthese" style="width:100%;border-collapse:collapse;font-size:0.9rem;">
      <thead>
        <tr style="background:#e8edf3;">
          <th style="border:1px solid #ccc;padding:6px;">Salarié</th>
          <th style="border:1px solid #ccc;padding:6px;">Total heures</th>
          <th style="border:1px solid #ccc;padding:6px;">Nb interventions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Rapport -->
  <table id="table-rapport">
    <thead>
      <tr><th>Date</th><th>Salarié</th><th>Chantier</th><th>Heures</th></tr>
    </thead>
    <tbody></tbody>
    <tfoot>
      <tr><td colspan="3" style="text-align:right;font-weight:bold;">Total heures&nbsp;</td>
          <td id="total-heures" style="font-weight:bold;">0</td></tr>
    </tfoot>
  </table>
</section>

<script src="assets/script.js"></script>
<script>
// === Données ===
let salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
let heures = JSON.parse(localStorage.getItem('heuresdata') || '{}');

// === Sélections ===
let salariesSelectionnes = new Set();
let chantiersSelectionnes = new Set();
let anneesSelectionnees = new Set();

// === Extraire les chantiers uniques depuis heuresdata ===
function getListeChantiers() {
  const chantiers = new Set();
  for (const k in heures) {
    const data = heures[k];
    if (data && data.chantier && data.chantier.trim() !== '' && data.chantier.toLowerCase() !== 'absence') {
      const h = parseFloat(data.heures) || 0;
      if (h > 0) {
        chantiers.add(data.chantier.trim());
      }
    }
  }
  return Array.from(chantiers).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
}

// === Extraire les années uniques depuis heuresdata ===
function getListeAnnees() {
  const annees = new Set();
  for (const k in heures) {
    const match = k.match(/(\d{4})_(\d{2})_(\d{2})/);
    if (match) {
      annees.add(parseInt(match[1]));
    }
  }
  if (annees.size === 0) {
    annees.add(new Date().getFullYear());
  }
  return Array.from(annees).sort((a, b) => b - a);
}

// === Initialisation des filtres ===
function initFiltres() {
  // Salariés
  const listeSal = document.getElementById('listeSalariesRapport');
  listeSal.innerHTML = '';
  salariesSelectionnes.clear();
  
  salaries.forEach(s => {
    salariesSelectionnes.add(s.id.toString());
    const label = document.createElement('label');
    label.dataset.nom = (s.prenom + ' ' + s.nom).toLowerCase();
    label.innerHTML = `<input type="checkbox" checked data-id="${s.id}" onchange="majFiltreSalaries()"> ${s.prenom} ${s.nom}`;
    listeSal.appendChild(label);
  });
  document.getElementById('cbTousSalaries').checked = true;
  majBoutonSalaries();

  // Chantiers
  const listeCh = document.getElementById('listeChantiersRapport');
  listeCh.innerHTML = '';
  chantiersSelectionnes.clear();
  
  const chantiers = getListeChantiers();
  chantiers.forEach(ch => {
    chantiersSelectionnes.add(ch);
    const label = document.createElement('label');
    label.dataset.nom = ch.toLowerCase();
    label.innerHTML = `<input type="checkbox" checked data-chantier="${ch}" onchange="majFiltreChantiers()"> ${ch}`;
    listeCh.appendChild(label);
  });
  document.getElementById('cbTousChantiers').checked = true;
  majBoutonChantiers();

  // Années
  const listeAn = document.getElementById('listeAnneesRapport');
  listeAn.innerHTML = '';
  anneesSelectionnees.clear();
  
  const annees = getListeAnnees();
  annees.forEach(an => {
    anneesSelectionnees.add(an);
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" checked data-annee="${an}" onchange="majFiltreAnnees()"> ${an}`;
    listeAn.appendChild(label);
  });
  document.getElementById('cbToutesAnnees').checked = true;
  majBoutonAnnees();
}

// === Toggle dropdown ===
function toggleFiltre(type) {
  const dropdown = document.getElementById('dropdown' + type.charAt(0).toUpperCase() + type.slice(1));
  dropdown.classList.toggle('open');
}

// Fermer au clic extérieur
document.addEventListener('click', function(e) {
  ['Salaries', 'Chantiers', 'Annees'].forEach(type => {
    const container = document.getElementById('btn' + type)?.parentElement;
    const dropdown = document.getElementById('dropdown' + type);
    if (container && dropdown && !container.contains(e.target)) {
      dropdown.classList.remove('open');
    }
  });
});

// === Recherche salariés ===
function rechercherSalarie(terme) {
  const t = terme.toLowerCase();
  document.querySelectorAll('#listeSalariesRapport label').forEach(lbl => {
    lbl.style.display = lbl.dataset.nom.includes(t) ? 'block' : 'none';
  });
}

// === Recherche chantiers ===
function rechercherChantier(terme) {
  const t = terme.toLowerCase();
  document.querySelectorAll('#listeChantiersRapport label').forEach(lbl => {
    lbl.style.display = lbl.dataset.nom.includes(t) ? 'block' : 'none';
  });
}

// === Cocher tout salariés ===
function cocherTousSalaries(checked) {
  document.querySelectorAll('#listeSalariesRapport input[type="checkbox"]').forEach(cb => {
    cb.checked = checked;
  });
  majFiltreSalaries();
}

// === Cocher tout chantiers ===
function cocherTousChantiers(checked) {
  document.querySelectorAll('#listeChantiersRapport input[type="checkbox"]').forEach(cb => {
    cb.checked = checked;
  });
  majFiltreChantiers();
}

// === Cocher toutes années ===
function cocherToutesAnnees(checked) {
  document.querySelectorAll('#listeAnneesRapport input[type="checkbox"]').forEach(cb => {
    cb.checked = checked;
  });
  majFiltreAnnees();
}

// === Mise à jour filtre salariés ===
function majFiltreSalaries() {
  salariesSelectionnes.clear();
  const checkboxes = document.querySelectorAll('#listeSalariesRapport input[type="checkbox"]');
  let tousCoches = true;
  
  checkboxes.forEach(cb => {
    if (cb.checked) {
      salariesSelectionnes.add(cb.dataset.id);
    } else {
      tousCoches = false;
    }
  });
  
  document.getElementById('cbTousSalaries').checked = tousCoches;
  majBoutonSalaries();
}

// === Mise à jour filtre chantiers ===
function majFiltreChantiers() {
  chantiersSelectionnes.clear();
  const checkboxes = document.querySelectorAll('#listeChantiersRapport input[type="checkbox"]');
  let tousCoches = true;
  
  checkboxes.forEach(cb => {
    if (cb.checked) {
      chantiersSelectionnes.add(cb.dataset.chantier);
    } else {
      tousCoches = false;
    }
  });
  
  document.getElementById('cbTousChantiers').checked = tousCoches;
  majBoutonChantiers();
}

// === Mise à jour filtre années ===
function majFiltreAnnees() {
  anneesSelectionnees.clear();
  const checkboxes = document.querySelectorAll('#listeAnneesRapport input[type="checkbox"]');
  let tousCoches = true;
  
  checkboxes.forEach(cb => {
    if (cb.checked) {
      anneesSelectionnees.add(parseInt(cb.dataset.annee));
    } else {
      tousCoches = false;
    }
  });
  
  document.getElementById('cbToutesAnnees').checked = tousCoches;
  majBoutonAnnees();
}

// === Boutons filtres ===
function majBoutonSalaries() {
  const btn = document.getElementById('btnSalaries');
  const nb = salariesSelectionnes.size;
  const total = salaries.length;
  btn.textContent = (nb === 0 || nb === total) ? 'Tous ▼' : nb + ' salarié' + (nb > 1 ? 's' : '') + ' ▼';
}

function majBoutonChantiers() {
  const btn = document.getElementById('btnChantiers');
  const nb = chantiersSelectionnes.size;
  const total = getListeChantiers().length;
  btn.textContent = (nb === 0 || nb === total) ? 'Tous ▼' : nb + ' chantier' + (nb > 1 ? 's' : '') + ' ▼';
}

function majBoutonAnnees() {
  const btn = document.getElementById('btnAnnees');
  const nb = anneesSelectionnees.size;
  const total = getListeAnnees().length;
  btn.textContent = (nb === 0 || nb === total) ? 'Toutes ▼' : nb + ' année' + (nb > 1 ? 's' : '') + ' ▼';
}

// === Génération du rapport ===
function genererRapport() {
  // Recharger les données
  salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  heures = JSON.parse(localStorage.getItem('heuresdata') || '{}');
  
  const tb = document.querySelector('#table-rapport tbody');
  tb.innerHTML = '';
  let lignes = [], totalHeures = 0;

  for (const k in heures) {
    const data = heures[k];
    if (!data || !data.chantier) continue;
    
    const chantier = data.chantier.trim();
    if (chantier.toLowerCase() === 'absence') continue;
    
    const h = parseFloat(data.heures) || 0;
    if (h <= 0) continue;

    // Extraire salarié ID et date depuis la clé
    const match = k.match(/^(\d+)(\d{4}_\d{2}_\d{2})/);
    if (!match) continue;
    
    const salarieId = match[1];
    const dateStr = match[2].replace(/_/g, '-');
    const d = new Date(dateStr);
    
    if (d.getDay() === 0) continue; // Dimanche
    
    const annee = d.getFullYear();
    
    // Filtres
    if (salariesSelectionnes.size > 0 && !salariesSelectionnes.has(salarieId)) continue;
    if (chantiersSelectionnes.size > 0 && !chantiersSelectionnes.has(chantier)) continue;
    if (anneesSelectionnees.size > 0 && !anneesSelectionnees.has(annee)) continue;
    
    const salarie = salaries.find(s => s.id == salarieId);
    if (!salarie) continue;
    
    lignes.push({
      date: d,
      salarie: `${salarie.prenom} ${salarie.nom}`,
      salarieId: salarieId,
      chantier: chantier,
      heures: h
    });
  }

  // Tri par salarié puis par date
  lignes.sort((a, b) => {
    const cmp = a.salarie.localeCompare(b.salarie, 'fr', { sensitivity: 'base' });
    return cmp !== 0 ? cmp : a.date - b.date;
  });

  // Affichage
  lignes.forEach(L => {
    tb.innerHTML += `<tr>
      <td>${L.date.toLocaleDateString('fr-FR')}</td>
      <td>${L.salarie}</td>
      <td>${L.chantier}</td>
      <td>${L.heures.toFixed(2)}</td>
    </tr>`;
    totalHeures += L.heures;
  });

  document.getElementById('total-heures').textContent = totalHeures.toFixed(2);
  document.getElementById('total-heures-affiche').textContent = `${totalHeures.toFixed(2)} h`;
  document.getElementById('nb-entrees').textContent = lignes.length;

  if (lignes.length > 0) {
    afficherSyntheseParSalarie(lignes);
    document.getElementById('zone-synthese').style.display = 'block';
  } else {
    document.getElementById('zone-synthese').style.display = 'none';
  }
}

// === Synthèse par salarié ===
function afficherSyntheseParSalarie(lignes) {
  const synthese = {};
  
  lignes.forEach(L => {
    if (!synthese[L.salarieId]) {
      synthese[L.salarieId] = { nom: L.salarie, totalHeures: 0, nb: 0 };
    }
    synthese[L.salarieId].totalHeures += L.heures;
    synthese[L.salarieId].nb++;
  });

  const tb = document.querySelector('#table-synthese tbody');
  tb.innerHTML = '';
  
  Object.values(synthese)
    .sort((a, b) => b.totalHeures - a.totalHeures)
    .forEach(x => {
      tb.innerHTML += `<tr>
        <td style="border:1px solid #ccc;padding:6px;">${x.nom}</td>
        <td style="border:1px solid #ccc;padding:6px;text-align:center;"><strong>${x.totalHeures.toFixed(2)} h</strong></td>
        <td style="border:1px solid #ccc;padding:6px;text-align:center;">${x.nb}</td>
      </tr>`;
    });
}

// === Initialisation ===
window.addEventListener("DOMContentLoaded", () => {
  if (typeof licenceOK === 'function') licenceOK();
  initFiltres();
  
  // Logo Volitis
  const header = document.querySelector("header");
  if (header) {
    document.getElementById("volitis-link")?.remove();

    const wrapper = document.createElement("div");
    wrapper.id = "volitis-link";
    wrapper.style.display = "flex";
    wrapper.style.alignItems = "center";
    wrapper.style.gap = "0.5rem";
    wrapper.style.marginLeft = "1rem";
    wrapper.style.cursor = "pointer";
    wrapper.style.userSelect = "none";

    const logoContainer = document.createElement("div");
    logoContainer.style.background = "white";
    logoContainer.style.borderRadius = "50%";
    logoContainer.style.width = "42px";
    logoContainer.style.height = "42px";
    logoContainer.style.display = "flex";
    logoContainer.style.alignItems = "center";
    logoContainer.style.justifyContent = "center";

    const img = document.createElement("img");
    img.src = "assets/volitis-logo.png";
    img.alt = "Logo Volitis";
    img.style.height = "30px";
    img.style.width = "auto";
    logoContainer.appendChild(img);

    const text = document.createElement("span");
    text.textContent = "Outil créé par Volitis";
    text.style.fontSize = "0.8rem";
    text.style.color = "white";
    text.style.whiteSpace = "nowrap";

    wrapper.append(logoContainer, text);
    wrapper.addEventListener("click", () => window.open("[volitis.net](https://volitis.net/)", "_blank"));
    header.appendChild(wrapper);
  }

  // Nom entreprise
  const nomElt = document.getElementById("entreprise-nom");
  if (nomElt && typeof entreprise !== 'undefined' && entreprise.nom) {
    nomElt.textContent = entreprise.nom;
  }
});
</script>
</body>
</html>
