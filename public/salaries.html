<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><title>Salariés</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="main-header">
  <div class="entreprise-nom" id="entreprise-nom"></div>
  <h1 class="page-title">Entreprise</h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div id="licence-status"></div> <!-- ✅ ce bloc est indispensable -->
  </div>
</header>

<div class="nav">
 <a href="index.html">Entreprise</a><a href="salaries.html" class="active">Salariés</a>
 <a href="planning.html">Planning</a><a href="rapports.html">Rapports</a>
</div>

<section>
<section>
  <h2>Ajouter un salarié</h2>
  <div class="flex" style="flex-direction:column;align-items:flex-start;background:#dcfce7;border-radius:8px;padding:1rem;margin-bottom:1rem;">
    <div class="flex">
      <div><label>Prénom :</label><br><input id="prenomEl"></div>
      <div><label>Nom :</label><br><input id="nomEl"></div>
      <div><label>Date d’entrée :</label><br><input type="date" id="dateEntreeEl"></div>
    </div>

    <h3>Heures prévues par jour</h3>
    <table id="table-heures-ajout" style="width:auto;margin-bottom:0.5rem;">
      <thead>
        <tr>
          <th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="number" id="hLun" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hMar" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hMer" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hJeu" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hVen" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hSam" value="0" step="0.1" style="width:60px;"></td>
        </tr>
      </tbody>
    </table>

    <button class="btn btn-success" style="margin-top:0.5rem;" onclick="ajouterSalarie()">+ Ajouter le salarié</button>
  </div>

  <h2>Liste des salariés</h2>
<table id="table-salaries">
  <thead>
    <tr>
      <th>Prénom</th><th>Nom</th><th>Date entrée</th><th>Date sortie</th>
      <th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</section>

<script>
window.addEventListener("DOMContentLoaded", () => {
  // Création du logo Volitis à droite du header
  const header = document.querySelector("header");
  if (!header) return;
  document.getElementById("volitis-link")?.remove();

  const wrapper = document.createElement("div");
  wrapper.id = "volitis-link";
  wrapper.style.display = "flex";
  wrapper.style.alignItems = "center";
  wrapper.style.gap = "0.5rem";
  wrapper.style.marginLeft = "1rem";
  wrapper.style.cursor = "pointer";
  wrapper.style.userSelect = "none";

  const logoContainer = document.createElement("div");
  logoContainer.style.background = "white";
  logoContainer.style.borderRadius = "50%";
  logoContainer.style.width = "42px";
  logoContainer.style.height = "42px";
  logoContainer.style.display = "flex";
  logoContainer.style.alignItems = "center";
  logoContainer.style.justifyContent = "center";

  const img = document.createElement("img");
  img.src = "assets/volitis-logo.png";
  img.alt = "Logo Volitis";
  img.style.height = "30px";
  img.style.width = "auto";
  logoContainer.appendChild(img);

  const text = document.createElement("span");
  text.textContent = "Outil créé par Volitis";
  text.style.fontSize = "0.8rem";
  text.style.color = "white";
  text.style.whiteSpace = "nowrap";

  wrapper.append(logoContainer, text);
  wrapper.addEventListener("click", () => window.open("https://volitis.net/", "_blank"));
  header.appendChild(wrapper);

  // Affiche le nom d’entreprise à gauche
  const nomElt = document.getElementById("entreprise-nom");
  if (nomElt && entreprise.nom) nomElt.textContent = entreprise.nom;
});
</script>
<!-- Autres scripts éventuels -->

<script src="assets/script.js"></script>
<script>
window.addEventListener("DOMContentLoaded", () => {
  afficherSalaries(); // recharge la liste au chargement
});
</script>
</body>
</html>
