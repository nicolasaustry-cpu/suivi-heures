<header class="page-header">

<section>
<section>
  <h2>Ajouter un salarié</h2>
  <div class="flex" style="flex-direction:column;align-items:flex-start;background:#dcfce7;border-radius:8px;padding:1rem;margin-bottom:1rem;">
    <div class="flex">
      <div><label>Prénom :</label><br><input id="prenomEl"></div>
      <div><label>Nom :</label><br><input id="nomEl"></div>
      <div><label>Date d’entrée :</label><br><input type="date" id="dateEntreeEl"></div>
    </div>

    <h3>Heures prévues par jour</h3>
    <table id="table-heures-ajout" style="width:auto;margin-bottom:0.5rem;">
      <thead>
        <tr>
          <th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="number" id="hLun" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hMar" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hMer" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hJeu" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hVen" value="8" step="0.1" style="width:60px;"></td>
          <td><input type="number" id="hSam" value="0" step="0.1" style="width:60px;"></td>
        </tr>
      </tbody>
    </table>

    <button class="btn btn-success" style="margin-top:0.5rem;" onclick="ajouterSalarie()">+ Ajouter le salarié</button>
  </div>

  <h2>Liste des salariés</h2>
<table id="table-salaries">
  <thead>
    <tr>
      <th>Prénom</th><th>Nom</th><th>Date entrée</th><th>Date sortie</th>
      <th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</section>
