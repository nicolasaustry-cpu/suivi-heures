<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Planning du mois</title>
<link rel="stylesheet" href="assets/style.css" />

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}
h1 {
  margin: 0; 
  font-size: 1.4rem;
  line-height: 1.2;        /* réduit la hauteur verticale */
}
header h1 {
  margin-bottom: 0;        /* supprime la marge inférieure du titre */
}

.nav { background: #e8edf3; display: flex; justify-content: center; gap: 1rem; padding: 0.6rem; }
.nav a { text-decoration: none; color: #2563eb; font-weight: bold; }
.nav a.active { text-decoration: underline; }

button { border: none; border-radius: 4px; padding: 0.5rem 1rem; font-weight: bold; cursor: pointer; color: #fff; }
.btn-warning { background: #f59e0b; color: #000; }

.flex { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }

@media print {
  .no-print { display: none !important; }
  body { background: white; color: black; margin-top: 0 !important; }
}

/* Ligne totaux */
#totaux {
  position: relative;
  z-index: 20;
  background: #e0e7ff;
  border-top: 2px solid #2563eb;
  font-weight: bold;
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.8rem;
  font-size: 0.9rem;
}
#totaux th { padding: 6px; color: #111827; }
#totaux tr { background: #c7d2fe; }
/* Supprime l’espace entre le titre bleu et la barre de navigation */
header + .nav {
  margin-top: 0;
}
/* Coller la nav grise au bandeau bleu */
body {
  background: #f4f6f8;
}

.main-header {
  margin: 0;
  padding-bottom: 0.4rem;   /* réduit l'épaisseur du bandeau bleu */
  background: #2563eb;
}

.nav {
  margin-top: 0;
  background: #e8edf3;
  border-top: none;
}

header + .nav {
  position: relative;
  top: -4px;                /* tire la nav légèrement vers le haut */
}
/* === Suppression complète de tout espace entre le header bleu et la nav === */
html, body {
  margin: 0;
  padding: 0;
}

.main-header {
  margin: 0;
  padding: 0.6rem 1rem; /* garde la hauteur du header, mais sans marge */
  background: #2563eb;
}

.nav {
  margin: 0;
  padding-top: 0; 
  border: none;
  position: relative;
  top: -4px; /* colle la nav contre le bleu */
}
/* === Supprime la bande grise entre le titre bleu et la barre de navigation === */
body {
  background: #f4f6f8;
}
.main-header {
  margin: 0;
  padding: 0.8rem 1rem; /* ta hauteur actuelle */
}
header::after {
  content: "";
  display: block;
  height: 0;
  background: none;
}
.nav {
  margin-top: 0;
  border-top: none;
  background: #e8edf3;
  position: relative;
  top: -8px; /* remonte la barre grise sans agrandir le header */
}
/* Colle visuellement la barre grise au bandeau bleu */
.main-header {
  display: block;
}
.main-header + .nav {
  margin-top: -1px; /* supprime la ligne claire entre les deux */
}

</style>
</head>

<body>
<header class="main-header" style="background:#2563eb;color:#fff;padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center;">
  <div class="entreprise-nom" id="entreprise-nom"></div>
  <h1 class="page-title">Planning du mois</h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div id="licence-status">✔️ Active</div>
  </div>
</header><div class="nav">
  <a href="index.html">Entreprise</a>
  <a href="salaries.html">Salariés</a>
  <a href="planning.html" class="active">Planning</a>
  <a href="rapports.html">Rapports</a>
</div>

<!-- === Zone filtres + jauge + totaux === -->
<section style="background:#f8fafc;padding:0 0.8rem 0.8rem 0.8rem;margin-top:0;">
  <div class="flex">
    <div><label>Mois :</label><br><input type="month" id="moisPlanning" /></div>
    <div style="position:relative;">
      <label>Filtrer salariés :</label><br>
      <input type="text" id="salarieSearch" placeholder="Rechercher" style="width:200px;" />
    </div>
    <div><label>Semaine à imprimer :</label><br><select id="semaineSelect"></select></div>
    <div><button class="btn btn-warning" onclick="imprimerSemaine()">🖨 Imprimer</button></div>
  </div>

  <!-- Zone de paramétrage -->
  <div style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:#111;margin-top:0.8rem;">
    <label>Rouge → Orange à </label>
    <input id="seuil-orange" type="number" min="0" max="200" step="1" value="80"
           style="width:60px;text-align:center;border:1px solid #999;border-radius:4px;"> %

    <label>Orange → Vert à </label>
    <input id="seuil-vert" type="number" min="0" max="200" step="1" value="100"
           style="width:60px;text-align:center;border:1px solid #999;border-radius:4px;"> %

    <label style="margin-left:1rem;display:flex;align-items:center;gap:4px;">
      <input type="checkbox" id="figer-param" />
      Figer
    </label>
  </div>

  <!-- === Jauge === -->
  <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:0.6rem;">
    <div id="pourcentage" style="font-weight:bold;font-size:1rem;min-width:40px;text-align:right;">0%</div>
    <div style="position:relative;height:20px;border-radius:10px;overflow:hidden;border:1px solid #333;width:360px;">
      <div id="zone-rouge"  style="position:absolute;top:0;left:0;width:33%;height:100%;background:red;"></div>
      <div id="zone-orange" style="position:absolute;top:0;left:33%;width:33%;height:100%;background:orange;"></div>
      <div id="zone-verte"  style="position:absolute;top:0;left:66%;width:34%;height:100%;background:green;"></div>
      <div id="curseur" style="position:absolute;top:-2px;left:0;width:8px;height:24px;background:white;border:1px solid #000;border-radius:2px;transition:left 0.3s;"></div>
    </div>
  </div>

  <!-- Ligne Totaux du mois -->
  <table id="totaux" style="width:100%;border-collapse:collapse;margin-top:0.8rem;font-size:0.9rem;background:#eef2ff;">
    <thead>
      <tr style="background:#c7d2fe;">
        <th style="padding:6px;text-align:left;width:150px;">Totaux du mois</th>
        <th style="width:182px;"></th>
        <th style="width:182px;"></th>
        <th style="width:182px;"></th>
        <th style="width:182px;"></th>
        <th style="width:182px;"></th>
        <th id="tot-total" style="width:80px;text-align:center;">0</th>
        <th id="tot-abs"   style="width:80px;text-align:center;">0</th>
        <th id="tot-prev"  style="width:80px;text-align:center;">0</th>
        <th id="tot-ecart" style="width:80px;text-align:center;">0</th>
      </tr>
    </thead>
  </table>
</section>

<!-- === Contenu principal === -->
<div style="background:#fff;margin:1rem;box-shadow:0 2px 5px rgba(0,0,0,0.1);border-radius:6px;padding:1rem;">
  <div id="planning-wrapper"></div>
</div>

<script src="assets/script.js"></script>
</body>
</html>
