<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Planning</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222;}
header{background:#2563eb;color:#fff;padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center;}
h1{margin:0;font-size:1.4rem;}
button{border:none;border-radius:4px;padding:0.5rem 1rem;font-weight:bold;cursor:pointer;color:#fff;}
.btn-warning{background:#f59e0b;color:#000;}
input,select{border:1px solid #ccc;border-radius:4px;padding:5px 8px;}
.flex{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;}
.nav{background:#e8edf3;display:flex;justify-content:center;gap:1rem;padding:0.6rem;}
.nav a{text-decoration:none;color:#2563eb;font-weight:bold;}
.nav a.active{text-decoration:underline;}
@media print{.no-print{display:none!important;}}
</style>
</head>
<body>
<div id="top" class="no-print">
  <header><h1>Planning du mois</h1><div>✔️ Active</div></header>
  <div class="nav">
    <a href="index.html">Entreprise</a>
    <a href="salaries.html">Salariés</a>
    <a href="planning.html" class="active">Planning</a>
  </div>
  <div style="background:#f8fafc;padding:0.8rem;">
    <div class="flex">
      <div><label>Mois :</label><br><input type="month" id="moisPlanning"></div>
      <div><button class="btn-warning" onclick="genererPlanning()">🗓 Recharger</button></div>
    </div>
  </div>
</div>

<div style="margin-top:140px;">
  <div id="planning-wrapper"></div>
</div>

<script>
let salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
let heures   = JSON.parse(localStorage.getItem('heuresdata') || '{}');

function genOptionsHeures(v){
  let o='';for(let i=0;i<=10;i+=0.25){const l=i.toFixed(2).replace('.00','');o+=`<option value="${i}" ${Math.abs(i-(+v||0))<0.001?'selected':''}>${l}</option>`;}
  return o;
}

function genererPlanning(){
  salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  heures   = JSON.parse(localStorage.getItem('heuresdata') || '{}');
  const container=document.getElementById("planning-wrapper");
  const moisSel=document.getElementById("moisPlanning").value;
  if(!moisSel){container.innerHTML="<p style='padding:1rem;'>Choisissez un mois.</p>";return;}
  const [a,m]=moisSel.split("-");
  const debut=new Date(+a,+m-1,1);
  const fin=new Date(+a,+m,0);
  const jours=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
  container.innerHTML="";

  for(let d=new Date(debut);d<=fin;d.setDate(d.getDate()+1)){
    if(d.getDay()===0)continue; // pas dimanche
    const jourNom=jours[d.getDay()];
    const dateStr=d.toISOString().split("T")[0];
    let html=`<h3 style="background:#dbeafe;padding:0.3rem;">${jourNom} ${d.toLocaleDateString("fr-FR")}</h3>
      <table style="width:100%;border-collapse:collapse;font-size:0.8rem;margin-bottom:0.5rem;">
      <thead><tr style="background:#e5e7eb">
        <th style="width:140px;border:1px solid #ccc;">Salarié</th>
        <th>Ch1</th><th>Ch2</th><th>Ch3</th><th>Ch4</th><th>Ch5</th>
        <th>Total</th><th>Abs.</th><th>Prévu</th><th>Écart</th>
      </tr></thead><tbody>`;

    salaries.forEach(s=>{
      const entree=new Date(s.dateEntree);
      const sortie=s.dateSortie?new Date(s.dateSortie):null;
      if(d<entree || (sortie && d>sortie))return;

      const hJ=s.heuresParJour || {};
      const cleJour=["dim","lun","mar","mer","jeu","ven","sam"][d.getDay()];
      let total=0;
      let row=`<tr><td style="font-weight:bold;border:1px solid #ccc;padding:3px;">${s.prenom} ${s.nom}</td>`;
      for(let i=1;i<=5;i++){
        const k=`${s.id}${dateStr}ch${i}`;
        const data=heures[k]||{chantier:"",heures:0};
        total+=parseFloat(data.heures)||0;
        row+=`<td style="border:1px solid #ccc;padding:2px;">
          <input value="${data.chantier}" placeholder="Chantier" style="width:90px;"
            oninput="saveHeure('${k}',this.value,document.getElementById('${k}h').value)">
          <select id="${k}h" style="width:60px;" onchange="saveHeure('${k}',document.querySelector('input[oninput*=${k}]').value,this.value)">
            ${genOptionsHeures(data.heures)}
          </select>
        </td>`;
      }

      const absK=`${s.id}${dateStr}abs`;
      const abs=heures[absK]?.heures||0;
      const prevu=hJ[cleJour]||0;
      const ec=total - prevu + abs;

      row+=`<td style="border:1px solid #ccc;text-align:center;">${total.toFixed(1)}</td>
             <td style="border:1px solid #ccc;text-align:center;">
               <select id="${absK}h" style="width:60px;" onchange="saveHeure('${absK}','absence',this.value)">
                 ${genOptionsHeures(abs)}
               </select>
             </td>
             <td style="border:1px solid #ccc;text-align:center;">${prevu.toFixed(1)}</td>
             <td style="border:1px solid #ccc;text-align:center;color:${ec<0?'red':'green'}">${ec>=0?'+':''}${ec.toFixed(1)}</td></tr>`;
      html+=row;
    });

    html+="</tbody></table>";
    container.innerHTML+=html;
  }
}

function saveHeure(k,ch,h){
  heures[k]={chantier:ch,heures:parseFloat(h)||0};
  localStorage.setItem("heuresdata",JSON.stringify(heures));
}

document.addEventListener("DOMContentLoaded",()=>{
  const now=new Date();
  document.getElementById("moisPlanning").value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  genererPlanning();
});

/* 🔄 Mise à jour automatique quand des salariés sont ajoutés dans l'autre page */
window.addEventListener("storage",(e)=>{
  if(e.key==="majPlanning") genererPlanning();
});
</script>
</body>
</html>
