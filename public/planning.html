<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Planning du mois</title>
<link rel="stylesheet" href="assets/style.css" />

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}
h1 { margin: 0; font-size: 1.4rem; }
.nav { background: #e8edf3; display: flex; justify-content: center; gap: 1rem; padding: 0.6rem; }
.nav a { text-decoration: none; color: #2563eb; font-weight: bold; }
.nav a.active { text-decoration: underline; }

button { border: none; border-radius: 4px; padding: 0.5rem 1rem; font-weight: bold; cursor: pointer; color: #fff; }
.btn-warning { background: #f59e0b; color: #000; }

.flex { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }

@media print {
  .no-print { display: none !important; }
  body { background: white; color: black; margin-top: 0 !important; }
}

/* Ligne totaux */
#totaux {
  position: relative;
  z-index: 20;
  background: #e0e7ff;
  border-top: 2px solid #2563eb;
  font-weight: bold;
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.8rem;
  font-size: 0.9rem;
}
#totaux th { padding: 6px; color: #111827; }
#totaux tr { background: #c7d2fe; }
</style>
</head>

<body>
<header class="main-header" style="background:#2563eb;color:#fff;padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center;">
  <div class="entreprise-nom" id="entreprise-nom"></div>
  <h1 class="page-title">Planning du mois</h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div id="licence-status">✔️ Active</div>
  </div>
</header>

<div class="nav">
  <a href="index.html">Entreprise</a>
  <a href="salaries.html">Salariés</a>
  <a href="planning.html" class="active">Planning</a>
  <a href="rapports.html">Rapports</a>
</div>

<!-- === Zone filtres + jauge + totaux === -->
<section style="background:#f8fafc;padding:0.8rem;">
  <div class="flex">
    <div><label>Mois :</label><br><input type="month" id="moisPlanning" /></div>
    <div style="position:relative;">
      <label>Filtrer salariés :</label><br>
      <input type="text" id="salarieSearch" placeholder="Rechercher" style="width:200px;" />
    </div>
    <div><label>Semaine à imprimer :</label><br><select id="semaineSelect"></select></div>
    <div><button class="btn btn-warning" onclick="imprimerSemaine()">🖨 Imprimer</button></div>
  </div>

<!-- Zone de paramétrage -->
<div style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:#111;">
  <label>Rouge → Orange à </label>
  <input id="seuil-orange" type="number" min="0" max="200" step="1" value="80"
         style="width:60px;text-align:center;border:1px solid #999;border-radius:4px;"> %

  <label>Orange → Vert à </label>
  <input id="seuil-vert" type="number" min="0" max="200" step="1" value="100"
         style="width:60px;text-align:center;border:1px solid #999;border-radius:4px;"> %

  <label style="margin-left:1rem;display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="figer-param" />
    Figer
  </label>
</div>


<!-- Ligne Totaux du mois parfaitement alignée avec les colonnes du planning -->
<table id="totaux" style="width:100%;border-collapse:collapse;margin-top:0.8rem;font-size:0.9rem;background:#eef2ff;">
  <thead>
    <tr style="background:#c7d2fe;">
      <th style="padding:6px;text-align:left;width:150px;">Totaux du mois</th>
      <!-- 5 colonnes Chantiers -->
      <th style="width:182px;"></th>
      <th style="width:182px;"></th>
      <th style="width:182px;"></th>
      <th style="width:182px;"></th>
      <th style="width:182px;"></th>
      <!-- Colonnes Total / Abs / Prévu / Écart -->
      <th id="tot-total" style="width:80px;text-align:center;">0</th>
      <th id="tot-abs"   style="width:80px;text-align:center;">0</th>
      <th id="tot-prev"  style="width:80px;text-align:center;">0</th>
      <th id="tot-ecart" style="width:80px;text-align:center;">0</th>
    </tr>
  </thead>
</table>

</section>

<!-- === Contenu principal === -->
<div style="background:#fff;margin:1rem;box-shadow:0 2px 5px rgba(0,0,0,0.1);border-radius:6px;padding:1rem;">
  <div id="planning-wrapper"></div>
</div>

<script src="assets/script.js"></script>
</body>
</html>
