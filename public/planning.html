  <style>
  body { margin:0; font-family:Arial,sans-serif; background:#f4f6f8; color:#222; }

  .top-bar {

<script>
let salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
let heures   = JSON.parse(localStorage.getItem('heuresdata')   || '{}');
let salariesCoches = new Set();

/* ====== DÉCALAGE BARRE FIXE ====== */
function ajusterMarginTop() {
  const topBar = document.querySelector('.top-bar');
  const wrapper = document.getElementById('planning-wrapper');
  if (topBar && wrapper) {
    wrapper.style.marginTop = (topBar.offsetHeight + 8) + 'px';
  }
}

/* ====== FILTRE SALARIÉS (style Excel) ====== */
function initFiltre() {
  salariesCoches.clear();
  salaries.forEach(s => salariesCoches.add(s.id));
  majBoutonFiltre();
}

function ouvrirFiltreSalaries(btn) {
  const items = salaries.map(s => ({ value: s.id, label: s.prenom + ' ' + s.nom }));
  FiltreExcel.ouvrir({
    button: btn,
    items: items,
    selected: salariesCoches,
    onApply: (selectedSet) => {
      salariesCoches = selectedSet;
      majBoutonFiltre();
      genererPlanning();
    }
  });
}

function majBoutonFiltre() {
  const btn = document.getElementById('btn-filtre-salaries');
  if (!btn) return;
  const total = salaries.length;
  const items = salaries.map(s => ({ value: s.id, label: s.prenom + ' ' + s.nom }));
  btn.textContent = FiltreExcel.libelle(salariesCoches, total, items) + ' ▼';
  if (salariesCoches.size === total || salariesCoches.size === 0) {
    btn.classList.remove('fexc-active');
  } else {
    btn.classList.add('fexc-active');
  }
}

/* ====== JAUGE CIRCULAIRE ====== */
/* Les seuils sont paramétrés sur la page Entreprise.
   Ici on les lit en lecture seule depuis le localStorage. */

function getSeuilsJauge() {
  const r = parseInt(localStorage.getItem('jaugeRouge'))  || 33;
  const o = parseInt(localStorage.getItem('jaugeOrange')) || 66;
  return {
    rouge:  Math.max(0, Math.min(100, r)),
    orange: Math.max(0, Math.min(100, o))
  };
}

function arcPathJauge(pctFrom, pctTo) {
  if (pctTo <= pctFrom) return '';
  const a1 = Math.PI * (1 + pctFrom / 100);
  const a2 = Math.PI * (1 + pctTo / 100);
  const x1 = 50 + 40 * Math.cos(a1), y1 = 60 + 40 * Math.sin(a1);
  const x2 = 50 + 40 * Math.cos(a2), y2 = 60 + 40 * Math.sin(a2);
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A 40 40 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

function dessinerJauge(pct) {
  const { rouge, orange } = getSeuilsJauge();
  const ar = document.getElementById('arc-rouge');
  const ao = document.getElementById('arc-orange');
  const av = document.getElementById('arc-vert');
  const pourcentage = document.getElementById('pourcentage');

  if (!ar || !ao || !av) return;

  const cap = Math.max(0, Math.min(100, pct));
  ar.setAttribute('d', arcPathJauge(0, Math.min(cap, rouge)));
  ao.setAttribute('d', cap > rouge ? arcPathJauge(rouge, Math.min(cap, orange)) : '');
  av.setAttribute('d', cap > orange ? arcPathJauge(orange, cap) : '');

  if (pourcentage) {
    pourcentage.textContent = (pct || 0).toFixed(0) + '%';
    // Couleur du chiffre selon la zone
    let color = '#0f172a';
    if (cap < rouge)         color = '#dc2626';
    else if (cap < orange)   color = '#b45309';
    else                     color = '#16a34a';
    pourcentage.setAttribute('fill', color);
  }
}

/* Conservées pour rétro-compatibilité — appellent les nouvelles fonctions */
function chargerJauge() { /* plus rien à faire au chargement, les seuils sont lus dynamiquement */ }
function sauverSeuilsLS() {}
function majEtatFiger() {}
function majZonesJauge() { dessinerJauge(parseFloat(document.getElementById('pourcentage')?.textContent) || 0); }

/* ====== PLANNING ====== */
// Cache des options de base (sans sélection)
const _optionsBase = (() => {
  const vals = [];
  for (let i = 0; i <= 10; i += 0.25) vals.push(i);
  return vals;
})();
const _optionsBaseHTML = _optionsBase.map(i => {
  const lbl = i === Math.floor(i) ? i : i.toFixed(2);
  return `<option value="${i}">${lbl}</option>`;
}).join('');

// Cache par valeur sélectionnée
const _optsCache = {};
function genOptionsHeures(v) {
  const key = (+v || 0).toFixed(2);
  if (_optsCache[key]) return _optsCache[key];
  const target = +v || 0;
  let opt = '';
  for (const i of _optionsBase) {
    const lbl = i === Math.floor(i) ? i : i.toFixed(2);
    const sel = Math.abs(i - target) < 0.001 ? ' selected' : '';
    opt += `<option value="${i}"${sel}>${lbl}</option>`;
  }
  _optsCache[key] = opt;
  return opt;
}

function genererPlanning() {
  salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  heures   = JSON.parse(localStorage.getItem('heuresdata')   || '{}');

  const cont    = document.getElementById('planning-wrapper');
  const moisSel = document.getElementById('moisPlanning').value;
  if (!moisSel) {
    cont.innerHTML = "<p style='padding:1rem;color:#6b7280;'>Choisissez un mois pour afficher le planning.</p>";
    return;
  }

  const idsAffiches    = salariesCoches.size === 0 ? new Set(salaries.map(s => s.id)) : salariesCoches;
  const salariesAffiches = salaries.filter(s => idsAffiches.has(s.id));

  const [a, m] = moisSel.split('-');
  const debut  = new Date(+a, +m - 1, 1);
  const fin    = new Date(+a, +m, 0);
  const jours  = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];

  // Pré-calculer les dates d'entrée/sortie une fois
  const salsAvecDates = salariesAffiches.map(s => ({
    s,
    entree: new Date(s.dateEntree),
    sortie: s.dateSortie ? new Date(s.dateSortie + 'T23:59:59') : null
  }));

  let htmlTotal = '';         // accumuler tout le HTML
  const joursData = [];       // pour remplir prévu/écart après injection

  for (let d = new Date(debut); d <= fin; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0) continue; // pas de dimanche

    const jourNom = jours[d.getDay()];
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const safeDate = dateStr.replace(/-/g, '_');

    let htmlJour = `<div class="jour-block">`;
    htmlJour += `<h3 style="background:#dbeafe;padding:0.3rem 0.6rem;margin:0.3rem 0 0 0;border-radius:4px;">${jourNom} ${d.toLocaleDateString('fr-FR')}</h3>`;
    htmlJour += `<table style="width:100%;border-collapse:collapse;font-size:0.8rem;margin-bottom:0.3rem;">
      <thead><tr style="background:#e2e8f0;">
        <th style="border:1px solid #ccc;width:150px;">Salariés</th>
        <th style="border:1px solid #ccc;width:210px;">Ch 1</th>
        <th style="border:1px solid #ccc;width:210px;">Ch 2</th>
        <th style="border:1px solid #ccc;width:210px;">Ch 3</th>
        <th style="border:1px solid #ccc;width:210px;">Ch 4</th>
        <th style="border:1px solid #ccc;width:210px;">Ch 5</th>
        <th style="border:1px solid #ccc;width:55px;">Total</th>
        <th class="col-abs"   style="border:1px solid #ccc;width:55px;">Abs.</th>
        <th class="col-prevu" style="border:1px solid #ccc;width:55px;">Prévu</th>
        <th class="col-ecart" style="border:1px solid #ccc;width:55px;">Écart</th>
      </tr></thead><tbody>`;

    let lignes = '';
    let totalJour = 0;
    const lignesData = []; // { prevu, ec } par salarié, pour remplir prevu/ecart après

    salsAvecDates.forEach(({ s, entree: e, sortie: srt }) => {
      if (d < e || (srt && d > srt)) return;

      const hp    = s.heuresParJour || {};
      const cle   = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'][d.getDay()];
      const prevu = hp[cle] || 0;

      let total = 0;
      let row = `<tr data-salarie="${s.id}" data-date="${dateStr}">
        <td style="font-weight:bold;border:1px solid #ccc;padding:3px 5px;">${s.prenom} ${s.nom}</td>`;

      for (let i = 1; i <= 5; i++) {
        const k    = `${s.id}${safeDate}ch${i}`;
        const data = heures[k] || { chantier: '', heures: 0 };
        total += parseFloat(data.heures) || 0;
        row += `<td style="border:1px solid #ccc;padding:2px;">
          <input id="${k}chantier" value="${data.chantier}" placeholder="Chantier" style="width:165px;"
            oninput="saveHeure('${k}',this.value,document.getElementById('${k}h').value)">
          <select id="${k}h" style="width:58px;"
            onchange="saveHeure('${k}',document.getElementById('${k}chantier').value,this.value)">
            ${genOptionsHeures(data.heures)}
          </select>
        </td>`;
      }

      const absK = `${s.id}${safeDate}abs`;
      const abs  = heures[absK]?.heures || 0;
      const ec   = total - prevu + abs;
      totalJour += total;

      // Prévu et Écart laissés vides — remplis après selon totalJour
      row += `
        <td class="cell-total" style="border:1px solid #ccc;text-align:center;">${total.toFixed(1)}</td>
        <td class="cell-abs col-abs" style="border:1px solid #ccc;text-align:center;">
          <select data-type="abs" id="${absK}h" style="width:55px;"
            onchange="saveHeure('${absK}','absence',this.value)">
            ${genOptionsHeures(abs)}
          </select>
        </td>
        <td class="cell-prevu col-prevu" style="border:1px solid #ccc;text-align:center;"></td>
        <td class="cell-ecart col-ecart" style="border:1px solid #ccc;text-align:center;"></td>
        </tr>`;

      lignes += row;
      lignesData.push({ salarieId: s.id, prevu, ec });
    });

    htmlJour += lignes + '</tbody></table></div>';
    htmlTotal += htmlJour;
    if (totalJour > 0) joursData.push({ dateStr, lignesData });
  }

  // Injection unique dans le DOM (x26 fois plus rapide que += dans la boucle)
  cont.innerHTML = htmlTotal;

  // Remplir Prévu et Écart après injection
  joursData.forEach(({ dateStr, lignesData }) => {
    lignesData.forEach(({ salarieId, prevu, ec }) => {
      const tr = cont.querySelector(`tr[data-salarie="${salarieId}"][data-date="${dateStr}"]`);
      if (!tr) return;
      tr.querySelector('.cell-prevu').textContent = prevu.toFixed(1);
      const ecCell = tr.querySelector('.cell-ecart');
      ecCell.textContent = (ec >= 0 ? '+' : '') + ec.toFixed(1);
      ecCell.style.color = ec < 0 ? 'red' : 'green';
    });
  });

  majTotauxGlobaux();
  ajusterMarginTop();
}

/* ====== SAUVEGARDE TEMPS RÉEL ====== */
function saveHeure(k, ch, h) {
  heures[k] = { chantier: ch, heures: parseFloat(h) || 0 };
  localStorage.setItem('heuresdata', JSON.stringify(heures));

  const match = k.match(/^(\d+)(\d{4}_\d{2}_\d{2})/);
  if (!match) return;
  majTotalLigne(match[1], match[2].replace(/_/g, '-'));
}

function majTotalLigne(salarieId, dateStr) {
  const tr = document.querySelector(`tr[data-salarie="${salarieId}"][data-date="${dateStr}"]`);
  if (!tr) return;

  const safeDate = dateStr.replace(/-/g, '_');
  let total = 0;
  for (let i = 1; i <= 5; i++) {
    total += parseFloat(heures[`${salarieId}${safeDate}ch${i}`]?.heures || 0);
  }

  const absK  = `${salarieId}${safeDate}abs`;
  const abs   = parseFloat(heures[absK]?.heures || 0);
  const sal   = salaries.find(s => s.id == salarieId);
  if (!sal) return;

  const jour  = new Date(dateStr).getDay();
  const cle   = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'][jour];
  const prevu = sal.heuresParJour?.[cle] || 0;
  const ecart = total - prevu + abs;

  tr.querySelector('.cell-total').textContent = total.toFixed(1);

  // Vérifier si AU MOINS UN salarié a des heures ce jour-là
  const tousLesTrs = document.querySelectorAll(`tr[data-date="${dateStr}"]`);
  let jourADesHeures = false;
  tousLesTrs.forEach(row => {
    const t = parseFloat(row.querySelector('.cell-total')?.textContent) || 0;
    if (t > 0) jourADesHeures = true;
  });

  // Mettre à jour toutes les lignes de la journée
  tousLesTrs.forEach(row => {
    const idSal  = row.dataset.salarie;
    const salRow = salaries.find(s => s.id == idSal);
    if (!salRow) return;
    const prevuRow = salRow.heuresParJour?.[cle] || 0;
    const totalRow = parseFloat(row.querySelector('.cell-total')?.textContent) || 0;
    const absRow   = parseFloat(row.querySelector("select[data-type='abs']")?.value) || 0;
    const ecartRow = totalRow - prevuRow + absRow;

    const prevuCell = row.querySelector('.cell-prevu');
    const ecCell    = row.querySelector('.cell-ecart');
    if (jourADesHeures) {
      prevuCell.textContent  = prevuRow.toFixed(1);
      ecCell.textContent     = (ecartRow >= 0 ? '+' : '') + ecartRow.toFixed(1);
      ecCell.style.color     = ecartRow < 0 ? 'red' : 'green';
    } else {
      prevuCell.textContent  = '';
      ecCell.textContent     = '';
    }
  });

  majTotauxGlobaux();
}

function majTotauxGlobaux() {
  let totT = 0, totA = 0, totP = 0;
  document.querySelectorAll('tr[data-salarie]').forEach(tr => {
    totT += parseFloat(tr.querySelector('.cell-total')?.textContent) || 0;
    totA += parseFloat(tr.querySelector("select[data-type='abs']")?.value) || 0;
    totP += parseFloat(tr.querySelector('.cell-prevu')?.textContent) || 0;
  });

  const ec = totT - totP;
  document.getElementById('tot-total').textContent = totT.toFixed(1) + ' h';
  document.getElementById('tot-prev').textContent  = totP.toFixed(1) + ' h';
  const ligneEcart = document.getElementById('ligne-ecart');
  const tdEcart    = document.getElementById('tot-ecart');
  tdEcart.textContent = (ec >= 0 ? '+' : '') + ec.toFixed(1) + ' h';
  if (ec < 0) {
    tdEcart.style.color = '#dc2626';
    ligneEcart.style.background = '#fef2f2';
  } else {
    tdEcart.style.color = '#16a34a';
    ligneEcart.style.background = '#f0fdf4';
  }

  const pct = totP > 0 ? (totT / totP) * 100 : 0;
  dessinerJauge(pct);
}

/* ====== IMPRESSION ====== */
function chargerSemaines() {
  const m   = document.getElementById('moisPlanning').value;
  const sel = document.getElementById('semaineSelect');
  sel.innerHTML = '<option value="">— Mois complet —</option>';
  if (!m) return;

  const [a, mo] = m.split('-').map(Number);
  const dL = new Date(a, mo, 0);
  let lun = new Date(a, mo - 1, 1);
  while (lun.getDay() !== 1) lun.setDate(lun.getDate() + 1);

  let i = 1;
  while (lun <= dL) {
    const sam = new Date(lun);
    sam.setDate(lun.getDate() + 5);
    const op = document.createElement('option');
    op.value = i;
    op.textContent = `Semaine ${i} : ${lun.toLocaleDateString('fr-FR')} → ${sam.toLocaleDateString('fr-FR')}`;
    sel.appendChild(op);
    lun.setDate(lun.getDate() + 7);
    i++;
  }
}

function imprimerSemaine() {
  const semaine = document.getElementById('semaineSelect').value;
  const mois    = document.getElementById('moisPlanning').value;
  if (!mois) { alert('Veuillez sélectionner un mois.'); return; }

  // Appliquer le filtrage des colonnes CH selon les cases cochées
  const classesAjoutees = [];
  let nbChCoches = 0;
  document.querySelectorAll('.print-ch-cb').forEach(cb => {
    if (cb.checked) {
      nbChCoches++;
    } else {
      const cls = 'hide-ch' + cb.dataset.ch;
      document.body.classList.add(cls);
      classesAjoutees.push(cls);
    }
  });

  // Calcul du facteur de zoom : on agrandit le tableau proportionnellement
  // à la largeur "perdue" par les colonnes décochées, +50% pour bien remplir.
  // Largeur d'origine = 150 (Salariés) + 5×210 (Ch) + 55 (Total) = 1255 px
  // Largeur restante  = 150 + nbChCoches×210 + 55
  const LARG_ORIG = 1255;
  const largRestante = 150 + nbChCoches * 210 + 55;
  let zoom = nbChCoches > 0 ? (LARG_ORIG / largRestante) : 1;
  // Bonus +50% : seulement quand des colonnes sont masquées
  if (nbChCoches > 0 && nbChCoches < 5) zoom *= 1.5;

  // Appliquer le zoom sur le contenu imprimable, centré horizontalement
  const wrapper = document.getElementById('planning-wrapper');
  const ancienTransform       = wrapper.style.transform;
  const ancienTransformOrigin = wrapper.style.transformOrigin;
  const ancienWidth           = wrapper.style.width;
  const ancienMargin          = wrapper.style.margin;
  if (zoom > 1) {
    wrapper.style.transformOrigin = 'top center';
    wrapper.style.transform = 'scale(' + zoom + ')';
    wrapper.style.width = (100 / zoom) + '%';
    wrapper.style.margin = '0 auto';
  } else {
    wrapper.style.margin = '0 auto';
  }

  const restaurer = () => {
    classesAjoutees.forEach(cls => document.body.classList.remove(cls));
    document.querySelectorAll('#planning-wrapper .jour-block').forEach(b => b.style.display = '');
    wrapper.style.transform       = ancienTransform;
    wrapper.style.transformOrigin = ancienTransformOrigin;
    wrapper.style.width           = ancienWidth;
    wrapper.style.margin          = ancienMargin;
  };

  if (!semaine) {
    window.print();
    restaurer();
    return;
  }

  const [a, mo] = mois.split('-').map(Number);
  let lun = new Date(a, mo - 1, 1);
  while (lun.getDay() !== 1) lun.setDate(lun.getDate() + 1);
  lun.setDate(lun.getDate() + (parseInt(semaine) - 1) * 7);
  const sam = new Date(lun);
  sam.setDate(lun.getDate() + 5);

  document.querySelectorAll('#planning-wrapper .jour-block').forEach(bloc => {
    const h3 = bloc.querySelector('h3');
    if (!h3) return;
    const match = h3.textContent.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (match) {
      const dateJour = new Date(match[3], match[2] - 1, match[1]);
      bloc.style.display = (dateJour >= lun && dateJour <= sam) ? '' : 'none';
    }
  });

  window.print();
  restaurer();
}

/* ════════════════════════════════════════════════
   TOOLTIP INFO CHANTIER (au survol d'un nom)
   ════════════════════════════════════════════════ */
let _tooltipEl = null;
let _tooltipTimer = null;

function getTooltipEl() {
  if (!_tooltipEl) {
    _tooltipEl = document.createElement('div');
    _tooltipEl.className = 'chantier-tooltip';
    document.body.appendChild(_tooltipEl);
  }
  return _tooltipEl;
}

/** Agrège les heures pour un nom de chantier donné, toutes années confondues. */
function getStatsChantier(nomChantier) {
  if (!nomChantier) return null;
  const ref = normaliserChantier(nomChantier);
  if (!ref) return null;

  const heuresAll = JSON.parse(localStorage.getItem('heuresdata') || '{}');
  const salariesAll = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  const salById = Object.fromEntries(salariesAll.map(s => [s.id, s.prenom + ' ' + s.nom]));

  let total = 0;
  const parSalarie = new Map();   // id -> heures
  let dateMin = null, dateMax = null;

  for (const k in heuresAll) {
    const d = heuresAll[k];
    if (!d || !d.chantier || !d.heures) continue;
    if (normaliserChantier(d.chantier) !== ref) continue;
    // Clé : {id}{YYYY}_{MM}_{DD}ch{N}
    // L'id est un timestamp (13 chiffres aujourd'hui), suivi directement de l'année.
    // On le découpe en repérant l'année 4 chiffres + _MM_DD ch{N} en fin.
    const m = k.match(/^(\d+?)(\d{4})_(\d{2})_(\d{2})ch\d+$/);
    if (!m) continue;
    const idSal = m[1];
    const dateStr = `${m[2]}-${m[3]}-${m[4]}`;
    const h = parseFloat(d.heures) || 0;
    total += h;
    parSalarie.set(idSal, (parSalarie.get(idSal) || 0) + h);
    if (!dateMin || dateStr < dateMin) dateMin = dateStr;
    if (!dateMax || dateStr > dateMax) dateMax = dateStr;
  }

  const liste = [...parSalarie.entries()]
    .map(([id, h]) => ({ nom: salById[id] || ('Salarié #' + id), heures: h }))
    .sort((a, b) => b.heures - a.heures);

  return { total, liste, dateMin, dateMax };
}

/** Normalise un nom de chantier pour comparaison (casse, espaces, accents). */
function normaliserChantier(s) {
  return (s || '').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function formatHeures(h) {
  if (!h) return '0h';
  const heures = Math.floor(h);
  const min = Math.round((h - heures) * 60);
  if (min === 0) return heures + 'h';
  return heures + 'h' + String(min).padStart(2, '0');
}

function formatDateFr(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function montrerTooltipChantier(input) {
  const nom = (input.value || '').trim();
  if (!nom) { cacherTooltip(); return; }

  const stats = getStatsChantier(nom);
  if (!stats || stats.total === 0) { cacherTooltip(); return; }

  const el = getTooltipEl();
  let html = `<div class="ct-nom">${escapeHtml(nom)}</div>`;
  html += `<div class="ct-total">Total planifié : <strong>${formatHeures(stats.total)}</strong></div>`;
  if (stats.liste.length > 0) {
    html += '<div class="ct-label">Salariés intervenus</div>';
    stats.liste.forEach(s => {
      html += `<div class="ct-sal">
        <span class="ct-sal-nom">${escapeHtml(s.nom)}</span>
        <span class="ct-sal-h">${formatHeures(s.heures)}</span>
      </div>`;
    });
  }
  if (stats.dateMin && stats.dateMax) {
    html += `<div class="ct-periode">Du ${formatDateFr(stats.dateMin)} au ${formatDateFr(stats.dateMax)}</div>`;
  }
  el.innerHTML = html;

  // Positionner près de l'input
  const r = input.getBoundingClientRect();
  el.style.visibility = 'hidden';
  el.classList.add('visible');
  const tt = el.getBoundingClientRect();
  let top  = r.bottom + 6;
  let left = r.left;
  if (top + tt.height > window.innerHeight - 10) top = r.top - tt.height - 6;
  if (left + tt.width  > window.innerWidth  - 10) left = window.innerWidth - tt.width - 10;
  if (left < 6) left = 6;
  el.style.top  = top + 'px';
  el.style.left = left + 'px';
  el.style.visibility = 'visible';
}

function cacherTooltip() {
  if (_tooltipTimer) { clearTimeout(_tooltipTimer); _tooltipTimer = null; }
  if (_tooltipEl) _tooltipEl.classList.remove('visible');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

/* Délégation d'événements sur tout le wrapper du planning. */
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.getElementById('planning-wrapper');
  if (!wrap) return;
  wrap.addEventListener('mouseover', e => {
    const t = e.target;
    if (t.tagName === 'INPUT' && t.id && t.id.endsWith('chantier')) {
      // Délai léger pour ne pas spammer
      if (_tooltipTimer) clearTimeout(_tooltipTimer);
      _tooltipTimer = setTimeout(() => montrerTooltipChantier(t), 350);
    }
  });
  wrap.addEventListener('mouseout', e => {
    const t = e.target;
    if (t.tagName === 'INPUT' && t.id && t.id.endsWith('chantier')) {
      cacherTooltip();
    }
  });
  // Cacher aussi à la frappe ou au focus pour ne pas gêner la saisie
  wrap.addEventListener('input', e => {
    if (e.target.tagName === 'INPUT') cacherTooltip();
  });
  wrap.addEventListener('focusin', e => {
    if (e.target.tagName === 'INPUT' && e.target.id && e.target.id.endsWith('chantier')) {
      cacherTooltip();
    }
  });
});
