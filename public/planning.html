<!-- Active le lien Volitis et l'affichage du nom d'entreprise -->
<script>
window.addEventListener("DOMContentLoaded", () => {
  // clic sur le logo Volitis
  const v = document.getElementById("volitis-link");
  if (v) v.addEventListener("click", () => window.open("https://volitis.net/", "_blank", "noopener"));

  // affiche le nom d'entreprise dans le header
  const headerNom = document.getElementById("entreprise-nom");
  if (headerNom && entreprise.nom) {
    headerNom.textContent = entreprise.nom;
  }
});
