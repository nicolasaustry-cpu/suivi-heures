<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suiv'Heures</title>
  <script>
    // Aiguillage au démarrage de l'application installée (PWA) :
    //   - Téléphone ou tablette -> page de saisie des heures (version mobile)
    //   - Ordinateur (PC)       -> page Entreprise (espace de gestion)
    (function () {
      function estMobileOuTablette() {
      var ua = navigator.userAgent || navigator.vendor || "";
      // Téléphones et tablettes qui s'annoncent comme tels
      if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Silk|Kindle|PlayBook|Tablet/i.test(ua)) return true;
      // iPad (iPadOS 13+) : Safari se présente comme un Mac, mais un Mac n'a pas d'écran tactile
      if (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
      // Tablette Android en mode « site pour ordinateur » (par défaut sur Chrome/Samsung Internet)
      // ou tablette Windows sans clavier : le doigt est le pointeur principal et rien ne survole.
      // Un PC à écran tactile garde la souris/pavé comme pointeur principal -> reste en version PC.
      var mm = window.matchMedia;
      if (mm && mm('(pointer: coarse)').matches && mm('(hover: none)').matches) return true;
      return false;
    }
      var estMobile = false;
      try { estMobile = estMobileOuTablette(); } catch (e) {}
      location.replace(estMobile ? "/saisie.html" : "/index.html");
    })();
  </script>
</head>
<body style="font-family:Arial,Helvetica,sans-serif;background:#0f3a8a;color:#fff;margin:0;height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="text-align:center;">
    <div style="font-size:19px;font-weight:bold;">Suiv'Heures</div>
    <div style="font-size:14px;opacity:.85;margin-top:6px;">Ouverture de l'application…</div>
    <noscript>
      <div style="margin-top:12px;">
        <a href="/index.html" style="color:#f59e0b;">Espace gestion (PC)</a> &nbsp;·&nbsp;
        <a href="/saisie.html" style="color:#f59e0b;">Saisie (mobile)</a>
      </div>
    </noscript>
  </div>
</body>
</html>
