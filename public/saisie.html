<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Saisie – Suiv'Heures</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Suiv'Heures">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: Arial, sans-serif; color: #222; margin: 0; padding: 0; background: #fff; }

  /* Bandeau navigation desktop */
  .nav-desktop {
    display: none; width: 100%; background: #1e3a8a;
    padding: 0.5rem 1rem; align-items: center;
    gap: 1rem; flex-wrap: wrap; justify-content: center;
  }
  .nav-desktop a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
  .nav-desktop a:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .nav-desktop .nav-titre { color: #fff; font-weight: 800; font-size: 0.95rem; margin-right: 0.5rem; }

  /* Cadre téléphone */
  .phone-wrap { width: 100%; }

  /* Desktop : centrer dans un cadre téléphone */
  @media (min-width: 600px) {
    body { background: #e2e8f0; min-height: 100vh; }
    .nav-desktop { display: flex; }
    .phone-wrap {
      width: 390px;
      margin: 1.5rem auto 2rem;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 0 0 8px #222, 0 20px 50px rgba(0,0,0,0.3);
      position: relative;
      height: 780px;
      display: flex;
      flex-direction: column;
    }
    /* PIN en position absolute dans le cadre */
    .phone-wrap .pin-screen {
      position: absolute !important;
      inset: 0 !important;
      z-index: 300;
    }
  }

  /* ── HEADER ── */
  header {
    background: #2563eb; color: #fff;
    padding: 0.8rem 1rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; flex: 1; text-align: center; }
  .back-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; padding: 0; }

  /* ── EN-TÊTE FIGÉ (bandeau bleu + bloc nom/date) ── */
  .entete-fixe {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  }

  /* ── SECTIONS ── */
  .section {
    background: #fff; margin: 0.5rem 0.8rem;
    border-radius: 10px; padding: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .section-title {
    font-size: 0.78rem; font-weight: 700; color: #6b7280;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 0.7rem; display: flex; align-items: center; gap: 6px;
  }
  .badge-prev { background: #dbeafe; color: #1d4ed8; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .badge-plus { background: #dcfce7; color: #15803d; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }

  /* ── CHAMP ── */
  .field { margin-bottom: 0.8rem; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: #6b7280; margin-bottom: 4px; }
  .field select, .field input[type="date"] {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 0.95rem; background: #f9fafb;
    color: #222; appearance: none;
  }
  .field select:focus, .field input:focus { border-color: #2563eb; outline: none; background: #fff; }

  /* ── CARTE CHANTIER ── */
  .chantier-card {
    border-radius: 8px; border: 1px solid #e5e7eb;
    padding: 0.8rem; margin-bottom: 0.6rem;
  }
  .chantier-card.previsionnel { background: #eff6ff; border-color: #bfdbfe; }
  .chantier-card.ajoute { background: #f9fafb; }

  .chantier-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 0.6rem;
  }
  .chantier-nom { font-size: 0.95rem; font-weight: 700; color: #1e3a8a; flex: 1; }
  .chantier-nom.libre { color: #374151; }
  .tag-prev { font-size: 0.68rem; color: #2563eb; background: #dbeafe; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; }
  .btn-suppr { background: none; border: none; color: #dc2626; font-size: 1.1rem; cursor: pointer; padding: 0 4px; }

  .time-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 6px; }
  .time-block { flex: 1; }
  .time-block label { font-size: 0.72rem; color: #6b7280; display: block; margin-bottom: 3px; }
  .time-block input[type="time"] {
    width: 100%; padding: 8px 6px; border: 1px solid #d1d5db;
    border-radius: 6px; font-size: 1rem; font-weight: 600;
    text-align: center; background: #fff; color: #222;
  }
  .time-sep { font-size: 1.2rem; color: #9ca3af; padding-bottom: 6px; }

  .duree-badge {
    background: #eff6ff; color: #1d4ed8;
    border-radius: 6px; padding: 4px 10px;
    font-size: 0.8rem; font-weight: 600;
    text-align: center; margin-bottom: 6px;
  }
  .duree-badge.vide { background: #f3f4f6; color: #9ca3af; }

  /* Déplacement */
  .depl-row {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 6px; padding: 6px 10px;
  }
  .depl-row label { font-size: 0.8rem; color: #6b7280; flex: 1; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .step-btn {
    width: 28px; height: 28px; border: 1px solid #d1d5db;
    border-radius: 6px; background: #f3f4f6; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; color: #374151;
  }
  .step-val { font-size: 0.9rem; font-weight: 700; min-width: 30px; text-align: center; }
  .step-unite { font-size: 0.75rem; color: #6b7280; }

  /* ── BOUTON AJOUTER ── */
  .btn-add {
    width: 100%; padding: 10px; border: 1px dashed #9ca3af;
    border-radius: 8px; background: transparent; color: #16a34a;
    font-size: 0.88rem; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  /* ── MODAL AJOUT CHANTIER ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 16px 16px 0 0;
    width: 100%; max-width: 480px; padding: 1.2rem;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; text-align: center; }
  .suggestions-list { margin-bottom: 0.8rem; }
  .suggestion-item {
    padding: 10px 12px; border: 1px solid #e5e7eb;
    border-radius: 8px; margin-bottom: 6px; cursor: pointer;
    font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
  }
  .suggestion-item:hover, .suggestion-item.selected { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; font-weight: 700; }
  .suggestion-item .ico { font-size: 1rem; }
  .input-libre {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 0.95rem; margin-bottom: 0.8rem;
  }
  .btn-modal-ok {
    width: 100%; padding: 12px; background: #2563eb; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .btn-modal-cancel {
    width: 100%; padding: 10px; background: transparent; color: #6b7280;
    border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.9rem;
    cursor: pointer; margin-top: 6px;
  }

  /* ── PIN ── */
  /* PIN : toujours plein écran */
  .pin-screen {
    position: fixed; inset: 0; background: #2563eb; z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .pin-screen h2 { color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem; }
  .pin-screen p  { color: rgba(255,255,255,0.8); font-size: 0.85rem; margin-bottom: 1.5rem; text-align:center; }
  .pin-screen select {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    font-size: 1rem; margin-bottom: 1rem; background: #fff;
  }
  .pin-dots { display: flex; gap: 12px; margin-bottom: 1.5rem; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6); background: transparent;
  }
  .pin-dot.filled { background: #fff; border-color: #fff; }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 280px; }
  .pin-key {
    padding: 16px; background: rgba(255,255,255,0.15); border: none;
    border-radius: 10px; color: #fff; font-size: 1.3rem; font-weight: 700;
    cursor: pointer; text-align: center;
  }
  .pin-key:active, .pin-key:hover { background: rgba(255,255,255,0.3); }
  .pin-error { color: #fca5a5; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2rem; }

  /* ── TOTAL + ENVOYER ── */
  .total-bar {
    background: #f0fdf4; border: 1px solid #bbf7d0;
    border-radius: 8px; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.8rem;
  }
  .total-lbl { font-size: 0.88rem; color: #15803d; font-weight: 600; }
  .total-val { font-size: 1.1rem; font-weight: 800; color: #15803d; }
  .btn-envoyer {
    width: 100%; padding: 14px; background: #16a34a; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-envoyer:disabled { background: #9ca3af; cursor: not-allowed; }

  /* ── HORAIRES EN BLOC ── */
  .heure-ligne {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px;
  }
  .heure-label {
    font-size: 0.85rem; color: #6b7280; font-weight: 700;
    width: 60px; flex-shrink: 0;
  }
  .heure-input {
    flex: 1; padding: 12px 8px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 1.15rem; font-weight: 700;
    text-align: center; background: #fff; color: #222;
  }
  .heure-input:focus { border-color: #2563eb; outline: none; }
  .btn-valider-heure {
    padding: 12px 16px; background: #2563eb; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem;
    font-weight: 700; cursor: pointer; white-space: nowrap;
    flex-shrink: 0; min-width: 70px;
  }
  .btn-valider-heure.valide { background: #16a34a; }
  .btn-valider-heure:active { opacity: 0.85; }
  .depl-row {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 6px; padding: 10px 12px;
    margin-bottom: 14px;
  }
  .btn-envoyer-chantier {
    width: 100%; padding: 14px; margin-top: 6px;
    border: none; border-radius: 8px; font-size: 1rem;
    font-weight: 700; cursor: pointer; color: #fff;
    background: #16a34a;
  }
  .btn-envoyer-chantier:active { opacity: 0.85; }
  .envoye-badge {
    width: 100%; padding: 12px; margin-top: 6px;
    background: #f0fdf4; border: 1px solid #86efac;
    border-radius: 8px; text-align: center;
    color: #15803d; font-weight: 700; font-size: 0.9rem;
  }

  /* ── INFO SALARIÉ FIXE ── */
  .saisie-info {
    background: #fff;
    padding: 0.6rem 0.8rem;
    border-bottom: 2px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    flex-shrink: 0;
  }
  .saisie-info .sal-nom { font-size: 1rem; font-weight: 700; color: #2563eb; }
  .saisie-info .sal-date { font-size: 0.85rem; color: #6b7280; font-weight: 600; }

  /* ── ZONE SCROLLABLE ── */
  .saisie-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ── ECRAN SAISIE EN FLEX COLUMN ── */
  #ecran-saisie {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  @media (max-width: 599px) {
    #ecran-saisie { height: 100vh; }
    .saisie-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  }
  </style>
</head>
<body>

<!-- Bandeau navigation (visible sur desktop uniquement) -->
<div class="nav-desktop">
  <span class="nav-titre">Suiv'Heures</span>
  <a href="index.html">Entreprise</a>
  <a href="salaries.html">Salariés</a>
  <a href="chantiers.html">Prévisionnel</a>
  <a href="planning.html">Planning</a>
  <a href="rapports.html">Rapports</a>
  <a href="realise.html">Planning réalisé</a>
</div>

<div class="phone-wrap">

<!-- ── ÉCRAN PIN ── -->
<div class="pin-screen" id="pin-screen" style="display:none;">
  <h2>Suiv'Heures</h2>
  <p id="pin-subtitle">Identifiez-vous pour saisir vos heures</p>

  <!-- ÉTAPE 1 : Code employé -->
  <div id="etape-code">
    <input type="text" id="pin-code-entreprise" placeholder="Code employé"
      style="width:100%;padding:12px;border-radius:8px;border:none;font-size:1rem;margin-bottom:0.5rem;text-transform:uppercase;text-align:center;"
      onkeydown="if(event.key==='Enter') validerCodeEntreprise()">
    <button id="btn-code-entreprise" onclick="validerCodeEntreprise()"
      style="width:100%;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:1rem;">
      Valider
    </button>
  </div>

  <!-- ÉTAPE 2 : Choix salarié + PIN (masqués au départ) -->
  <div id="etape-pin" style="display:none;width:100%;">
    <select id="pin-salarie" style="width:100%;padding:12px;border-radius:8px;border:none;font-size:1rem;margin-bottom:1rem;">
      <option value="">Choisir votre nom...</option>
    </select>

    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>

    <div class="pin-pad">
      <button class="pin-key" onclick="pinSaisir('1')">1</button>
      <button class="pin-key" onclick="pinSaisir('2')">2</button>
      <button class="pin-key" onclick="pinSaisir('3')">3</button>
      <button class="pin-key" onclick="pinSaisir('4')">4</button>
      <button class="pin-key" onclick="pinSaisir('5')">5</button>
      <button class="pin-key" onclick="pinSaisir('6')">6</button>
      <button class="pin-key" onclick="pinSaisir('7')">7</button>
      <button class="pin-key" onclick="pinSaisir('8')">8</button>
      <button class="pin-key" onclick="pinSaisir('9')">9</button>
      <button class="pin-key" onclick="pinEffacer()">⌫</button>
      <button class="pin-key" onclick="pinSaisir('0')">0</button>
      <button class="pin-key" onclick="pinValider()">OK</button>
    </div>
  </div>

  <div class="pin-error" id="pin-error"></div>

  <!-- Lien discret pour basculer vers une autre entreprise (changer de code employé) -->
  <div style="margin-top:1.5rem;text-align:center;">
    <a href="#" onclick="changerEntreprise(event)" style="color:rgba(255,255,255,0.55);font-size:0.75rem;text-decoration:underline;">Changer d'entreprise</a>
  </div>
</div>

<!-- ── ÉCRAN SAISIE ── -->
<div id="ecran-saisie" style="display:none;padding-bottom:2rem;">

  <!-- Bloc figé : bandeau bleu + nom/date -->
  <div class="entete-fixe">
    <header>
      <h1>Saisie journalière</h1>
      <div style="display:flex;gap:6px;align-items:center;">

        <button id="btn-sortie" onclick="window.location.href='index.html'"
          style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;
                 border-radius:6px;padding:4px 10px;font-size:0.78rem;cursor:pointer;display:none;">
          ← Sortir
        </button>
        <button onclick="seDeconnecter()"
          style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;
                 border-radius:6px;padding:4px 10px;font-size:0.78rem;cursor:pointer;">
          ⏻ Déconnexion
        </button>
      </div>
    </header>

    <!-- Salarié + Date (fixe) -->
    <div class="saisie-info" id="saisie-sticky">
      <div>
        <div class="sal-nom" id="nom-salarie"></div>
        <div class="sal-date" id="date-affichee"></div>
      </div>
      <input type="date" id="date-saisie" style="border:1px solid #d1d5db;border-radius:6px;padding:6px 8px;font-size:0.85rem;background:#f9fafb;">
    </div>
  </div><!-- fin entete-fixe -->

  <!-- Zone scrollable -->
  <div class="saisie-scroll">

  <!-- Chantiers prévus -->
  <div class="section">
    <div class="section-title">
      Chantiers prévus <span class="badge-prev" id="nb-prev">0</span>
    </div>
    <div id="liste-prev"></div>
  </div>

  <!-- Chantiers ajoutés -->
  <div class="section">
    <div class="section-title">
      Chantiers ajoutés <span class="badge-plus" id="nb-ajout">0</span>
    </div>
    <div id="liste-ajout"></div>
    <button class="btn-add" onclick="ouvrirModalAjout()">+ Ajouter un chantier</button>
  </div>

  <!-- Total + Envoyer -->
  <div class="section">
    <div class="total-bar">
      <span class="total-lbl">Total du jour</span>
      <span class="total-val" id="total-jour">0 h 00</span>
    </div>

  </div>

  </div><!-- fin saisie-scroll -->
</div>

<!-- ── MODAL AJOUT CHANTIER ── -->
<div class="modal-overlay" id="modal-ajout">
  <div class="modal-box">
    <div class="modal-title">Ajouter un chantier</div>
    <div class="suggestions-list" id="suggestions-list"></div>
    <input type="text" class="input-libre" id="input-libre" placeholder="Ou saisir un nom libre...">
    <button class="btn-modal-ok" onclick="validerAjout()">Ajouter</button>
    <button class="btn-modal-cancel" onclick="fermerModal()">Annuler</button>
  </div>
</div>

<script src="assets/sync.js"></script>
<script>
/* ═══════════════════════════
   ÉTAT
═══════════════════════════ */
let _salarie    = null; // { id, nom, pin }
let _chantiersP = [];   // chantiers prévisionnels
let _chantiersA = [];   // chantiers ajoutés
let _saisiesPrev= {};   // { nomChantier: { arrivee, depart } }
let _deplJournee = 0;  // Déplacement global de la journée
let _selModal   = null; // chantier sélectionné dans la modal

/* ═══════════════════════════
   INIT
═══════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  // Date par défaut = aujourd'hui
  const today = new Date();
  const dd = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  document.getElementById('date-saisie').value = dd;
  majDateAffichee(dd);
  document.getElementById('date-saisie').addEventListener('change', async function() {
    majDateAffichee(this.value);
    // Réinitialiser les saisies du chantier précédent : on change de jour
    _saisiesPrev = {};
    _chantiersA  = [];
    await rafraichirDonneesServeur();
    chargerChantiersPrev();
  });

  // Afficher le bouton Sortie uniquement sur desktop
  if (window.innerWidth >= 600) {
    const btnSortie = document.getElementById('btn-sortie');
    if (btnSortie) btnSortie.style.display = 'block';
  }

  // Si code employé mémorisé → reconnecter automatiquement sans redemander
  const codeMemorize = localStorage.getItem('saisie_codeEmploye');
  if (codeMemorize) {
    reconnecterAuto(codeMemorize);
  } else {
    // Pas de code mémorisé → afficher l'écran de connexion
    document.getElementById('pin-screen').style.display = 'flex';
    chargerSalaries();
  }
});

async function reconnecterAuto(codeEmploye) {
  try {
    const r = await fetch('/api/saisies/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codeEmploye })
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('saisie_clientId', d.clientId);
      localStorage.setItem('salariesdata', JSON.stringify(d.salaries || []));
      if (d.previsionnel) localStorage.setItem('previsionnel_data', JSON.stringify(d.previsionnel));
      if (d.heures)       localStorage.setItem('heuresdata',        JSON.stringify(d.heures));

      // Vérifier si un salarié était déjà connecté
      const salMemorize = localStorage.getItem('saisie_salarie');
      if (salMemorize) {
        _salarie = JSON.parse(salMemorize);
        // Restaurer directement la feuille de saisie sans PIN
        document.getElementById('nom-salarie').textContent = _salarie.nom;
        document.getElementById('pin-screen').style.display = 'none';
        document.getElementById('ecran-saisie').style.display = 'block';
        chargerChantiersPrev();
      } else {
        // Pas de salarié mémorisé → afficher le PIN
        document.getElementById('pin-screen').style.display = 'flex';
        document.getElementById('etape-code').style.display = 'none';
        document.getElementById('etape-pin').style.display = '';
        document.getElementById('pin-subtitle').textContent = 'Choisissez votre nom et saisissez votre PIN';
        chargerSalaries();
      }
    } else {
      localStorage.removeItem('saisie_codeEmploye');
      localStorage.removeItem('saisie_clientId');
      localStorage.removeItem('saisie_salarie');
      document.getElementById('pin-screen').style.display = 'flex';
      chargerSalaries();
    }
  } catch {
    // Hors ligne → restaurer si salarié mémorisé
    const salMemorize = localStorage.getItem('saisie_salarie');
    if (salMemorize) {
      _salarie = JSON.parse(salMemorize);
      document.getElementById('nom-salarie').textContent = _salarie.nom;
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('ecran-saisie').style.display = 'block';
      chargerChantiersPrev();
    } else {
      document.getElementById('pin-screen').style.display = 'flex';
      document.getElementById('etape-code').style.display = 'none';
      document.getElementById('etape-pin').style.display = '';
      chargerSalaries();
    }
  }
}

async function validerCodeEntreprise() {
  const codeEmploye = document.getElementById('pin-code-entreprise').value.trim().toUpperCase();
  if (!codeEmploye) { document.getElementById('pin-error').textContent = 'Saisissez votre code employé'; return; }

  const btn = document.getElementById('btn-code-entreprise');
  btn.textContent = 'Vérification...'; btn.disabled = true;

  try {
    // Connexion via le code employé (route dédiée, sans accès à l'outil)
    const r = await fetch('/api/saisies/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codeEmploye })
    });
    const d = await r.json();
    if (!d.ok) {
      document.getElementById('pin-error').textContent = 'Code employé invalide';
      btn.textContent = 'Valider'; btn.disabled = false;
      return;
    }

    // Stocker le code employé et les données nécessaires (pas de token licence)
    localStorage.setItem('saisie_codeEmploye', codeEmploye);
    localStorage.setItem('saisie_clientId',    d.clientId);
    localStorage.setItem('salariesdata', JSON.stringify(d.salaries || []));
    if (d.previsionnel) localStorage.setItem('previsionnel_data', JSON.stringify(d.previsionnel));
    if (d.heures)       localStorage.setItem('heuresdata',        JSON.stringify(d.heures));

    // Passer à l'étape PIN
    document.getElementById('etape-code').style.display = 'none';
    document.getElementById('etape-pin').style.display = '';
    document.getElementById('pin-subtitle').textContent = 'Choisissez votre nom et saisissez votre PIN';
    chargerSalaries();

  } catch(e) {
    document.getElementById('pin-error').textContent = 'Erreur de connexion';
    btn.textContent = 'Valider'; btn.disabled = false;
  }
}

function chargerSalaries() {
  const sals = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  const sel  = document.getElementById('pin-salarie');
  sel.innerHTML = '<option value="">Choisir votre nom...</option>';
  sals.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.prenom + ' ' + s.nom;
    sel.appendChild(opt);
  });
}

   sans redemander le PIN. Utile au changement de date pour récupérer le planning
   à jour si le patron l'a modifié pendant la session. ── */
async function rafraichirDonneesServeur() {
  const codeEmploye = localStorage.getItem('saisie_codeEmploye');
  if (!codeEmploye) return;
  try {
    const r = await fetch('/api/saisies/connect', {
      method: 'POST',

    });

    if (!d.ok) return;

/* ═══════════════════════════
   AUTHENTIFICATION PIN
═══════════════════════════ */
let _pinSaisi = '';

function pinSaisir(c) {
  if (_pinSaisi.length >= 4) return;
  _pinSaisi += c;
  majDots();
  if (_pinSaisi.length === 4) setTimeout(pinValider, 200);
}

function pinEffacer() {
  _pinSaisi = _pinSaisi.slice(0, -1);
  majDots();
}

function majDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < _pinSaisi.length);
  }
}

async function pinValider() {
  const salarieId = document.getElementById('pin-salarie').value;
  const errEl     = document.getElementById('pin-error');
  errEl.textContent = '';

  if (!salarieId) { errEl.textContent = 'Choisissez votre nom'; _pinSaisi = ''; majDots(); return; }
  if (_pinSaisi.length < 4) { errEl.textContent = 'Saisissez 4 chiffres'; return; }

  const codeEmploye = localStorage.getItem('saisie_codeEmploye');
  if (!codeEmploye) {
    errEl.textContent = 'Code employé manquant';
    _pinSaisi = ''; majDots();
    return;
  }

  try {
    const r = await fetch('/api/saisies/auth-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codeEmploye, salarieId, pin: _pinSaisi })
    });
    const d = await r.json();
    if (!d.ok) {
      errEl.textContent = d.message || 'Code PIN incorrect';
      _pinSaisi = ''; majDots();
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      return;
    }

    _salarie = { id: d.salarieId, nom: d.nom };
    localStorage.setItem('saisie_salarie', JSON.stringify(_salarie));
    document.getElementById('nom-salarie').textContent = _salarie.nom;
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('ecran-saisie').style.display = 'block';
    chargerChantiersPrev();
  } catch (e) {
    errEl.textContent = 'Erreur réseau, réessayez';
    _pinSaisi = ''; majDots();
  }
}

function majDeplJournee(delta) {
  _deplJournee = Math.max(0, _deplJournee + delta);
  const el = document.getElementById('depl-journee');
  if (el) el.textContent = _deplJournee;

function majDateAffichee(val) {

  if (!el || !val) return;
  const d = new Date(val + 'T00:00:00');
  el.textContent = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });

async function chargerChantiersPrev() {
  const date = document.getElementById('date-saisie').value;
  if (!date) return;

  // Chercher les chantiers du salarié ce jour dans le planning (heuresdata)
  // Format des clés (cf. planning.html) : `${salarieId}${YYYY_MM_DD}ch${1..5}`
  const heures   = JSON.parse(localStorage.getItem('heuresdata') || '{}');
  const dateKey  = date.replace(/-/g, '_');
  const salarieId = _salarie?.id;

  _chantiersP = [];
  // On RÉINITIALISE pas _saisiesPrev / _chantiersA ici : ils sont remis à zéro
  // au changement de date / déconnexion. Au premier appel après login, ils sont vides.

  // On ne retient QUE les chantiers planifiés pour CE salarié à CETTE date.
  const chantiersTrouves = new Map();
  const prefixe = String(salarieId) + dateKey;
  for (const k in heures) {
    if (!k.startsWith(prefixe)) continue;
    if (k.endsWith('abs')) continue;
    const entry = heures[k];
    const nomChantier = (entry?.chantier || '').trim();
    if (!nomChantier || nomChantier.toLowerCase() === 'absence') continue;
    if (!chantiersTrouves.has(nomChantier)) {
      const h = parseFloat(entry?.heures) || 0;
      chantiersTrouves.set(nomChantier, h);
    }
  }

  _chantiersP = [...chantiersTrouves.entries()].map(([nom, h]) => ({ nom, hPrevues: h }));

  // Pré-remplir l'heure d'arrivée avec l'heure actuelle pour chaque chantier
  const now = new Date();
  const heureNow = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  _chantiersP.forEach(ch => {
    if (!_saisiesPrev[ch.nom]) {
      _saisiesPrev[ch.nom] = { arrivee: heureNow, depart: '', depl: 0 };
    }
  });

  // ── RESTAURATION DES SAISIES DÉJÀ ENVOYÉES POUR CE JOUR ──
  // Si le salarié revient sur l'app après avoir déjà cliqué OK plus tôt,
  // on récupère ses chantiers déjà saisis et on préremplit l'écran.
  try {
    const codeEmploye = localStorage.getItem('saisie_codeEmploye');
    if (codeEmploye && salarieId) {
      const r = await fetch('/api/saisies/mobile-day', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codeEmploye, salarieId, date })
      });
      const d = await r.json();
      if (d.ok && d.saisie && Array.isArray(d.saisie.chantiers)) {
        d.saisie.chantiers.forEach(c => {
          const nom = (c.nom || '').trim();
          if (!nom) return;
          // Trouver si ce chantier est dans le planning ou pas
          const estPlanifie = _chantiersP.some(p => p.nom === nom);
          if (estPlanifie) {
            // Préremplir la saisie prévue
            _saisiesPrev[nom] = {
              arrivee: c.heureArrivee || '',
              depart:  c.heureDepart  || '',
              depl:    c.deplacement  || 0,
              synchronise: true,
              dejaEnvoye: true
            };
          } else {
            // Chantier ajouté librement précédemment : on l'ajoute aux chantiers libres
            if (!_chantiersA.some(a => a.nom === nom)) {
              _chantiersA.push({
                nom,
                arrivee: c.heureArrivee || '',
                depart:  c.heureDepart  || '',
                depl:    c.deplacement  || 0,
                synchronise: true,
                dejaEnvoye: true
              });
            }
          }
        });
      }
    }
  } catch (_) {
    // Hors ligne : on garde l'état local existant
  }

  document.getElementById('nb-prev').textContent = _chantiersP.length;
  rendrePrev();
  rendreAjout();
  majTotal();
}

/* ═══════════════════════════
   DÉPLACEMENT STEPPER
═══════════════════════════ */
function majDepl(type, ref, delta) {
  if (type === 'prev') {
    if (!_saisiesPrev[ref]) _saisiesPrev[ref] = { arrivee: '', depart: '', depl: 0 };
    _saisiesPrev[ref].depl = Math.max(0, (_saisiesPrev[ref].depl || 0) + delta);
    const el = document.getElementById('depl-prev-' + ref.replace(/\s/g,'_'));
    if (el) el.textContent = _saisiesPrev[ref].depl;
  } else {
    _chantiersA[ref].depl = Math.max(0, (_chantiersA[ref].depl || 0) + delta);
    const el = document.getElementById('depl-ajout-' + ref);
    if (el) el.textContent = _chantiersA[ref].depl;
  }
  majTotal();
}

/* ═══════════════════════════
   CALCULS
═══════════════════════════ */
function calcDuree(arrivee, depart) {
  if (!arrivee || !depart) return '';
  const [ah, am] = arrivee.split(':').map(Number);
  const [dh, dm] = depart.split(':').map(Number);
  let diff = (dh * 60 + dm) - (ah * 60 + am);
  if (diff <= 0) return '';
  return `${Math.floor(diff / 60)} h ${String(diff % 60).padStart(2,'0')}`;
}

function calcMinutes(arrivee, depart) {
  if (!arrivee || !depart) return 0;
  const [ah, am] = arrivee.split(':').map(Number);
  const [dh, dm] = depart.split(':').map(Number);
  return Math.max(0, (dh * 60 + dm) - (ah * 60 + am));
}

function majTotal() {
  let total = 0;
  _chantiersP.forEach(c => {
    const s = _saisiesPrev[c.nom] || {};
    total += calcMinutes(s.arrivee, s.depart) + (s.depl || 0);
  });
  _chantiersA.forEach(c => {
    total += calcMinutes(c.arrivee, c.depart) + (c.depl || 0);
  });
  document.getElementById('total-jour').textContent =
    `${Math.floor(total / 60)} h ${String(total % 60).padStart(2,'0')}`;
}

    ..._chantiersA.map(c => c.nom)
  ]);
  const prev = JSON.parse(localStorage.getItem('previsionnel_data') || '{}');
  const suggestions = new Set();
  Object.values(prev).forEach(annee => {
    Object.values(annee).forEach(mois => {
      (mois.chantiers || []).forEach(c => {
        if (c.client && c.client.trim()) suggestions.add(c.client.trim());
      });
    });
  });

  const cont = document.getElementById('suggestions-list');
  const items = [...suggestions].filter(s => !dejaDans.has(s));
  cont.innerHTML = items.map(s => `
    <div class="suggestion-item" onclick="selSuggestion(this,'${s.replace(/'/g,"\\'")}')">
      <span class="ico">🏗</span> ${s}
    </div>`).join('');

  document.getElementById('modal-ajout').classList.add('open');
}

function selSuggestion(el, nom) {
  document.querySelectorAll('.suggestion-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  _selModal = nom;
  document.getElementById('input-libre').value = '';
}

function fermerModal() {
  document.getElementById('modal-ajout').classList.remove('open');
}

function validerAjout() {
  const libre = document.getElementById('input-libre').value.trim();
  const nom   = libre || _selModal;
  if (!nom) { alert('Choisissez ou saisissez un chantier'); return; }
  const nowA = new Date();
  const hhA  = String(nowA.getHours()).padStart(2,'0');
  const mmA  = String(nowA.getMinutes()).padStart(2,'0');
  _chantiersA.push({ nom, arrivee: hhA + ':' + mmA, depart: '', depl: 0 });
  rendreAjout();
  majTotal();
  fermerModal();
}

/* ═══════════════════════════

═══════════════════════════ */
/* Changer d'entreprise : efface le code employé mémorisé et toutes les données
   locales liées, puis recharge la page pour repartir sur le formulaire initial.
   Utile pour basculer entre plusieurs comptes clients (administrateur Volitis). */
function changerEntreprise(ev) {
  if (ev) ev.preventDefault();
  if (!confirm("Changer d'entreprise ?\n\nLe code employé actuel sera oublié sur ce téléphone, vous devrez en saisir un nouveau.")) return;
  // Effacer tout ce qui est mémorisé côté mobile
  localStorage.removeItem('saisie_codeEmploye');
  localStorage.removeItem('saisie_salarie');
  localStorage.removeItem('salariesdata');
  localStorage.removeItem('heuresdata');
  localStorage.removeItem('previsionnel_data');
  location.reload();
}

function seDeconnecter() {
  // Effacer le salarié mémorisé
  localStorage.removeItem('saisie_salarie');
  _salarie = null;
  _saisiesPrev = {};
  _chantiersA  = [];
  _pinSaisi    = '';
  // Revenir à l'écran de connexion
  document.getElementById('ecran-saisie').style.display = 'none';
  document.getElementById('pin-screen').style.display = 'flex';
  document.getElementById('etape-code').style.display = 'none';
  document.getElementById('etape-pin').style.display = '';
  document.getElementById('pin-subtitle').textContent = 'Choisissez votre nom et saisissez votre PIN';
  majDots();
  chargerSalaries();
}



/* ── Validation des heures ── */
async function validerHeurePrevData(btn) {
  const nom   = btn.dataset.nom;
  const champ = btn.dataset.champ;
  const val   = document.getElementById(btn.dataset.inputId)?.value;
  if (!val) return;
  if (!_saisiesPrev[nom]) _saisiesPrev[nom] = { arrivee: '', depart: '', depl: 0 };
  _saisiesPrev[nom][champ] = val;
  // Passer le bouton en vert
  btn.classList.add('valide');
  // Si arrivée validée → afficher bouton OK du départ
  if (champ === 'arrivee') {
    const card = btn.closest('.chantier-card');
    if (card) {
      const depBtn = card.querySelectorAll('.btn-valider-heure')[1];
      if (depBtn) depBtn.style.display = '';
    }
  }
  // Mettre à jour durée sans rerender complet
  const s = _saisiesPrev[nom];
  const duree = calcDuree(s.arrivee, s.depart);
  const card = btn.closest('.chantier-card');
  if (card) {
    const badge = card.querySelector('.duree-badge');
    if (badge) { badge.textContent = duree || 'À saisir'; badge.className = 'duree-badge' + (duree ? '' : ' vide'); }
  }
  majTotal();

  // Envoi serveur progressif : à chaque OK on pousse l'état actuel
  const date = document.getElementById('date-saisie').value;
  if (!date) return;
  const ancienTxt = btn.textContent;
  btn.textContent = '⏳';
  btn.disabled = true;
  const chantier = {
    nom,
    heureArrivee: s.arrivee || '',
    heureDepart:  s.depart  || '',
    dureeMin:     calcMinutes(s.arrivee, s.depart),
    deplacement:  s.depl || 0,
    isPrevisionnel: true
  };
  const ok = await _envoyerChantier(chantier, date);
  btn.disabled = false;
  if (ok) {
    btn.textContent = '✔ OK';
    _saisiesPrev[nom].synchronise = true;
  } else {
    btn.textContent = '⚠ Réessayer';
    btn.classList.remove('valide');
    btn.style.background = '#dc2626';
    setTimeout(() => {
      btn.textContent = ancienTxt;
      btn.style.background = '';
    }, 2500);
  }
}

function majDeplData(btn) {
  const delta = parseInt(btn.dataset.delta);
  const type  = btn.dataset.type;
  if (type === 'prev') {
    const nom = btn.dataset.nom;
    if (!_saisiesPrev[nom]) _saisiesPrev[nom] = { arrivee: '', depart: '', depl: 0 };
    _saisiesPrev[nom].depl = Math.max(0, (_saisiesPrev[nom].depl || 0) + delta);
    rendrePrev();
  } else {
    const i = parseInt(btn.dataset.idx);
    _chantiersA[i].depl = Math.max(0, (_chantiersA[i].depl || 0) + delta);
    rendreAjout();
  }
  majTotal();
}

/* ── Envoyer un chantier prévu individuel ── */
async function envoyerUnChantierPrev(nom) {
  const date = document.getElementById('date-saisie').value;
  if (!date) { alert('Choisissez une date'); return; }
  const s = _saisiesPrev[nom] || {};
  if (!s.arrivee || !s.depart) { alert('Saisissez l\'heure d\'arrivée et de départ'); return; }
  const chantier = {
    nom,
    heureArrivee:  s.arrivee,
    heureDepart:   s.depart,
    dureeMin:      calcMinutes(s.arrivee, s.depart),
    deplacement:   s.depl || 0,
    isPrevisionnel: true
  };
  await _envoyerChantier(chantier, date);
  // Marquer comme envoyé
  _saisiesPrev[nom] = { ...s, envoye: true };
  rendrePrev();
  majTotal();
}

/* ── Envoyer un chantier ajouté individuel ── */
async function envoyerUnChantierAjout(i) {
  const date = document.getElementById('date-saisie').value;
  if (!date) { alert('Choisissez une date'); return; }
  const ch = _chantiersA[i];
  if (!ch) return;
  if (!ch.arrivee || !ch.depart) { alert('Saisissez l\'heure d\'arrivée et de départ'); return; }
  const chantier = {
    nom:           ch.nom,
    heureArrivee:  ch.arrivee,
    heureDepart:   ch.depart,
    dureeMin:      calcMinutes(ch.arrivee, ch.depart),
    deplacement:   ch.depl || 0,
    isPrevisionnel: false
  };
  await _envoyerChantier(chantier, date);
  // Marquer comme envoyé
  _chantiersA[i].envoye = true;
  rendreAjout();
  majTotal();
}

/* ── Fonction commune d'envoi d'un chantier ── */
async function _envoyerChantier(chantier, date) {
  const codeEmploye = localStorage.getItem('saisie_codeEmploye');
  try {
    const r = await fetch('/api/saisies/envoyer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        codeEmploye,
        salarieId:  _salarie.id,
        salarieNom: _salarie.nom,
        date, chantier
      })
    });
    const d = await r.json();
    return d.ok === true;
  } catch(e) {
    return false;
  }
}

async function envoyerChantier() {
  const date = document.getElementById('date-saisie').value;
  if (!date) { alert('Choisissez une date'); return; }

  // Collecter tous les chantiers avec des heures saisies
  const aEnvoyer = [];

  _chantiersP.forEach(ch => {
    const s = _saisiesPrev[ch.nom] || {};
    if (s.arrivee && s.depart) {
      aEnvoyer.push({
        nom:           ch.nom,
        heureArrivee:  s.arrivee,
        heureDepart:   s.depart,
        dureeMin:      calcMinutes(s.arrivee, s.depart),
        deplacement:   s.depl || 0,
        isPrevisionnel: true
      });
    }
  });

  _chantiersA.forEach(ch => {
    if (ch.nom && (ch.arrivee || ch.depart)) {
      aEnvoyer.push({
        nom:           ch.nom,
        heureArrivee:  ch.arrivee || '',
        heureDepart:   ch.depart  || '',
        dureeMin:      calcMinutes(ch.arrivee, ch.depart),
        deplacement:   ch.depl || 0,
        isPrevisionnel: false
      });
    }
  });

  if (!aEnvoyer.length) { alert('Saisissez au moins un chantier avec des horaires'); return; }

  const btn = document.getElementById('btn-envoyer');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  const codeEmploye = localStorage.getItem('saisie_codeEmploye');
  let nbEnvoyes = 0, erreurs = 0;

  // Envoyer chaque chantier séparément
  for (const chantier of aEnvoyer) {
    try {
      const r = await fetch('/api/saisies/envoyer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          codeEmploye,
          salarieId:  _salarie.id,
          salarieNom: _salarie.nom,
          date, chantier
        })
      });
      const d = await r.json();
      if (d.ok) nbEnvoyes++; else erreurs++;
    } catch { erreurs++; }
  }

  if (nbEnvoyes > 0) {
    btn.textContent = `✔ ${nbEnvoyes} chantier${nbEnvoyes > 1 ? 's' : ''} envoyé${nbEnvoyes > 1 ? 's' : ''} !`;
    btn.style.background = '#16a34a';
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '✉ Envoyer ce chantier';
      btn.style.background = '';
      // Réinitialiser uniquement les chantiers envoyés
      _saisiesPrev = {};
      _chantiersA  = [];
      rendrePrev();
      rendreAjout();
      majTotal();
    }, 2500);
  } else {
    btn.disabled = false;
    btn.textContent = '✉ Envoyer ce chantier';
    alert('Erreur lors de l\'envoi');
  }
}
