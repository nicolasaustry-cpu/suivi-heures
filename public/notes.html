<script>
let _notes = [];   // { date, dateObj, dateStr, salarie, chantier, arrivee, depart, dureeMin, note, photos } — uniquement celles avec note/photo
let _toutesInterventions = [];   // idem, TOUTES les interventions du mois (avec ou sans note) — sert au picker « Ajouter une note »

function echap(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDuree(min) {
  if (!min) return '';
  return Math.floor(min/60) + ' h ' + String(min%60).padStart(2,'0');
}
function fmtDateLong(d) {
  return d.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'long', year:'numeric' });
}

async function chargerNotes() {
  const mois  = document.getElementById('filtreMonth').value;
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken) ? SYNC.getToken() : null;
  if (!mois || !token) return;
  try {
    const r = await fetch('/api/saisies/' + mois, { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    const saisies = d.ok ? (d.saisies || []) : [];
    _notes = [];
    _toutesInterventions = [];
    saisies.forEach(s => {
      (s.chantiers || []).forEach(c => {
        const note   = (c.note || '').trim();
        const photos = Array.isArray(c.photos) ? c.photos.filter(ph => typeof ph === 'string' && ph.startsWith('data:image/')) : [];
        const dObj = new Date(s.date + 'T00:00:00');
        const item = {
          date:     s.date,
          salarieId: s.salarieId,
          faite:    !!c.noteFaite,
          dateObj:  dObj,
          dateStr:  fmtDateLong(dObj),
          salarie:  s.salarieNom || '',
          chantier: c.nom || '',
          arrivee:  c.heureArrivee || '',
          depart:   c.heureDepart  || '',
          dureeMin: c.dureeMin || 0,
          note:     note,
          photos:   photos
        };
        _toutesInterventions.push(item);
        if (note || photos.length) _notes.push(item);   // ni note ni photo → absente de la liste affichée
      });
    });
    // Plus récente en premier (puis par intervenant)
    _notes.sort((a, b) => (b.dateObj - a.dateObj) || a.salarie.localeCompare(b.salarie));
    majFiltres();
    rendre();
  } catch (e) {
    _notes = [];
    rendre();
  }
}

function majFiltres() {
  const selSal = document.getElementById('filtreSalarie');
  const selCh  = document.getElementById('filtreChantier');
  const valSal = selSal.value, valCh = selCh.value;
  const sals = [...new Set(_notes.map(n => n.salarie).filter(Boolean))].sort();
  const chs  = [...new Set(_notes.map(n => n.chantier).filter(Boolean))].sort();
  selSal.innerHTML = '<option value="">Tous</option>' + sals.map(s => `<option value="${echap(s)}">${echap(s)}</option>`).join('');
  selCh.innerHTML  = '<option value="">Tous</option>' + chs.map(c => `<option value="${echap(c)}">${echap(c)}</option>`).join('');
  if (sals.includes(valSal)) selSal.value = valSal;
  if (chs.includes(valCh))   selCh.value  = valCh;
  majBoutonRenommer();
}

function majBoutonRenommer() {
  const v = document.getElementById('filtreChantier').value;
  const btn = document.getElementById('btn-renommer');
  if (btn) btn.style.display = v ? '' : 'none';
}

function notesFiltrees() {
  const fSal = document.getElementById('filtreSalarie').value;
  const fCh  = document.getElementById('filtreChantier').value;
  const q    = (document.getElementById('rech').value || '').toLowerCase().trim();
  return _notes.filter(n => {
    if (fSal && n.salarie  !== fSal) return false;
    if (fCh  && n.chantier !== fCh)  return false;
    if (q && !((n.note + ' ' + n.chantier + ' ' + n.salarie).toLowerCase().includes(q))) return false;
    return true;
  });
}

function rendre() {
  const liste = notesFiltrees();
  const cont  = document.getElementById('liste-notes');
  const vide  = document.getElementById('nc-vide');
  document.getElementById('nc-count').textContent =
    liste.length ? (liste.length + ' note' + (liste.length > 1 ? 's' : '')) : '';
  if (!liste.length) { cont.innerHTML = ''; vide.style.display = 'block'; return; }
  vide.style.display = 'none';
  cont.innerHTML = liste.map(n => {
    const horaire = (n.arrivee && n.depart) ? (n.arrivee + ' – ' + n.depart) : '';
    const dur = n.dureeMin ? `<span class="dur">(${fmtDuree(n.dureeMin)})</span>` : '';
    return `<div class="note-card${n.faite ? ' faite' : ''}" data-date="${n.date}" data-sal="${n.salarieId}" data-ch="${echap(n.chantier)}">
      <div class="nc-head">
        <span class="nc-chantier">${echap(n.chantier)}</span>
        <div class="nc-actions no-print">
          <label class="nc-realise"><input type="checkbox" class="chk-realise"${n.faite ? ' checked' : ''}> Réalisé</label>
          <button class="btn-edit" title="Modifier la note">✏️</button>
          <button class="btn-suppr" title="Supprimer la note">🗑</button>
        </div>
      </div>
      <div class="nc-meta">
        <span>👤 ${echap(n.salarie)}</span>
        <span>📅 ${echap(n.dateStr)}</span>
        ${horaire ? `<span>🕐 ${echap(horaire)} ${dur}</span>` : ''}
      </div>
      ${n.note ? `<div class="nc-texte">${echap(n.note)}</div>` : ''}
      ${n.photos && n.photos.length
        ? `<div class="nc-photos">${n.photos.map((p, i) => `<img src="${p.replace(/"/g, '&quot;')}" alt="photo ${i + 1}" onclick="zoomPhoto(this.src)">`).join('')}</div>`
        : ''}
    </div>`;
  }).join('');

  cont.querySelectorAll('.note-card').forEach(card => {
    const date = card.dataset.date, sal = card.dataset.sal, ch = card.dataset.ch;
    const cb = card.querySelector('.chk-realise');
    if (cb) cb.addEventListener('change', e => basculerRealise(date, sal, ch, e.target.checked, card));
    const be = card.querySelector('.btn-edit');
    if (be) be.addEventListener('click', () => {
      const n = _notes.find(x => x.date === date && String(x.salarieId) === String(sal) && x.chantier === ch);
      if (n) ouvrirEditionNote(n);
    });
    const bs = card.querySelector('.btn-suppr');
    if (bs) bs.addEventListener('click', () => supprimerNote(date, sal, ch, card));
  });
}

async function postSaisieNote(url, body) {
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken) ? SYNC.getToken() : null;
  if (!token) return false;
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(body) });
    const d = await r.json();
    return d.ok === true;
  } catch (e) { return false; }
}

async function basculerRealise(date, sal, ch, faite, card) {
  const ok = await postSaisieNote('/api/saisies/note-statut', { date, salarieId: sal, chantier: ch, faite });
  if (!ok) { alert('Échec de la mise à jour.'); const cb = card.querySelector('.chk-realise'); if (cb) cb.checked = !faite; return; }
  const n = _notes.find(x => x.date === date && String(x.salarieId) === String(sal) && x.chantier === ch);
  if (n) n.faite = faite;
  card.classList.toggle('faite', faite);
}

async function supprimerNote(date, sal, ch, card) {
  if (!confirm('Supprimer cette note ? (les heures du chantier sont conservées)')) return;
  const ok = await postSaisieNote('/api/saisies/note-supprimer', { date, salarieId: sal, chantier: ch });
  if (!ok) { alert('Échec de la suppression.'); return; }
  _notes = _notes.filter(x => !(x.date === date && String(x.salarieId) === String(sal) && x.chantier === ch));
  majFiltres();
  rendre();
}

/* ── Modale d'édition / ajout de note ── */
let _modalMode = null;      // 'edit' | 'add'
let _modalCible = null;     // référence directe vers l'entrée (_notes ou _toutesInterventions)
let _modalPhotos = [];

function ouvrirEditionNote(item) {
  _modalMode = 'edit';
  _modalCible = item;
  _modalPhotos = (item.photos || []).slice();
  document.getElementById('mn-titre').textContent = 'Modifier la note';
  document.getElementById('mn-lecture').style.display = '';
  document.getElementById('mn-choix').style.display = 'none';
  document.getElementById('mn-info-lecture').innerHTML =
    '<span>' + echap(item.chantier) + ' — ' + echap(item.salarie) + ' — ' + echap(item.dateStr) + '</span> ' +
    '<button type="button" class="mn-btn-renommer" title="Renommer ce chantier">✏️</button>';
  document.querySelector('#mn-info-lecture .mn-btn-renommer').onclick = function () {
    RenommerChantier.ouvrir(item.chantier, () => location.reload());
  };
  document.getElementById('mn-texte').value = item.note || '';
  rendrePhotosModal();
  document.getElementById('modal-note').classList.add('on');
}

function ouvrirAjoutNote() {
  const candidats = _toutesInterventions.filter(x => !(x.note && x.note.trim()) && !(x.photos && x.photos.length));
  if (!candidats.length) { alert("Aucune intervention sans note ce mois-ci. Changez de mois si besoin, ou éditez une note existante avec ✏️."); return; }
  _modalMode = 'add';
  _modalCible = null;
  _modalPhotos = [];
  document.getElementById('mn-titre').textContent = 'Ajouter une note';
  document.getElementById('mn-lecture').style.display = 'none';
  document.getElementById('mn-choix').style.display = '';
  document.getElementById('mn-texte').value = '';
  rendrePhotosModal();
  const sals = [...new Set(candidats.map(x => x.salarie))].sort();
  const selSal = document.getElementById('mn-sel-salarie');
  selSal.innerHTML = '<option value="">— Choisir —</option>' + sals.map(s => `<option value="${echap(s)}">${echap(s)}</option>`).join('');
  document.getElementById('mn-sel-intervention').innerHTML = '<option value="">— Choisir un intervenant d\'abord —</option>';
  document.getElementById('modal-note').classList.add('on');
}

function majChoixIntervention() {
  const sal = document.getElementById('mn-sel-salarie').value;
  const selInt = document.getElementById('mn-sel-intervention');
  const candidats = _toutesInterventions
    .filter(x => x.salarie === sal && !(x.note && x.note.trim()) && !(x.photos && x.photos.length))
    .sort((a, b) => a.dateObj - b.dateObj);
  selInt.innerHTML = '<option value="">— Choisir —</option>' + candidats.map((x, i) =>
    `<option value="${i}">${x.dateObj.toLocaleDateString('fr-FR')} – ${echap(x.chantier)}${x.dureeMin ? ' (' + fmtDuree(x.dureeMin) + ')' : ''}</option>`
  ).join('');
  selInt._candidats = candidats;
}

function fermerModalNote() {
  document.getElementById('modal-note').classList.remove('on');
}

function rendrePhotosModal() {
  const cont = document.getElementById('mn-photos');
  cont.innerHTML = _modalPhotos.length
    ? _modalPhotos.map((p, i) =>
        `<div class="mn-photo-item"><img src="${p.replace(/"/g, '&quot;')}" alt="photo ${i + 1}"><button type="button" class="mn-photo-suppr" onclick="supprimerPhotoModal(${i})">✕</button></div>`
      ).join('')
    : '<span class="mn-photos-vide">Aucune photo.</span>';
}

function supprimerPhotoModal(i) {
  _modalPhotos.splice(i, 1);
  rendrePhotosModal();
}

function ajouterPhotosModal(files) {
  if (!files || !files.length) return;
  Promise.all([...files].map(f => new Promise(resolve => {
    const r = new FileReader();
    r.onload  = () => resolve(r.result);
    r.onerror = () => resolve(null);
    r.readAsDataURL(f);
  }))).then(resultats => {
    resultats.filter(Boolean).forEach(d => _modalPhotos.push(d));
    rendrePhotosModal();
  });
  document.getElementById('mn-fichier').value = '';
}

async function enregistrerModalNote() {
  let cible = _modalCible;
  if (_modalMode === 'add') {
    const selInt = document.getElementById('mn-sel-intervention');
    const idx = selInt.value;
    if (idx === '' || !selInt._candidats || !selInt._candidats[idx]) { alert('Choisissez un intervenant puis une intervention.'); return; }
    cible = selInt._candidats[idx];
  }
  if (!cible) { alert('Aucune intervention sélectionnée.'); return; }
  const texte = document.getElementById('mn-texte').value || '';
  if (!texte.trim() && !_modalPhotos.length) { alert('Ajoutez au moins un texte ou une photo.'); return; }

  const btn = document.getElementById('mn-ok');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  const ok = await postSaisieNote('/api/saisies/note-modifier', {
    date: cible.date, salarieId: cible.salarieId, chantier: cible.chantier,
    note: texte, photos: _modalPhotos
  });
  btn.disabled = false; btn.textContent = 'Enregistrer';
  if (!ok) { alert('Échec de l\'enregistrement.'); return; }

  cible.note = texte;
  cible.photos = _modalPhotos.slice();
  if (!_notes.includes(cible)) _notes.push(cible);
  _notes.sort((a, b) => (b.dateObj - a.dateObj) || a.salarie.localeCompare(b.salarie));
  majFiltres();
  rendre();
  fermerModalNote();
}

function zoomPhoto(src) {
  document.getElementById('photo-zoom-img').src = src;
  document.getElementById('photo-zoom').style.display = 'flex';
}

function exporterXlsx() {
  if (typeof XLSX === 'undefined') { alert('Module Excel non chargé, réessayez dans un instant.'); return; }
  const liste = notesFiltrees();
  if (!liste.length) { alert('Aucune note à exporter.'); return; }
  const rows = [['Date', 'Intervenant', 'Chantier', 'Arrivée', 'Départ', 'Durée', 'Note', 'Photos']];
  liste.forEach(n => rows.push([
    n.date, n.salarie, n.chantier, n.arrivee, n.depart, fmtDuree(n.dureeMin), n.note,
    (n.photos && n.photos.length) ? (n.photos.length + ' photo(s)') : ''
  ]));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch:12 }, { wch:20 }, { wch:24 }, { wch:9 }, { wch:9 }, { wch:10 }, { wch:60 }, { wch:11 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Notes');
  const mois = document.getElementById('filtreMonth').value || 'notes';
  XLSX.writeFile(wb, `Notes_${mois}.xlsx`);
}

window.addEventListener('DOMContentLoaded', () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) document.getElementById('entreprise-nom').textContent = ent.nom;
  const now = new Date();
  document.getElementById('filtreMonth').value =
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  chargerNotes();
});
window.addEventListener('donnees-chargees', () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) document.getElementById('entreprise-nom').textContent = ent.nom;
  if (!_notes.length) chargerNotes();
});
</script>
