<div id="photo-zoom" onclick="this.style.display='none'"><img id="photo-zoom-img" alt="photo"></div>

<script src="assets/sync.js"></script>

<script src="assets/coordonnees.js"></script>
<script>
let _notes = [];   // { date, dateObj, dateStr, salarie, chantier, arrivee, depart, dureeMin, note }
let _notesChantiers = {};   // { NOM CHANTIER: bloc cumulatif } (notes gérant/admin)

function echap(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDuree(min) {
  if (!min) return '';
  return Math.floor(min/60) + ' h ' + String(min%60).padStart(2,'0');
}
function fmtDateLong(d) {
  return d.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'long', year:'numeric' });
}

async function chargerNotes() {
  const mois  = document.getElementById('filtreMonth').value;
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken) ? SYNC.getToken() : null;
  if (!mois || !token) return;
  try {
    const r = await fetch('/api/saisies/' + mois, { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    const saisies = d.ok ? (d.saisies || []) : [];
    _notes = [];
    saisies.forEach(s => {
      (s.chantiers || []).forEach(c => {
        const note   = (c.note || '').trim();
        const photos = Array.isArray(c.photos) ? c.photos.filter(ph => typeof ph === 'string' && ph.startsWith('data:image/')) : [];
        if (!note && !photos.length) return;   // ni note ni photo → on ignore
        const dObj = new Date(s.date + 'T00:00:00');
        _notes.push({
          date:     s.date,
          salarieId: s.salarieId,
          faite:    !!c.noteFaite,
          dateObj:  dObj,
          dateStr:  fmtDateLong(dObj),
          salarie:  s.salarieNom || '',
          chantier: c.nom || '',
          arrivee:  c.heureArrivee || '',
          depart:   c.heureDepart  || '',
          dureeMin: c.dureeMin || 0,
          note:     note,
          photos:   photos
        });
      });
    });
    // Plus récente en premier (puis par intervenant)
    _notes.sort((a, b) => (b.dateObj - a.dateObj) || a.salarie.localeCompare(b.salarie));
    majFiltres();
    rendre();
  } catch (e) {
    _notes = [];
    rendre();
  }
}

/* ── Notes de chantier (gérant/admin) : affichage + modif/suppression ligne par ligne ──
   Format d'une ligne : [DD/MM/YYYY HH:MM – Auteur][I:DD/MM/YYYY;E] texte libre
   Le second bloc [I:...] est optionnel et facultatif rétrocompatible (les lignes
   anciennes n'en ont pas) : DD/MM/YYYY = date d'intervention, ;E = tag « Entretien ».
   Le suivi du chantier (« sous contrat entretien annuel ») est encodé par une ligne
   sentinelle dédiée, jamais affichée comme une note normale. */
const SENTINEL_CONTRAT = '[CONTRAT_ENTRETIEN]';
function frVersIso(fr) {
  const m = (fr || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
}
function isoVersFr(iso) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
}
function parseLigneMeta(ligne) {
  const m = ligne.match(/^\[([^\]]+)\]\s*(?:\[I:([^\]]*)\])?\s(.*)$/);
  if (!m) return { entete: '', interv: '', intervIso: '', entretien: false, texte: ligne };
  const entete = m[1];
  const metaRaw = m[2] || '';
  const entretien = /(^|;)E(;|$)/.test(metaRaw);
  const dm = metaRaw.match(/^(\d{2}\/\d{2}\/\d{4})/);
  const interv = dm ? dm[1] : '';
  return { entete, interv, intervIso: frVersIso(interv), entretien, texte: m[3] };
}
function construireLigne(entete, interv, entretien, texte) {
  const meta = [];
  if (interv) meta.push(interv);
  if (entretien) meta.push('E');
  const metaStr = meta.length ? `[I:${meta.join(';')}]` : '';
  return `[${entete}]${metaStr} ${texte}`;
}

async function chargerNotesChantiers() {
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken) ? SYNC.getToken() : null;
  if (!token) return;
  try {
    const r = await fetch('/api/data', { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    _notesChantiers = (d.ok && d.data && d.data.notesChantiers) ? d.data.notesChantiers : {};
  } catch (e) { _notesChantiers = {}; }
  rendreNotesChantiers();
}

function rendreNotesChantiers() {
  const cont = document.getElementById('liste-notes-chantier');
  if (!cont) return;
  const fCh = document.getElementById('filtreChantier').value;
  const q   = (document.getElementById('rech').value || '').toLowerCase().trim();
  const noms = Object.keys(_notesChantiers)
    .filter(n => (_notesChantiers[n] || '').trim())
    .filter(n => !fCh || n === fCh)
    .filter(n => !q || (n + ' ' + _notesChantiers[n]).toLowerCase().includes(q))
    .sort((a, b) => a.localeCompare(b, 'fr'));

  if (!noms.length) { cont.innerHTML = ''; return; }

  cont.innerHTML = '<div class="ncch-titre">📋 Notes de chantier (gérant / administratif)</div>' +
    noms.map(nom => {
      const lignes = _lignesDe(nom);
      const lignesHtml = lignes.map((l, idx) => {
        const meta = parseLigneMeta(l);
        return `
        <div class="ncch-ligne" data-idx="${idx}">
          <span class="ncch-ltxt">${meta.entete ? `[${echap(meta.entete)}] ` : ''}${echap(meta.texte)}</span>
          <span class="ncch-meta-interv no-print">
            <input type="date" class="ncch-date" value="${meta.intervIso}" title="Date d'intervention">
            <label class="ncch-entr" title="Intervention d'entretien (déterminé à la création de la note, non modifiable ici)">
              <input type="checkbox" class="ncch-chk-entr" disabled${meta.entretien ? ' checked' : ''}> Entretien
            </label>
          </span>
          <span class="ncch-lact no-print">
            <button class="ncch-mod" title="Modifier le texte">✏️</button>
            <button class="ncch-sup" title="Supprimer la ligne">🗑</button>
          </span>
        </div>`;
      }).join('');
      return `<div class="ncch-card" data-ch="${echap(nom)}">
        <div class="ncch-head" style="display:flex;align-items:center;gap:8px;">${echap(nom)}
          <label class="ncch-contrat no-print" title="Suivre ce chantier dans la page Suivi des entretiens">
            <input type="checkbox" class="ncch-chk-contrat"${estSuiviEntretien(nom) ? ' checked' : ''}> Contrat entretien annuel
          </label>
          <button type="button" class="ncch-coord no-print" style="margin-left:auto;background:#eef2ff;color:#1d4ed8;border:1px solid #c7d2fe;border-radius:7px;padding:3px 9px;font-size:0.76rem;font-weight:600;cursor:pointer;white-space:nowrap;">📍 Coordonnées</button>
        </div>
        ${lignesHtml}
      </div>`;
    }).join('');

  cont.querySelectorAll('.ncch-card').forEach(card => {
    const ch = card.dataset.ch;
    const bc = card.querySelector('.ncch-coord');
    if (bc) bc.addEventListener('click', () => Coord.ouvrir(ch, rendreNotesChantiers));
    const cc = card.querySelector('.ncch-chk-contrat');
    if (cc) cc.addEventListener('change', () => toggleSuiviEntretien(ch));
    card.querySelectorAll('.ncch-ligne').forEach(row => {
      const idx = parseInt(row.dataset.idx, 10);
      row.querySelector('.ncch-sup').addEventListener('click', () => supprimerLigneChantier(ch, idx));
      row.querySelector('.ncch-mod').addEventListener('click', () => modifierLigneChantier(ch, idx, row));
      const dateInp = row.querySelector('.ncch-date');
      if (dateInp) dateInp.addEventListener('change', () => majMetaLigne(ch, idx, { interv: dateInp.value }));
    });
  });
}

/* Lignes affichables d'un chantier : la ligne sentinelle de suivi de contrat
   (SENTINEL_CONTRAT) n'est jamais incluse — elle n'est jamais une note à afficher. */
function _lignesDe(ch) {
  return (_notesChantiers[ch] || '').split('\n').filter(l => l.trim() && l !== SENTINEL_CONTRAT);
}
function estSuiviEntretien(ch) {
  return (_notesChantiers[ch] || '').split('\n').includes(SENTINEL_CONTRAT);
}
/* Réinjecte la ligne sentinelle (si présente) avant d'enregistrer, pour ne jamais
   la perdre lors d'une modif/suppression de note normale. */
function _sauverLignes(ch, lignes) {
  const sentinel = estSuiviEntretien(ch) ? [SENTINEL_CONTRAT] : [];
  remplacerNoteChantier(ch, [...sentinel, ...lignes].join('\n'));
}
function toggleSuiviEntretien(ch) {
  const lignes = _lignesDe(ch);
  const sentinel = estSuiviEntretien(ch) ? [] : [SENTINEL_CONTRAT];
  remplacerNoteChantier(ch, [...sentinel, ...lignes].join('\n'));
}

function modifierLigneChantier(ch, idx, row) {
  const lignes = _lignesDe(ch);
  const ligne = lignes[idx] || '';
  const meta = parseLigneMeta(ligne);
  row.innerHTML = `
    <input type="text" class="ncch-edit" value="${echap(meta.texte).replace(/"/g, '&quot;')}">
    <span class="ncch-lact no-print">
      <button class="ncch-ok" title="Enregistrer">✔️</button>
      <button class="ncch-annul" title="Annuler">✖️</button>
    </span>`;
  const inp = row.querySelector('.ncch-edit');
  inp.focus();
  row.querySelector('.ncch-ok').addEventListener('click', () => {
    const nv = (inp.value || '').trim();
    if (!nv) { supprimerLigneChantier(ch, idx); return; }
    lignes[idx] = meta.entete ? construireLigne(meta.entete, meta.interv, meta.entretien, nv) : nv;
    _sauverLignes(ch, lignes);
  });
  row.querySelector('.ncch-annul').addEventListener('click', () => rendreNotesChantiers());
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') row.querySelector('.ncch-ok').click(); });
}

function majMetaLigne(ch, idx, patch) {
  const lignes = _lignesDe(ch);
  const ligne = lignes[idx];
  if (ligne == null) return;
  const meta = parseLigneMeta(ligne);
  const interv    = patch.interv !== undefined ? isoVersFr(patch.interv) : meta.interv;
  const entretien = patch.entretien !== undefined ? patch.entretien : meta.entretien;
  lignes[idx] = meta.entete ? construireLigne(meta.entete, interv, entretien, meta.texte) : ligne;
  _sauverLignes(ch, lignes);
}

function supprimerLigneChantier(ch, idx) {
  if (!confirm('Supprimer cette ligne de note ?')) return;
  const lignes = _lignesDe(ch);
  lignes.splice(idx, 1);
  _sauverLignes(ch, lignes);
}

async function remplacerNoteChantier(ch, texte) {
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken) ? SYNC.getToken() : null;
  if (!token) return;
  try {
    const r = await fetch('/api/data/note-chantier', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ chantier: ch, texte, mode: 'remplacer' })
    });
    const d = await r.json();
    if (d.ok) {
      if (d.note && d.note.trim()) _notesChantiers[ch] = d.note;
      else delete _notesChantiers[ch];
      rendreNotesChantiers();
    } else {
      alert(d.message || 'Échec de l’enregistrement.');
    }
  } catch (e) {
    alert('Erreur réseau lors de l’enregistrement.');
  }
}

function majFiltres() {
  const selSal = document.getElementById('filtreSalarie');
  const selCh  = document.getElementById('filtreChantier');
  const valSal = selSal.value, valCh = selCh.value;
  const sals = [...new Set(_notes.map(n => n.salarie).filter(Boolean))].sort();
  const chs  = [...new Set(_notes.map(n => n.chantier).filter(Boolean))].sort();
  selSal.innerHTML = '<option value="">Tous</option>' + sals.map(s => `<option value="${echap(s)}">${echap(s)}</option>`).join('');
  selCh.innerHTML  = '<option value="">Tous</option>' + chs.map(c => `<option value="${echap(c)}">${echap(c)}</option>`).join('');
  if (sals.includes(valSal)) selSal.value = valSal;
  if (chs.includes(valCh))   selCh.value  = valCh;
}

function notesFiltrees() {
  const fSal = document.getElementById('filtreSalarie').value;
  const fCh  = document.getElementById('filtreChantier').value;
  const q    = (document.getElementById('rech').value || '').toLowerCase().trim();
  return _notes.filter(n => {
    if (fSal && n.salarie  !== fSal) return false;
    if (fCh  && n.chantier !== fCh)  return false;
    if (q && !((n.note + ' ' + n.chantier + ' ' + n.salarie).toLowerCase().includes(q))) return false;
    return true;
  });
}

function rendre() {
  rendreNotesChantiers();
  const liste = notesFiltrees();
  const cont  = document.getElementById('liste-notes');
  const vide  = document.getElementById('nc-vide');
  document.getElementById('nc-count').textContent =
    liste.length ? (liste.length + ' note' + (liste.length > 1 ? 's' : '')) : '';
  if (!liste.length) { cont.innerHTML = ''; vide.style.display = 'block'; return; }
  vide.style.display = 'none';
  cont.innerHTML = liste.map(n => {
    const horaire = (n.arrivee && n.depart) ? (n.arrivee + ' – ' + n.depart) : '';
    const dur = n.dureeMin ? `<span class="dur">(${fmtDuree(n.dureeMin)})</span>` : '';
    return `<div class="note-card${n.faite ? ' faite' : ''}" data-date="${n.date}" data-sal="${n.salarieId}" data-ch="${echap(n.chantier)}">
      <div class="nc-head">
        <span class="nc-chantier">${echap(n.chantier)}</span>
        <div class="nc-actions no-print">
          <label class="nc-realise"><input type="checkbox" class="chk-realise"${n.faite ? ' checked' : ''}> Réalisé</label>
          <button class="btn-suppr" title="Supprimer la note">🗑</button>
        </div>
      </div>
      <div class="nc-meta">
        <span>👤 ${echap(n.salarie)}</span>
        <span>📅 ${echap(n.dateStr)}</span>
        ${horaire ? `<span>🕐 ${echap(horaire)} ${dur}</span>` : ''}
      </div>
      ${n.note ? `<div class="nc-texte">${echap(n.note)}</div>` : ''}
      ${n.photos && n.photos.length
        ? `<div class="nc-photos">${n.photos.map((p, i) => `<img src="${p.replace(/"/g, '&quot;')}" alt="photo ${i + 1}" onclick="zoomPhoto(this.src)">`).join('')}</div>`
        : ''}
    </div>`;
  }).join('');

  cont.querySelectorAll('.note-card').forEach(card => {
    const date = card.dataset.date, sal = card.dataset.sal, ch = card.dataset.ch;
    const cb = card.querySelector('.chk-realise');
    if (cb) cb.addEventListener('change', e => basculerRealise(date, sal, ch, e.target.checked, card));
    const bs = card.querySelector('.btn-suppr');
    if (bs) bs.addEventListener('click', () => supprimerNote(date, sal, ch, card));
  });
}

async function postSaisieNote(url, body) {
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken) ? SYNC.getToken() : null;
  if (!token) return false;
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(body) });
    const d = await r.json();
    return d.ok === true;
  } catch (e) { return false; }
}

async function basculerRealise(date, sal, ch, faite, card) {
  const ok = await postSaisieNote('/api/saisies/note-statut', { date, salarieId: sal, chantier: ch, faite });
  if (!ok) { alert('Échec de la mise à jour.'); const cb = card.querySelector('.chk-realise'); if (cb) cb.checked = !faite; return; }
  const n = _notes.find(x => x.date === date && String(x.salarieId) === String(sal) && x.chantier === ch);
  if (n) n.faite = faite;
  card.classList.toggle('faite', faite);
}

async function supprimerNote(date, sal, ch, card) {
  if (!confirm('Supprimer cette note ? (les heures du chantier sont conservées)')) return;
  const ok = await postSaisieNote('/api/saisies/note-supprimer', { date, salarieId: sal, chantier: ch });
  if (!ok) { alert('Échec de la suppression.'); return; }
  _notes = _notes.filter(x => !(x.date === date && String(x.salarieId) === String(sal) && x.chantier === ch));
  majFiltres();
  rendre();
}

function zoomPhoto(src) {
  document.getElementById('photo-zoom-img').src = src;
  document.getElementById('photo-zoom').style.display = 'flex';
}

function exporterXlsx() {
  if (typeof XLSX === 'undefined') { alert('Module Excel non chargé, réessayez dans un instant.'); return; }
  const liste = notesFiltrees();
  if (!liste.length) { alert('Aucune note à exporter.'); return; }
  const rows = [['Date', 'Intervenant', 'Chantier', 'Arrivée', 'Départ', 'Durée', 'Note', 'Photos']];
  liste.forEach(n => rows.push([
    n.date, n.salarie, n.chantier, n.arrivee, n.depart, fmtDuree(n.dureeMin), n.note,
    (n.photos && n.photos.length) ? (n.photos.length + ' photo(s)') : ''
  ]));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch:12 }, { wch:20 }, { wch:24 }, { wch:9 }, { wch:9 }, { wch:10 }, { wch:60 }, { wch:11 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Notes');
  const mois = document.getElementById('filtreMonth').value || 'notes';
  XLSX.writeFile(wb, `Notes_${mois}.xlsx`);
}

window.addEventListener('DOMContentLoaded', () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) document.getElementById('entreprise-nom').textContent = ent.nom;
  const now = new Date();
  document.getElementById('filtreMonth').value =
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  chargerNotes();
  chargerNotesChantiers();
});
window.addEventListener('donnees-chargees', () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) document.getElementById('entreprise-nom').textContent = ent.nom;
  if (!_notes.length) chargerNotes();
  if (!Object.keys(_notesChantiers).length) chargerNotesChantiers();
});
</script>
