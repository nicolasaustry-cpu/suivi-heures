<script>
let _saisies  = [];
let _salaries = [];
let _cochésSal = new Set();
let _cochesCh  = new Set();
let _tousSals  = [];
let _tousChs   = [];
let _moisSelection = new Set();   // Set de 'YYYY-MM'

/* ══ SÉLECTION MULTI-MOIS ══ */
const NOMS_MOIS_FR = ['Janv.','Févr.','Mars','Avril','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
function libelleMoisCourt(yyyyMM) {
  const [a, m] = yyyyMM.split('-');
  return NOMS_MOIS_FR[parseInt(m)-1] + ' ' + a;
}

function majLibelleMois() {
  const btn = document.getElementById('btn-mois');
  if (!btn) return;
  if (_moisSelection.size === 0) {
    btn.textContent = 'Aucun ▼';
  } else if (_moisSelection.size === 1) {
    btn.textContent = libelleMoisCourt([..._moisSelection][0]) + ' ▼';
  } else {
    btn.textContent = _moisSelection.size + ' mois sélectionnés ▼';
  }
}

/* Liste des mois ayant des données = saisies serveur + mois courant */
async function getMoisAvecDonnees() {
  const mois = new Set();
  try {
    const token = localStorage.getItem('syncToken');
    if (token) {
      const r = await fetch('/api/saisies/mois-list', { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.ok) {
        const d = await r.json();
        (d.mois || []).forEach(m => mois.add(m));
      }
    }
  } catch (_) {}
  // Toujours inclure le mois en cours
  const now = new Date();
  mois.add(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`);
  return [...mois].sort();
}

async function ouvrirFiltreMois(event) {
  if (event && event.stopPropagation) event.stopPropagation();
  const btn = document.getElementById('btn-mois');
  if (!btn) return;
  const moisDispo = await getMoisAvecDonnees();
  const items = moisDispo.map(m => ({ value: m, label: libelleMoisCourt(m) }));
  FiltreExcel.ouvrir({
    button: btn,
    items,
    selected: new Set(_moisSelection),
    onApply: (sel) => {
      _moisSelection = new Set(sel);
      majLibelleMois();
      chargerRealise();
    }
  });
}

/* ══ INIT ══ */
window.addEventListener('DOMContentLoaded', () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) document.getElementById('entreprise-nom').textContent = ent.nom;

  _salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]').filter(s => !s.administratif);

  // Sélection mois par défaut = mois en cours
  const now = new Date();
  _moisSelection = new Set([`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`]);
  majLibelleMois();

  ajusterMarginTop();
  window.addEventListener('resize', ajusterMarginTop);
  chargerRealise();

  // Quand les données serveur arrivent (salaries, previsionnel…), recharger pour
  // que la colonne "Prévu" se calcule correctement sans rafraîchissement manuel.
  window.addEventListener('donnees-chargees', () => {
    _salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]').filter(s => !s.administratif);
    const ent2 = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
    if (ent2.nom) {
      const nomEl = document.getElementById('entreprise-nom');
      if (nomEl) nomEl.textContent = ent2.nom;
    }
    chargerRealise();
  });

  // Fermer dropdowns si clic extérieur
  document.addEventListener('click', e => {
    if (!e.target.closest('.filtre-container')) {
      document.querySelectorAll('.filtre-dropdown').forEach(d => d.classList.remove('open'));
    }
  });
});

function ajusterMarginTop() {
  const bar = document.getElementById('top-bar');
  const wrap = document.getElementById('planning-wrapper');
  if (bar && wrap) wrap.style.marginTop = bar.offsetHeight + 'px';
}

/* ══ CHARGEMENT ══ */
let _supprimerScroll = false;
async function chargerRealise(garderEtat) {
  if (!_moisSelection || _moisSelection.size === 0) { _saisies = []; afficherRealise(); return; }

  const token = (typeof SYNC !== 'undefined' && SYNC.getToken()) || localStorage.getItem('syncToken');
  if (!token) { _saisies = []; afficherRealise(); return; }

  // Boucle sur chaque mois sélectionné (l'API ne renvoie qu'un mois à la fois)
  const tout = [];
  for (const mois of _moisSelection) {
    try {
      const r = await fetch(`/api/saisies/${mois}`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const d = await r.json();
      if (d.ok && d.saisies) tout.push(...d.saisies);
    } catch (_) {}
  }
  _saisies = tout;

  // Construire les listes de filtres (en préservant la sélection courante si demandé)
  const ancSal = garderEtat ? _cochésSal : null;
  const ancCh  = garderEtat ? _cochesCh  : null;
  _tousSals = [...new Set(_saisies.map(s => s.salarieNom))].sort();
  _tousChs  = [...new Set(_saisies.flatMap(s => (s.chantiers||[]).map(c => c.nom)))].sort();
  _cochésSal = ancSal ? new Set(_tousSals.filter(v => ancSal.has(v))) : new Set();
  _cochesCh  = ancCh  ? new Set(_tousChs.filter(v => ancCh.has(v)))  : new Set();
  if (garderEtat) _supprimerScroll = true;

  majBtnFiltre('sal');
  majBtnFiltre('ch');
  afficherRealise();
}

/* ══ FILTRES style Excel ══ */
function ouvrirFiltreSal(btn) {
  FiltreExcel.ouvrir({
    button: btn,
    items: _tousSals.map(v => ({ value: v, label: v })),
    selected: _cochésSal,
    onApply: (sel) => {
      _cochésSal = sel;
      majBtnFiltre('sal');
      afficherRealise();
    }
  });
}

function ouvrirFiltreCh(btn) {
  FiltreExcel.ouvrir({
    button: btn,
    items: _tousChs.map(v => ({ value: v, label: v })),
    selected: _cochesCh,
    onApply: (sel) => {
      _cochesCh = sel;
      majBtnFiltre('ch');
      afficherRealise();
    }
  });
}

function majBtnFiltre(type) {
  const btn    = document.getElementById('btn-' + type);
  if (!btn) return;
  const coches = type === 'sal' ? _cochésSal : _cochesCh;
  const tous   = type === 'sal' ? _tousSals  : _tousChs;
  const items  = tous.map(v => ({ value: v, label: v }));
  btn.textContent = FiltreExcel.libelle(coches, tous.length, items) + ' ▼';
  if (coches.size === tous.length || coches.size === 0) {
    btn.classList.remove('fexc-active');
  } else {
    btn.classList.add('fexc-active');
  }
}

/* ══ AFFICHAGE ══ */
/* Jours fériés français + jours d'école (neutralisés dans le contrat prévu) */
const _reCacheFeries = {};
function _rePaques(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),jo=((h+l-7*mm+114)%31)+1;return new Date(y,mo-1,jo);}
function _reFeries(y){
  if(_reCacheFeries[y])return _reCacheFeries[y];
  const f={},isod=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  [[0,1],[4,1],[4,8],[6,14],[7,15],[10,1],[10,11],[11,25]].forEach(x=>{f[isod(new Date(y,x[0],x[1]))]=1;});
  const p=_rePaques(y);
  [1,39,50].forEach(n=>{const d=new Date(p);d.setDate(p.getDate()+n);f[isod(d)]=1;});
  _reCacheFeries[y]=f;return f;
}
function estFerieRe(d){const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return !!_reFeries(d.getFullYear())[iso];}
function estJourEcoleRe(sal,dateStr){return sal&&sal.apprenti&&Array.isArray(sal.joursEcole)&&sal.joursEcole.indexOf(dateStr)!==-1;}

function afficherRealise() {
  const cont = document.getElementById('contenu-realise');
  const msgV = document.getElementById('msg-vide');

  // Filtrer les saisies
  const saisies = _saisies.filter(s => !_cochésSal.size || _cochésSal.has(s.salarieNom));

  if (!saisies.length) {
    msgV.style.display = '';
    cont.innerHTML = '';
    majJauge(0, 0);
    return;
  }
  msgV.style.display = 'none';

  // Grouper par date
  const parDate = {};
  saisies.forEach(s => {
    if (!parDate[s.date]) parDate[s.date] = [];
    parDate[s.date].push(s);
  });

  let grandTotalMin = 0, grandDeplMin = 0;

  // Pré-calculer les heures prévues par salarié par jour depuis le planning
  const heures = JSON.parse(localStorage.getItem('heuresdata') || '{}');
  const salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]').filter(s => !s.administratif);

  const joursNoms = ['dim','lun','mar','mer','jeu','ven','sam'];

  function getPrevuMin(date, salarieId) {
    // Heures contractuelles du salarié ce jour-là
    const sal = salaries.find(s => String(s.id) === String(salarieId));
    if (!sal) return 0;
    const d = new Date(date + 'T00:00:00');
    const jourSemaine = d.getDay(); // 0=dim, 1=lun...
    if (jourSemaine === 0) return 0; // dimanche
    // Vérifier présence
    const entree = sal.dateEntree ? new Date(sal.dateEntree) : null;
    const sortie = sal.dateSortie ? new Date(sal.dateSortie + 'T23:59:59') : null;
    if (entree && d < entree) return 0;
    if (sortie && d > sortie) return 0;
    if (estFerieRe(d)) return 0;             // férié : personne ne travaille
    if (estJourEcoleRe(sal, date)) return 0; // apprenti à l'école
    // Heures contractuelles : lun/mar/mer/jeu/ven/sam
    const hp = sal.heuresParJour || {};
    const nomJour = joursNoms[jourSemaine]; // 'lun','mar'...
    const h = parseFloat(hp[nomJour]) || 0;
    return h * 60;
  }

  // Détermine si un chantier doit être affiché.
  // - Si le champ "Exclure ... contenant" est rempli : on affiche TOUS les chantiers
  //   SAUF ceux dont le nom contient le texte saisi (le filtre coché est ignoré).
  // - Sinon : on applique le filtre coché habituel.
  function chantierVisible(nom) {
    const exclu = (document.getElementById('exclureChantier')?.value || '').trim().toLowerCase();
    if (exclu) {
      return !String(nom || '').toLowerCase().includes(exclu);
    }
    return !_cochesCh.size || _cochesCh.has(nom);
  }

  cont.innerHTML = Object.keys(parDate).sort().map(date => {
    const d = new Date(date + 'T00:00:00');
    const label = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    let jourTotalMin = 0, jourDeplMin = 0;
    let rows = '';

    parDate[date].forEach(s => {
      const chantiersFiltres = (s.chantiers || []).filter(c => chantierVisible(c.nom));
      if (!chantiersFiltres.length) return;

      let salTotalMin = 0, salDeplMin = 0;

      chantiersFiltres.forEach(c => {
        if (!chantierVisible(c.nom)) return;
        const hh = Math.floor(c.dureeMin / 60), mm = c.dureeMin % 60;
        const totMin = c.dureeMin + (c.deplacement || 0);
        const th = Math.floor(totMin / 60), tm = totMin % 60;
        salTotalMin += c.dureeMin;
        salDeplMin  += c.deplacement || 0;

        const idxC = (s.chantiers || []).indexOf(c);
        const iconCrayon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="#eab308" stroke="#a16207" stroke-width="1.2"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
        const iconPoubelle = `<svg width="14" height="14" viewBox="0 0 24 24" fill="#dc2626" stroke="#991b1b" stroke-width="0.8"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
        // Boutons d'action affichés pour TOUS les chantiers (prévus ou ajoutés librement)
        const actions = `<button class="btn-action btn-edit" title="Modifier" data-sid="${s._id}" data-idx="${idxC}" onclick="ouvrirEditChantier(this)">${iconCrayon}</button>
             <button class="btn-action btn-del" title="Supprimer" data-sid="${s._id}" data-idx="${idxC}" onclick="supprimerChantierSaisie(this)">${iconPoubelle}</button>`;
        rows += `<tr>
          <td class="col-sal">${s.salarieNom}</td>
          <td class="col-ch">${c.nom}${c.isPrevisionnel ? ' <span style="font-size:0.7rem;color:#2563eb;">(prévu)</span>' : ''}</td>
          <td class="col-h">${c.heureArrivee || '—'} → ${c.heureDepart || '—'}</td>
          <td class="col-pause">${c.pause ? c.pause + ' min' : '—'}</td>
          <td class="col-h">${hh}h${String(mm).padStart(2,'0')}</td>
          <td class="col-depl">${c.deplacement ? c.deplacement + ' min' : '—'}</td>
          <td class="col-tot">${th}h${String(tm).padStart(2,'0')}</td>
          <td class="col-tot" style="color:#9ca3af;">—</td>
          <td class="col-tot" style="color:#9ca3af;">—</td>
          <td class="col-actions">${actions}</td>
        </tr>`;
      });

      // Ligne total salarié avec prévu et écart
      {
        const salPrevuMin = getPrevuMin(date, s.salarieId);
        const salRealMin  = salTotalMin + salDeplMin;
        const salEcartMin = salRealMin - salPrevuMin;
        const salEcartStr = salPrevuMin > 0
          ? (salEcartMin >= 0 ? '+' : '-') + Math.floor(Math.abs(salEcartMin)/60) + 'h' + String(Math.abs(salEcartMin)%60).padStart(2,'0')
          : '—';
        const salEcartColor = salEcartMin >= 0 ? '#16a34a' : '#dc2626';
        const salPrevStr = salPrevuMin > 0
          ? Math.floor(salPrevuMin/60) + 'h' + String(salPrevuMin%60).padStart(2,'0') : '—';
        const sth = Math.floor(salRealMin/60), stm = salRealMin%60;
        rows += `<tr class="ligne-total-sal">
          <td colspan="4" style="text-align:left;font-size:0.78rem;">Total ${s.salarieNom}</td>
          <td class="col-h">${Math.floor(salTotalMin/60)}h${String(salTotalMin%60).padStart(2,'0')}</td>
          <td class="col-depl">${salDeplMin ? salDeplMin + ' min' : '—'}</td>
          <td class="col-tot">${sth}h${String(stm).padStart(2,'0')}</td>
          <td class="col-tot">${salPrevStr}</td>
          <td class="col-tot" style="color:${salEcartColor};">${salEcartStr}</td>
          <td class="col-actions"></td>
        </tr>`;
      }

      jourTotalMin += salTotalMin;
      jourDeplMin  += salDeplMin;
    });

    if (!rows) return '';

    grandTotalMin += jourTotalMin;
    grandDeplMin  += jourDeplMin;

    const jth = Math.floor((jourTotalMin + jourDeplMin)/60);
    const jtm = (jourTotalMin + jourDeplMin) % 60;
    const jRealMin = jourTotalMin + jourDeplMin;

    // Prévu journée = somme des heures contractuelles des salariés présents
    const salsDuJour = [...new Set(parDate[date].map(s => s.salarieId))];
    let jourPrevuMin = 0;
    salsDuJour.forEach(sid => { jourPrevuMin += getPrevuMin(date, sid); });
    const jourEcartMin = jRealMin - jourPrevuMin;
    const jourEcartStr = jourPrevuMin > 0
      ? (jourEcartMin >= 0 ? '+' : '-') + Math.floor(Math.abs(jourEcartMin)/60) + 'h' + String(Math.abs(jourEcartMin)%60).padStart(2,'0')
      : '—';
    const jourEcartColor = jourEcartMin >= 0 ? '#16a34a' : '#dc2626';
    const jourPrevStr = jourPrevuMin > 0
      ? Math.floor(jourPrevuMin/60) + 'h' + String(jourPrevuMin%60).padStart(2,'0') : '—';

    return `<div class="jour-block" data-date="${date}">
      <div class="jour-titre">
        <span>${label.charAt(0).toUpperCase() + label.slice(1)}</span>
        <span class="jour-total">Total : ${jth}h${String(jtm).padStart(2,'0')}</span>
      </div>
      <table class="real-table">
        <thead><tr>
          <th class="col-sal">Salarié</th>
          <th class="col-ch">Chantier</th>
          <th class="col-h">Horaires</th>
          <th class="col-pause">Pause</th>
          <th class="col-h">Durée</th>
          <th class="col-depl">Déplacement</th>
          <th class="col-tot">Réalisé</th>
          <th class="col-tot">Contrat</th>
          <th class="col-tot">Écart</th>
          <th class="col-actions">Actions</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr class="ligne-total">
            <td colspan="4" style="text-align:left;">Total journée</td>
            <td class="col-h">${Math.floor(jourTotalMin/60)}h${String(jourTotalMin%60).padStart(2,'0')}</td>
            <td class="col-depl">${jourDeplMin ? jourDeplMin + ' min' : '—'}</td>
            <td class="col-tot">${jth}h${String(jtm).padStart(2,'0')}</td>
            <td class="col-tot">${jourPrevStr}</td>
            <td class="col-tot" style="color:${jourEcartColor};">${jourEcartStr}</td>
            <td class="col-actions"></td>
          </tr>
        </tfoot>
      </table>
    </div>`;
  }).join('');

  // Calculer le prévu uniquement sur les jours avec des saisies
  let grandPrevuMin = 0;
  Object.keys(parDate).forEach(date => {
    const salsDuJour = [...new Set(parDate[date].map(s => s.salarieId))];
    salsDuJour.forEach(sid => { grandPrevuMin += getPrevuMin(date, sid); });
  });

  // Mettre à jour la jauge et les totaux
  majJauge(grandTotalMin, grandDeplMin, grandPrevuMin);
  setTimeout(ajusterMarginTop, 50);

  // Scroll auto vers le jour du jour (ou le plus proche si pas de saisie aujourd'hui)
  setTimeout(scrollVersAujourdhui, 100);
}

/* ═══════════════════════════
   ÉDITION / SUPPRESSION D'UN CHANTIER (patron uniquement)
═══════════════════════════ */
let _edition = null; // { sid, idx }

function ouvrirEditChantier(btn) {
  const sid = btn.dataset.sid;
  const idx = parseInt(btn.dataset.idx);
  const saisie = _saisies.find(s => String(s._id) === String(sid));
  if (!saisie) { alert('Saisie introuvable'); return; }
  const c = saisie.chantiers?.[idx];
  if (!c) { alert('Chantier introuvable'); return; }

  _edition = { sid, idx };
  document.getElementById('me-nom').value  = c.nom || '';
  document.getElementById('me-arr').value  = c.heureArrivee || '';
  document.getElementById('me-dep').value  = c.heureDepart || '';
  document.getElementById('me-depl').value  = c.deplacement || 0;
  document.getElementById('me-pause').value = c.pause || 0;
  document.getElementById('modale-edit').style.display = 'flex';
}

function fermerEditChantier() {
  document.getElementById('modale-edit').style.display = 'none';
  _edition = null;
}

async function enregistrerEditChantier() {
  if (!_edition) return;
  const { sid, idx } = _edition;
  const nom  = document.getElementById('me-nom').value.trim();
  const arr  = document.getElementById('me-arr').value;
  const dep  = document.getElementById('me-dep').value;
  const depl  = parseInt(document.getElementById('me-depl').value) || 0;
  const pause = parseInt(document.getElementById('me-pause').value) || 0;
  if (!nom) { alert('Le nom du chantier est obligatoire.'); return; }
  if (arr && dep && arr >= dep) { alert('L\'heure de départ doit être après l\'heure d\'arrivée.'); return; }

  try {
    const token = localStorage.getItem('syncToken');
    const r = await fetch(`/api/saisies/${sid}/chantier/${idx}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ nom, heureArrivee: arr, heureDepart: dep, deplacement: depl, pause })
    });
    const d = await r.json();
    if (!d.ok) { alert('Erreur : ' + (d.message || 'modification refusée')); return; }
    fermerEditChantier();
    const y = window.scrollY;
    await chargerRealise(true);
    window.scrollTo(0, y);
  } catch (e) {
    alert('Erreur réseau, vérifiez votre connexion.');
  }
}

async function supprimerChantierSaisie(btn) {
  const sid = btn.dataset.sid;
  const idx = parseInt(btn.dataset.idx);
  const saisie = _saisies.find(s => String(s._id) === String(sid));
  const c = saisie?.chantiers?.[idx];
  const nomCh = c?.nom || 'ce chantier';
  if (!confirm(`Supprimer définitivement le chantier « ${nomCh} » ?\n\nCette action ne peut pas être annulée.`)) return;

  try {
    const token = localStorage.getItem('syncToken');
    const r = await fetch(`/api/saisies/${sid}/chantier/${idx}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const d = await r.json();
    if (!d.ok) { alert('Erreur : ' + (d.message || 'suppression refusée')); return; }
    const y = window.scrollY;
    await chargerRealise(true);
    window.scrollTo(0, y);
  } catch (e) {
    alert('Erreur réseau, vérifiez votre connexion.');
  }
}

/* Scroll vers le bloc du jour courant (sinon le plus proche dans le mois affiché) */
function scrollVersAujourdhui() {
  if (_supprimerScroll) { _supprimerScroll = false; return; }
  const blocs = document.querySelectorAll('#contenu-realise .jour-block');
  if (!blocs.length) return;

  const auj = new Date();
  const ajdStr = `${auj.getFullYear()}-${String(auj.getMonth()+1).padStart(2,'0')}-${String(auj.getDate()).padStart(2,'0')}`;
  const moisAuj = ajdStr.substring(0, 7);

  // Le scroll auto n'a de sens que si le mois courant est dans la sélection
  if (!_moisSelection || !_moisSelection.has(moisAuj)) return;

  // Trouver le bloc exact, sinon le bloc dont la date est <= aujourd'hui le plus récent
  let cible = null;
  let meilleureDate = '';
  blocs.forEach(b => {
    const d = b.dataset.date;
    if (!d) return;
    if (d === ajdStr) cible = b;
    if (!cible && d <= ajdStr && d > meilleureDate) meilleureDate = d;
  });
  if (!cible) cible = [...blocs].find(b => b.dataset.date === meilleureDate);
  if (!cible) cible = blocs[0]; // fallback : premier bloc du mois

  // Scroll en tenant compte de la barre fixe en haut
  const bar = document.getElementById('top-bar');
  const offset = (bar?.offsetHeight || 0) + 8;
  const y = cible.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

function sauverSeuils() { /* obsolète */ }

/* ══ JAUGE CIRCULAIRE ══ */
function getSeuilsJauge() {
  let r, o;
  try {
    const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
    if (ent.jauge) { r = ent.jauge.rouge; o = ent.jauge.orange; }
  } catch (_) {}
  if (r == null) r = parseInt(localStorage.getItem('jaugeRouge'))  || 33;
  if (o == null) o = parseInt(localStorage.getItem('jaugeOrange')) || 66;
  return {
    rouge:  Math.max(0, Math.min(100, r)),
    orange: Math.max(0, Math.min(100, o))
  };
}
function arcPathJauge(pctFrom, pctTo) {
  if (pctTo <= pctFrom) return '';
  const a1 = Math.PI * (1 + pctFrom / 100);
  const a2 = Math.PI * (1 + pctTo / 100);
  const x1 = 50 + 40 * Math.cos(a1), y1 = 60 + 40 * Math.sin(a1);
  const x2 = 50 + 40 * Math.cos(a2), y2 = 60 + 40 * Math.sin(a2);
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A 40 40 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

function majJauge(totalMin = 0, deplMin = 0, prevMin = 0) {
  const realiseMin = totalMin + deplMin;
  const realiseH   = (realiseMin / 60).toFixed(1);
  const prevH      = (prevMin / 60).toFixed(1);
  const pct        = prevMin > 0 ? Math.min(100, Math.round((realiseMin / prevMin) * 100)) : 0;
  const ecartMin   = realiseMin - prevMin;
  const ecart      = prevMin > 0 ? (ecartMin / 60).toFixed(1) : null;

  document.getElementById('tot-total').textContent = realiseH + ' h';
  document.getElementById('tot-prev').textContent  = prevMin > 0 ? prevH + ' h' : '—';
  const tdEcart = document.getElementById('tot-ecart');
  const lEcart  = document.getElementById('ligne-ecart');
  if (ecart === null) {
    tdEcart.textContent = '—';
    tdEcart.style.color = '#6b7280';
    lEcart.style.background = '#f8fafc';
  } else {
    tdEcart.textContent = (parseFloat(ecart) >= 0 ? '+' : '') + ecart + ' h';
    if (parseFloat(ecart) >= 0) {
      tdEcart.style.color = '#16a34a';
      lEcart.style.background = '#f0fdf4';
    } else {
      tdEcart.style.color = '#dc2626';
      lEcart.style.background = '#fef2f2';
    }
  }

  // Dessin des arcs
  const { rouge, orange } = getSeuilsJauge();
  const cap = Math.max(0, Math.min(100, pct));
  const ar = document.getElementById('arc-rouge');
  const ao = document.getElementById('arc-orange');
  const av = document.getElementById('arc-vert');
  if (ar && ao && av) {
    ar.setAttribute('d', arcPathJauge(0, Math.min(cap, rouge)));
    ao.setAttribute('d', cap > rouge ? arcPathJauge(rouge, Math.min(cap, orange)) : '');
    av.setAttribute('d', cap > orange ? arcPathJauge(orange, cap) : '');
  }
  const pourcentage = document.getElementById('pct-jauge');
  if (pourcentage) {
    pourcentage.textContent = pct + '%';
    let color = '#0f172a';
    if (cap < rouge)        color = '#dc2626';
    else if (cap < orange)  color = '#b45309';
    else                    color = '#16a34a';
    pourcentage.setAttribute('fill', color);
  }
}
