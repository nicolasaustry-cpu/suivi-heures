<script>
let salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]').filter(s => !s.administratif);
let heures   = JSON.parse(localStorage.getItem('heuresdata')   || '{}');
let salariesCoches = new Set();

/* ====== DÉCALAGE BARRE FIXE ====== */
function ajusterMarginTop() {
  const topBar = document.querySelector('.top-bar');
  const wrapper = document.getElementById('planning-wrapper');
  if (topBar && wrapper) {
    wrapper.style.marginTop = (topBar.offsetHeight + 8) + 'px';
  }
}

/* ====== FILTRE SALARIÉS (style Excel) ====== */
function initFiltre() {
  salariesCoches.clear();
  salaries.forEach(s => salariesCoches.add(s.id));
  majBoutonFiltre();
}

function ouvrirFiltreSalaries(btn) {
  const items = salaries.map(s => ({ value: s.id, label: s.prenom + ' ' + s.nom }));
  FiltreExcel.ouvrir({
    button: btn,
    items: items,
    selected: salariesCoches,
    onApply: (selectedSet) => {
      salariesCoches = selectedSet;
      majBoutonFiltre();
      genererPlanning();
    }
  });
}

function majBoutonFiltre() {
  const btn = document.getElementById('btn-filtre-salaries');
  if (!btn) return;
  const total = salaries.length;
  const items = salaries.map(s => ({ value: s.id, label: s.prenom + ' ' + s.nom }));
  btn.textContent = FiltreExcel.libelle(salariesCoches, total, items) + ' ▼';
  if (salariesCoches.size === total || salariesCoches.size === 0) {
    btn.classList.remove('fexc-active');
  } else {
    btn.classList.add('fexc-active');
  }
}

/* ====== JAUGE CIRCULAIRE ====== */
/* Les seuils sont paramétrés sur la page Entreprise.
   Ici on les lit en lecture seule depuis le localStorage. */

function getSeuilsJauge() {
  let r, o;
  try {
    const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
    if (ent.jauge) { r = ent.jauge.rouge; o = ent.jauge.orange; }
  } catch (_) {}
  if (r == null) r = parseInt(localStorage.getItem('jaugeRouge'))  || 33;
  if (o == null) o = parseInt(localStorage.getItem('jaugeOrange')) || 66;
  return {
    rouge:  Math.max(0, Math.min(100, r)),
    orange: Math.max(0, Math.min(100, o))
  };
}

function arcPathJauge(pctFrom, pctTo) {
  if (pctTo <= pctFrom) return '';
  const a1 = Math.PI * (1 + pctFrom / 100);
  const a2 = Math.PI * (1 + pctTo / 100);
  const x1 = 50 + 40 * Math.cos(a1), y1 = 60 + 40 * Math.sin(a1);
  const x2 = 50 + 40 * Math.cos(a2), y2 = 60 + 40 * Math.sin(a2);
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A 40 40 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

function dessinerJauge(pct) {
  const { rouge, orange } = getSeuilsJauge();
  const ar = document.getElementById('arc-rouge');
  const ao = document.getElementById('arc-orange');
  const av = document.getElementById('arc-vert');
  const pourcentage = document.getElementById('pourcentage');

  if (!ar || !ao || !av) return;

  const cap = Math.max(0, Math.min(100, pct));
  ar.setAttribute('d', arcPathJauge(0, Math.min(cap, rouge)));
  ao.setAttribute('d', cap > rouge ? arcPathJauge(rouge, Math.min(cap, orange)) : '');
  av.setAttribute('d', cap > orange ? arcPathJauge(orange, cap) : '');

  if (pourcentage) {
    pourcentage.textContent = (pct || 0).toFixed(0) + '%';
    // Couleur du chiffre selon la zone
    let color = '#0f172a';
    if (cap < rouge)         color = '#dc2626';
    else if (cap < orange)   color = '#b45309';
    else                     color = '#16a34a';
    pourcentage.setAttribute('fill', color);
  }
}

// Cache des options de base (sans sélection)
const _optionsBase = (() => {

  for (let i = 0; i <= 10; i += 0.25) vals.push(i);
  return vals;
})();
const _optionsBaseHTML = _optionsBase.map(i => {

  return `<option value="${i}">${lbl}</option>`;
}).join('');

// Cache par valeur sélectionnée
const _optsCache = {};
function genOptionsHeures(v) {
  const key = (+v || 0).toFixed(2);
  if (_optsCache[key]) return _optsCache[key];
  const target = +v || 0;
  let opt = '';
  for (const i of _optionsBase) {
    const lbl = i === Math.floor(i) ? i : i.toFixed(2);
    const sel = Math.abs(i - target) < 0.001 ? ' selected' : '';
    opt += `<option value="${i}"${sel}>${lbl}</option>`;
  }
  _optsCache[key] = opt;
  return opt;
}

/* Récupère les noms de chantiers du prévisionnel pour le mois en cours
   et les 3 mois suivants (gère le passage d'année). Retourne une liste
   de noms uniques, triés. */
function getChantiersPrevisionnel() {
  const prev = JSON.parse(localStorage.getItem('previsionnel_data') || '{}');
  const noms = new Set();
  const now  = new Date();
  let an  = now.getFullYear();
  let moi = now.getMonth(); // 0-11

  for (let i = 0; i < 4; i++) {           // mois en cours + 3 suivants
    const moisData = prev?.[an]?.[moi];
    if (moisData && Array.isArray(moisData.chantiers)) {
      moisData.chantiers.forEach(c => {
        if (c.client && c.client.trim()) noms.add(c.client.trim());
      });
    }
    moi++;
    if (moi > 11) { moi = 0; an++; }      // passage à l'année suivante
  }
  return [...noms].sort((a, b) => a.localeCompare(b, 'fr'));
}

/* Construit le HTML d'un <datalist> à partir des chantiers du prévisionnel. */
function genDatalistChantiers() {
  const options = getChantiersPrevisionnel()
    .map(nom => `<option value="${nom.replace(/"/g, '&quot;')}">`)
    .join('');
  return `<datalist id="liste-chantiers-prev">${options}</datalist>`;
}

/* ─── ALTERNANCE SEMAINE A / B ───────────────────────────────
   Un salarié "alternant" possède :
     s.alternance = true
     s.heuresParJourA = { lun..sam }   (semaine A)
     s.heuresParJourB = { lun..sam }   (semaine B)
     s.bascules = [ { date:'YYYY-MM-DD' (un lundi), semaine:'A'|'B' }, ... ]
   Un salarié classique garde s.heuresParJour (inchangé). */

/* Retourne le lundi (00:00) de la semaine contenant la date d. */
function lundiDeLaSemaine(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const j = x.getDay();                 // 0=dim,1=lun,...
  const decal = (j === 0) ? -6 : (1 - j);
  x.setDate(x.getDate() + decal);
  x.setHours(0,0,0,0);
  return x;
}

/* Nombre de semaines entières entre deux lundis (>=0). */
function nbSemainesEntre(lundiRef, lundiCible) {
  const ms = lundiCible - lundiRef;
  return Math.round(ms / (7 * 24 * 3600 * 1000));
}

/* Détermine si la date d tombe en semaine 'A' ou 'B' pour ce salarié,
   d'après la dernière bascule applicable (date <= lundi de la semaine de d). */
function semaineAB(s, d) {
  const bascules = Array.isArray(s.bascules) ? s.bascules.slice() : [];
  if (!bascules.length) return 'A';     // par défaut A si aucune bascule
  bascules.sort((a, b) => a.date.localeCompare(b.date));

  const lundiCible = lundiDeLaSemaine(d);
  // Dernière bascule dont la date (un lundi) est <= lundi de la semaine cible
  let active = null;
  for (const b of bascules) {
    const lb = lundiDeLaSemaine(new Date(b.date + 'T00:00:00'));
    if (lb <= lundiCible) active = { lundi: lb, semaine: b.semaine };
  }
  if (!active) {
    // Avant la première bascule : on prend la 1re et on rétro-alterne
    const first = bascules[0];
    const lb = lundiDeLaSemaine(new Date(first.date + 'T00:00:00'));
    const n = nbSemainesEntre(lundiCible, lb); // positif, cible avant lb
    return (n % 2 === 0) ? first.semaine : (first.semaine === 'A' ? 'B' : 'A');
  }
  const n = nbSemainesEntre(active.lundi, lundiCible);
  return (n % 2 === 0) ? active.semaine : (active.semaine === 'A' ? 'B' : 'A');
}

/* Renvoie la grille d'heures applicable à ce salarié pour la date d,
   en tenant compte de l'alternance si elle est activée. */
function grilleHeuresPourDate(s, d) {
  if (s && s.alternance) {
    const sem = semaineAB(s, d);
    return (sem === 'B' ? s.heuresParJourB : s.heuresParJourA) || {};
  }
  return s.heuresParJour || {};
}

// Fait défiler la page pour amener le bloc du jour (ou le jour ouvré le plus
// proche ≤ aujourd'hui) juste sous la barre supérieure fixe.
function defilerVersAujourdhui(moisSel) {
  const now = new Date();
  const moisCourant = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  if (moisSel !== moisCourant) return;

  const cont = document.getElementById('planning-wrapper');
  if (!cont) return;
  const blocs = [...cont.querySelectorAll('.jour-block[data-date]')];
  if (!blocs.length) return;

  const aujStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  // Bloc du jour exact, sinon dernier bloc dont la date est ≤ aujourd'hui
  let cible = blocs.find(b => b.dataset.date === aujStr);
  if (!cible) {
    const passes = blocs.filter(b => b.dataset.date <= aujStr);
    cible = passes.length ? passes[passes.length - 1] : blocs[0];
  }

  const topBar = document.querySelector('.top-bar');
  const decal  = (topBar ? topBar.offsetHeight : 0) + 12;

  // Léger délai pour laisser le layout se stabiliser (marginTop venant d'être posée)
  setTimeout(() => {
    const y = cible.getBoundingClientRect().top + window.pageYOffset - decal;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }, 80);
}

/* Colore les cases "heure" du planning selon la consommation par rapport
   au prévisionnel (devis), pour CHAQUE chantier :
   - orange : total planifié du chantier > 90 % des heures prévues
   - rouge  : total planifié du chantier > heures prévues
   - aucune couleur : chantier absent du prévisionnel (0 h prévues)
   Toutes les cases d'un même chantier reçoivent la même couleur. */
function majCouleursChantiers() {
  const ORANGE = '#fed7aa';   // orange clair
  const ROUGE  = '#f87171';   // rouge plus soutenu
  const NEUTRE = '';          // pas de couleur

  // Cache des couleurs par chantier (évite de recalculer pour chaque case)
  const couleurParChantier = new Map(); // clé normalisée -> couleur

  document.querySelectorAll('#planning-wrapper input[id$="chantier"]').forEach(input => {
    const k   = input.id.replace(/chantier$/, '');
    const sel = document.getElementById(k + 'h');
    if (!sel) return;

    const nom = (input.value || '').trim();
    const estTNA = nom.toUpperCase() === TNA;
    input.style.color      = estTNA ? '#dc2626' : '';   // TNA en rouge
    input.style.fontWeight = estTNA ? '700'     : '';
    if (!nom) { sel.style.background = NEUTRE; return; }

    const cible = normaliserChantier(nom);
    let couleur = couleurParChantier.get(cible);
    if (couleur === undefined) {
      const devis = getTotalDevisChantier(nom);
      if (devis <= 0) {
        couleur = NEUTRE;                       // pas de prévisionnel → neutre
      } else {
        const planifie = getStatsChantier(nom)?.total || 0;
        if (planifie > devis)            couleur = ROUGE;
        else if (planifie > 0.9 * devis) couleur = ORANGE;
        else                             couleur = NEUTRE;
      }
      couleurParChantier.set(cible, couleur);
    }
    sel.style.background = couleur;
  });
}

/* ====== SAUVEGARDE TEMPS RÉEL ====== */
/* Vide le nom du chantier d'une case (les heures sont conservées). */
function viderChantier(k) {
  const input = document.getElementById(k + 'chantier');
  if (!input) return;
  input.value = '';
  const hSel = document.getElementById(k + 'h');
  if (hSel) hSel.value = '0';            // remet les heures saisies à 0 (affichage)
  if (heures[k]) delete heures[k].note;  // on retire aussi la note de la cellule
  saveHeure(k, '', 0);                   // enregistre : chantier vidé ET 0 heure saisie
  majBoutonNote(k);                      // met à jour l'indicateur + la note imprimable
  onLigneRecalc(k);                      // recalcule « TEMPS NON AFFECTE » si nécessaire
  input.focus();
}

function saveHeure(k, ch, h) {
  const noteAv = heures[k] && heures[k].note ? heures[k].note : '';
  const rdvAv  = heures[k] && heures[k].rdv  ? heures[k].rdv  : '';
  const rdvAutAv = heures[k] && heures[k].rdvAuteur ? heures[k].rdvAuteur : '';
  heures[k] = { chantier: ch, heures: parseFloat(h) || 0 };
  if (noteAv) heures[k].note = noteAv;
  if (rdvAv)  heures[k].rdv  = rdvAv;          // l'heure de RDV suit le chantier
  if (rdvAutAv) heures[k].rdvAuteur = rdvAutAv;
  localStorage.setItem('heuresdata', JSON.stringify(heures));
  majBoutonNote(k);   // l'indicateur de note suit le nom de chantier de la cellule

  const match = k.match(/^(\d+)(\d{4}_\d{2}_\d{2})/);
  if (!match) return;
  majTotalLigne(match[1], match[2].replace(/_/g, '-'));
  majCouleursChantiers();
}

/* ── Heure de RDV par chantier (préparation alerte mobile du salarié) ── */
function saveRdv(k, val) {
  if (!heures[k]) heures[k] = { chantier: '', heures: 0 };
  if (val) { heures[k].rdv = val; heures[k].rdvAuteur = 'gerant'; }   // planning desktop = autorité gérant
  else { delete heures[k].rdv; delete heures[k].rdvAuteur; }
  localStorage.setItem('heuresdata', JSON.stringify(heures));
  majRdvVisuel(k);

/* Ouvre un petit panneau de saisie de l'heure JUSTE À CÔTÉ de la cellule cliquée,
   avec sélecteur d'heure + boutons Valider / Effacer / Annuler. */
let _rdvPopK = null;
function ouvrirRdv(k) {

  let pop = document.getElementById('rdv-pop');

    pop = document.createElement('div');
    pop.id = 'rdv-pop';
    pop.className = 'no-print';
    pop.innerHTML =
      '<div class="rdv-pop-titre">Heure de RDV</div>' +
      '<input type="time" id="rdv-pop-input" onkeydown="if(event.key===\'Enter\')validerRdvPop();if(event.key===\'Escape\')fermerRdvPop();">' +
      '<div class="rdv-pop-actions">' +
        '<button type="button" class="rdv-pop-ok" onclick="validerRdvPop()">Valider</button>' +
        '<button type="button" class="rdv-pop-clear" onclick="effacerRdvPop()">Effacer</button>' +
        '<button type="button" class="rdv-pop-cancel" onclick="fermerRdvPop()">Annuler</button>' +
      '</div>';
    document.body.appendChild(pop);
  }
  _rdvPopK = k;
  const input = document.getElementById('rdv-pop-input');
  input.value = (heures[k] && heures[k].rdv) ? heures[k].rdv : '';
  pop.style.display = 'block';
  // Positionnement à côté du bouton (à droite, sinon à gauche si pas la place)
  const r  = btn.getBoundingClientRect();
  const pw = pop.offsetWidth  || 180;
  const ph = pop.offsetHeight || 96;
  let left = r.right + 6;
  if (left + pw > window.innerWidth - 8) left = r.left - pw - 6;
  if (left < 8) left = 8;
  let top = r.top;
  if (top + ph > window.innerHeight - 8) top = window.innerHeight - ph - 8;
  if (top < 8) top = 8;
  pop.style.left = left + 'px';
  pop.style.top  = top  + 'px';
  setTimeout(() => { input.focus(); }, 20);
}
function validerRdvPop() {

}
function effacerRdvPop() {

  fermerRdvPop();
}
function fermerRdvPop() {

/* Fermer (annuler) si on clique en dehors du panneau */
document.addEventListener('mousedown', (e) => {

  if (!pop || pop.style.display === 'none') return;

});

/* ── TEMPS NON AFFECTE — auto-remplissage du planning ────────────────
   Hors SAV, et UNIQUEMENT à partir d'aujourd'hui (jamais les jours passés).
   Le 1er chantier saisi prend par défaut le contrat du jour (− absence),
   le reste éventuel est porté par un chantier « TEMPS NON AFFECTE »
   (auto-calculé, masqué quand il vaut 0). */
const TNA = 'TEMPS NON AFFECTE';

function estDatePassee(dateStr) {
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  const [a, m, j] = dateStr.split('-').map(Number);
  const d = new Date(a, m - 1, j); d.setHours(0, 0, 0, 0);
  return d < auj;
}

/* Jours fériés français + jours d'école (neutralisés dans le contrat) */
var _plcCacheF = {};
function _plcPaques(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),jo=((h+l-7*mm+114)%31)+1;return new Date(y,mo-1,jo);}
function _plcFeries(y){
  if(_plcCacheF[y])return _plcCacheF[y];
  var f={},pad=function(n){return String(n).padStart(2,'0');},isod=function(dd){return dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());};
  [[0,1],[4,1],[4,8],[6,14],[7,15],[10,1],[10,11],[11,25]].forEach(function(x){f[isod(new Date(y,x[0],x[1]))]=1;});
  var p=_plcPaques(y);
  [1,39,50].forEach(function(n){var dd=new Date(p);dd.setDate(p.getDate()+n);f[isod(dd)]=1;});
  _plcCacheF[y]=f;return f;
}
function estFeriePlc(dateStr){var y=parseInt(dateStr.slice(0,4),10);return !!_plcFeries(y)[dateStr];}
function estJourEcolePlc(s,dateStr){return !!(s&&s.apprenti&&Array.isArray(s.joursEcole)&&s.joursEcole.indexOf(dateStr)!==-1);}

function contratDuJour(s, dateStr) {
  if (estFeriePlc(dateStr)) return 0;
  if (estJourEcolePlc(s, dateStr)) return 0;
  const [a, m, j] = dateStr.split('-').map(Number);
  const dObj = new Date(a, m - 1, j);
  const cle = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'][dObj.getDay()];
  return (grilleHeuresPourDate(s, dObj))[cle] || 0;
}

function _eligibleTNA(s, dateStr) {
  return !!(s && !s.sav && !estDatePassee(dateStr));
}

/* Recalcule et place/retire « TEMPS NON AFFECTE » sur une ligne (salarié × jour). */
function appliquerTempsNonAffecte(salarieId, dateStr) {
  const s = salaries.find(x => String(x.id) === String(salarieId));
  if (!_eligibleTNA(s, dateStr)) return;
  const safeDate = dateStr.replace(/-/g, '_');
  const abs   = parseFloat(heures[`${salarieId}${safeDate}abs`]?.heures) || 0;
  const cible = Math.max(0, contratDuJour(s, dateStr) - abs);

  const slots = [];
  for (let i = 1; i <= 5; i++) {
    const k = `${salarieId}${safeDate}ch${i}`;
    const e = heures[k];
    slots.push({ i, k, nom: (e?.chantier || '').trim(), h: parseFloat(e?.heures) || 0 });
  }
  const reels = slots.filter(sl => sl.nom && sl.nom.toUpperCase() !== TNA);
  // Nettoyage : retirer l'ancien TNA (recalculé) et toute entrée sans nom (heures fantômes)
  slots.forEach(sl => {
    if (sl.nom.toUpperCase() === TNA) delete heures[sl.k];
    else if (!sl.nom && heures[sl.k]) delete heures[sl.k];
  });

  if (reels.length > 0) {
    const somme = reels.reduce((acc, sl) => acc + sl.h, 0);
    const reste = Math.round((cible - somme) * 100) / 100;
    if (reste > 0.001) {
      const occupes = new Set(reels.map(sl => sl.i));
      let libre = null;
      for (let i = 1; i <= 5; i++) if (!occupes.has(i)) { libre = i; break; }
      if (libre) heures[`${salarieId}${safeDate}ch${libre}`] = { chantier: TNA, heures: reste };
    }
  }
  localStorage.setItem('heuresdata', JSON.stringify(heures));
}

/* Resynchronise l'affichage d'une ligne depuis heures (et verrouille les heures du TNA). */
function rafraichirLigne(salarieId, dateStr) {
  const safeDate = dateStr.replace(/-/g, '_');
  for (let i = 1; i <= 5; i++) {
    const k = `${salarieId}${safeDate}ch${i}`;
    const e = heures[k] || { chantier: '', heures: 0 };
    const inp = document.getElementById(k + 'chantier');
    const sel = document.getElementById(k + 'h');
    if (inp) inp.value = e.chantier || '';
    if (sel) { sel.value = String(parseFloat(e.heures) || 0); sel.disabled = false; }
    majRdvVisuel(k);
    majBoutonNote(k);
  }
  majTotalLigne(salarieId, dateStr);
  majCouleursChantiers();
}

/* Saisie/MAJ d'un nom de chantier (blur) : défaut du 1er chantier, puis recalcul TNA. */
function onChantierFocus(k) {
  // Au focus d'une case « TEMPS NON AFFECTE », on vide l'affichage pour rendre le menu
  // déroulant utilisable. heures[k] garde la valeur : si rien n'est choisi, le TNA est
  // restauré au blur par onChantierCommit (recalcul).
  const inp = document.getElementById(k + 'chantier');
  if (inp && (inp.value || '').trim().toUpperCase() === TNA) inp.value = '';
}

function onChantierCommit(k) {
  const mm = k.match(/^(\d+)(\d{4}_\d{2}_\d{2})ch\d+$/);
  if (!mm) return;
  const salarieId = mm[1], safe = mm[2], dateStr = safe.replace(/_/g, '-');
  const s = salaries.find(x => String(x.id) === String(salarieId));
  if (!_eligibleTNA(s, dateStr)) return;

  // Resynchroniser heures[k] depuis la saisie en cours (fiabilise la sélection via le menu déroulant)
  const inpEl = document.getElementById(k + 'chantier');
  const selEl = document.getElementById(k + 'h');
  if (inpEl) saveHeure(k, (inpEl.value || '').trim().toUpperCase(), selEl ? selEl.value : (heures[k]?.heures || 0));

  const e = heures[k] || { chantier: '', heures: 0 };
  const nom = (e.chantier || '').trim();
  if (nom && nom.toUpperCase() !== TNA && (parseFloat(e.heures) || 0) === 0) {
    let nbReels = 0;
    for (let i = 1; i <= 5; i++) {
      const n = (heures[`${salarieId}${safe}ch${i}`]?.chantier || '').trim();
      if (n && n.toUpperCase() !== TNA) nbReels++;
    }
    if (nbReels === 1) {
      const abs = parseFloat(heures[`${salarieId}${safe}abs`]?.heures) || 0;
      const cible = Math.max(0, contratDuJour(s, dateStr) - abs);
      if (cible > 0) { heures[k] = { chantier: nom, heures: cible }; localStorage.setItem('heuresdata', JSON.stringify(heures)); }
    }
  }
  appliquerTempsNonAffecte(salarieId, dateStr);
  rafraichirLigne(salarieId, dateStr);
}

/* Changement d'heures (chantier réel) ou d'absence : recalcul TNA. */
function onLigneRecalc(k) {
  const mm = k.match(/^(\d+)(\d{4}_\d{2}_\d{2})/);
  if (!mm) return;
  const salarieId = mm[1], dateStr = mm[2].replace(/_/g, '-');
  const s = salaries.find(x => String(x.id) === String(salarieId));
  if (!_eligibleTNA(s, dateStr)) return;
  appliquerTempsNonAffecte(salarieId, dateStr);
  rafraichirLigne(salarieId, dateStr);
}

/* ── Notes de chantier (planning) : note GÉNÉRALE par chantier (cumulative) ── */
let _noteCleCourante = null;
let _notesChantiers = {};

function chargerNotesChantiers() {
  try { _notesChantiers = JSON.parse(localStorage.getItem('notesChantiersdata') || '{}'); }
  catch { _notesChantiers = {}; }
}
chargerNotesChantiers();
/* Quand la synchro serveur se termine (souvent APRÈS le premier rendu sur connexion
   lente), on reconstruit le planning avec les données fraîches : sans ça, les chips de
   notes de chantier, le calcul des TNA et les heures par défaut du 1er chantier ne
   s'affichent pas. Garde : si l'utilisateur est en train d'éditer une case, on ne
   reconstruit pas (on perdrait le focus) — on rafraîchit juste les notes. */
window.addEventListener('donnees-chargees', () => {
  chargerNotesChantiers();
  if (typeof genererPlanning !== 'function') { rafraichirNotesAffichage(); return; }
  // donnees-chargees ne se déclenche qu'une fois (au chargement, pas de polling).
  // On reconstruit TOUJOURS le planning : sur connexion lente, si l'utilisateur a
  // cliqué dans une case pendant le chargement, il ne faut PAS sauter le re-render —
  // sinon le global `salaries` reste vide (auto-implantation du contrat KO) et les
  // notes ne s'affichent pas. Les saisies déjà faites sont conservées (relues depuis
  // le localStorage). On restaure le focus sur la même case si possible.
  const actifId = document.activeElement && document.activeElement.id;
  genererPlanning();
  if (actifId) { const el = document.getElementById(actifId); if (el) el.focus(); }
});

function _nomChantierCell(k) {
  const el = document.getElementById(k + 'chantier');
  return el && el.value ? el.value.trim().toUpperCase() : '';
}
function noteDuChantier(nom) {
  return (nom && _notesChantiers[nom]) ? _notesChantiers[nom] : '';
}

function majBoutonNote(k) {
  const note = noteDuChantier(_nomChantierCell(k));
  const btn = document.getElementById(k + 'note-btn');
  if (btn) btn.classList.toggle('has-note', !!note);
  const pr = document.getElementById(k + 'note-print');
  if (pr) pr.innerHTML = note ? '📝 ' + escapeHtml(note) : '';
}

function rafraichirNotesAffichage() {
  document.querySelectorAll('.btn-note-ch').forEach(btn => {
    const id = btn.id || '';
    if (id.endsWith('note-btn')) majBoutonNote(id.slice(0, -8)); // 'note-btn'.length = 8
  });
}

function ouvrirNoteChantier(k) {
  _noteCleCourante = k;
  const nom = _nomChantierCell(k);
  document.getElementById('note-modal-sub').textContent =
    nom ? ('Chantier : ' + nom) : 'Renseignez d’abord un chantier dans la cellule';
  const hist = document.getElementById('note-modal-hist');
  const note = noteDuChantier(nom);
  if (hist) hist.textContent = note || '(aucune note pour ce chantier)';
  const txt = document.getElementById('note-modal-txt');
  txt.value = '';
  const btnAjout = document.getElementById('note-modal-ajouter');
  if (btnAjout) { btnAjout.disabled = !nom; btnAjout.textContent = 'Ajouter'; }
  if (window.DocsChantier) { const _dc = document.getElementById('note-modal-docs'); if (_dc) { if (nom) DocsChantier.monter(nom, _dc); else DocsChantier.vider(_dc); } }
  document.getElementById('note-modal-overlay').style.display = 'flex';
  setTimeout(() => txt.focus(), 30);
}

function fermerNoteChantier() {
  const o = document.getElementById('note-modal-overlay');
  if (o) o.style.display = 'none';
  _noteCleCourante = null;
}

async function enregistrerNoteChantier() {
  if (!_noteCleCourante) return;
  const nom   = _nomChantierCell(_noteCleCourante);
  const texte = document.getElementById('note-modal-txt').value.trim();
  if (!nom)   { alert('Renseignez d’abord un chantier dans cette cellule.'); return; }
  if (!texte) { fermerNoteChantier(); return; }
  const btn = document.getElementById('note-modal-ajouter');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const token = localStorage.getItem('syncToken');
    const r = await fetch('/api/data/note-chantier', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ chantier: nom, texte, auteur: 'Gérant' })
    });
    const d = await r.json();
    if (d.ok) {
      _notesChantiers[nom] = d.note;
      rafraichirNotesAffichage();
      fermerNoteChantier();
    } else {
      alert(d.message || 'Échec de l’enregistrement de la note.');
      if (btn) { btn.disabled = false; btn.textContent = 'Ajouter'; }
    }
  } catch (e) {
    alert('Erreur réseau lors de l’enregistrement de la note.');
    if (btn) { btn.disabled = false; btn.textContent = 'Ajouter'; }
  }
}

function majTotalLigne(salarieId, dateStr) {
  const tr = document.querySelector(`tr[data-salarie="${salarieId}"][data-date="${dateStr}"]`);
  if (!tr) return;

  const safeDate = dateStr.replace(/-/g, '_');
  const sal   = salaries.find(s => s.id == salarieId);
  if (!sal) return;
  const nbCh  = sal.sav ? 10 : 5;
  let total = 0;
  for (let i = 1; i <= nbCh; i++) {
    const cell = heures[`${salarieId}${safeDate}ch${i}`];
    if ((cell?.chantier || '').trim().toUpperCase() === TNA) continue; // TNA exclu du total planifié
    total += parseFloat(cell?.heures || 0);
  }

  const absK  = `${salarieId}${safeDate}abs`;
  const abs   = parseFloat(heures[absK]?.heures || 0);

  const jour  = new Date(dateStr).getDay();
  const cle   = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'][jour];
  const dObj  = new Date(dateStr + 'T00:00:00');
  const prevu = (grilleHeuresPourDate(sal, dObj))[cle] || 0;
  const ecart = total - prevu + abs;

  tr.querySelector('.cell-total').textContent = total.toFixed(1);

  // Vérifier si AU MOINS UN salarié a des heures ce jour-là
  const tousLesTrs = document.querySelectorAll(`tr[data-date="${dateStr}"]`);
  let jourADesHeures = false;
  tousLesTrs.forEach(row => {
    const t = parseFloat(row.querySelector('.cell-total')?.textContent) || 0;
    if (t > 0) jourADesHeures = true;
  });

  // Mettre à jour toutes les lignes de la journée
  tousLesTrs.forEach(row => {
    const idSal  = row.dataset.salarie;
    const salRow = salaries.find(s => s.id == idSal);
    if (!salRow) return;
    const prevuRow = (grilleHeuresPourDate(salRow, dObj))[cle] || 0;
    const totalRow = parseFloat(row.querySelector('.cell-total')?.textContent) || 0;
    const absRow   = parseFloat(row.querySelector("select[data-type='abs']")?.value) || 0;
    const ecartRow = totalRow - prevuRow + absRow;

    const prevuCell = row.querySelector('.cell-prevu');
    const ecCell    = row.querySelector('.cell-ecart');
    if (jourADesHeures) {
      prevuCell.textContent  = (prevuRow - absRow).toFixed(1);
      ecCell.textContent     = (ecartRow >= 0 ? '+' : '') + ecartRow.toFixed(1);
      ecCell.style.color     = ecartRow < 0 ? 'red' : 'green';
    } else {
      prevuCell.textContent  = '';
      ecCell.textContent     = '';
    }
  });

  majTotauxGlobaux();
}

function majTotauxGlobaux() {
  let totT = 0, totA = 0, totP = 0;
  document.querySelectorAll('tr[data-salarie]').forEach(tr => {
    totT += parseFloat(tr.querySelector('.cell-total')?.textContent) || 0;
    totA += parseFloat(tr.querySelector("select[data-type='abs']")?.value) || 0;
    totP += parseFloat(tr.querySelector('.cell-prevu')?.textContent) || 0;
  });

  const ec = totT - totP;
  document.getElementById('tot-total').textContent = totT.toFixed(1) + ' h';
  document.getElementById('tot-prev').textContent  = totP.toFixed(1) + ' h';
  const ligneEcart = document.getElementById('ligne-ecart');
  const tdEcart    = document.getElementById('tot-ecart');
  tdEcart.textContent = (ec >= 0 ? '+' : '') + ec.toFixed(1) + ' h';
  if (ec < 0) {
    tdEcart.style.color = '#dc2626';
    ligneEcart.style.background = '#fef2f2';
  } else {
    tdEcart.style.color = '#16a34a';
    ligneEcart.style.background = '#f0fdf4';
  }

  const pct = totP > 0 ? (totT / totP) * 100 : 0;
  dessinerJauge(pct);
}

/* ====== IMPRESSION ====== */
function chargerSemaines() {
  const m   = document.getElementById('moisPlanning').value;
  const sel = document.getElementById('semaineSelect');
  sel.innerHTML = '<option value="">— Mois complet —</option>';
  if (!m) return;

  const [a, mo] = m.split('-').map(Number);
  const dL = new Date(a, mo, 0);
  let lun = new Date(a, mo - 1, 1);
  while (lun.getDay() !== 1) lun.setDate(lun.getDate() + 1);

  let i = 1;
  while (lun <= dL) {
    const sam = new Date(lun);
    sam.setDate(lun.getDate() + 5);
    const op = document.createElement('option');
    op.value = i;
    op.textContent = `Semaine ${i} : ${lun.toLocaleDateString('fr-FR')} → ${sam.toLocaleDateString('fr-FR')}`;
    sel.appendChild(op);
    lun.setDate(lun.getDate() + 7);
    i++;
  }
}

function imprimerSemaine() {
  const semaine = document.getElementById('semaineSelect').value;
  const mois    = document.getElementById('moisPlanning').value;
  if (!mois) { alert('Veuillez sélectionner un mois.'); return; }

  // Appliquer le filtrage des colonnes CH selon les cases cochées
  const classesAjoutees = [];
  let nbChCoches = 0;
  document.querySelectorAll('.print-ch-cb').forEach(cb => {
    if (cb.checked) {
      nbChCoches++;
    } else {
      const cls = 'hide-ch' + cb.dataset.ch;
      document.body.classList.add(cls);
      classesAjoutees.push(cls);
    }
  });

  // Calcul du facteur de zoom : on agrandit le tableau proportionnellement
  // à la largeur "perdue" par les colonnes décochées, +50% pour bien remplir.
  // Largeur d'origine = 150 (Salariés) + 5×200 (Ch) + 55 (Total) = 1205 px
  // Largeur restante  = 150 + nbChCoches×200 + 55
  const LARG_ORIG = 1294;
  const largRestante = 128 + nbChCoches * 224 + 46;
  let zoom = nbChCoches > 0 ? (LARG_ORIG / largRestante) : 1;
  // Bonus +50% : seulement quand des colonnes sont masquées
  if (nbChCoches > 0 && nbChCoches < 5) zoom *= 1.5;

  // Appliquer le zoom sur le contenu imprimable, centré horizontalement
  const wrapper = document.getElementById('planning-wrapper');
  const ancienTransform       = wrapper.style.transform;
  const ancienTransformOrigin = wrapper.style.transformOrigin;
  const ancienWidth           = wrapper.style.width;
  const ancienMargin          = wrapper.style.margin;
  if (zoom > 1) {
    wrapper.style.transformOrigin = 'top center';
    wrapper.style.transform = 'scale(' + zoom + ')';
    wrapper.style.width = (100 / zoom) + '%';
    wrapper.style.margin = '0 auto';
  } else {
    wrapper.style.margin = '0 auto';
  }

  const restaurer = () => {
    classesAjoutees.forEach(cls => document.body.classList.remove(cls));
    document.querySelectorAll('#planning-wrapper .jour-block').forEach(b => b.style.display = '');
    wrapper.style.transform       = ancienTransform;
    wrapper.style.transformOrigin = ancienTransformOrigin;
    wrapper.style.width           = ancienWidth;
    wrapper.style.margin          = ancienMargin;
  };

  if (!semaine) {
    window.print();
    restaurer();
    return;
  }

  const [a, mo] = mois.split('-').map(Number);
  let lun = new Date(a, mo - 1, 1);
  while (lun.getDay() !== 1) lun.setDate(lun.getDate() + 1);
  lun.setDate(lun.getDate() + (parseInt(semaine) - 1) * 7);
  const sam = new Date(lun);
  sam.setDate(lun.getDate() + 5);

  document.querySelectorAll('#planning-wrapper .jour-block').forEach(bloc => {
    const h3 = bloc.querySelector('h3');
    if (!h3) return;
    const match = h3.textContent.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (match) {
      const dateJour = new Date(match[3], match[2] - 1, match[1]);
      bloc.style.display = (dateJour >= lun && dateJour <= sam) ? '' : 'none';
    }
  });

  window.print();
  restaurer();
}

/* ════════════════════════════════════════════════
   TOOLTIP INFO CHANTIER (au survol d'un nom)
   ════════════════════════════════════════════════ */
let _tooltipEl = null;
let _tooltipTimer = null;

function getTooltipEl() {
  if (!_tooltipEl) {
    _tooltipEl = document.createElement('div');
    _tooltipEl.className = 'chantier-tooltip';
    document.body.appendChild(_tooltipEl);
  }
  return _tooltipEl;
}

/** Agrège les heures pour un nom de chantier donné, toutes années confondues. */
function getStatsChantier(nomChantier) {
  if (!nomChantier) return null;
  const ref = normaliserChantier(nomChantier);
  if (!ref) return null;

  const heuresAll = JSON.parse(localStorage.getItem('heuresdata') || '{}');
  const salariesAll = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  const salById = Object.fromEntries(salariesAll.map(s => [s.id, s.prenom + ' ' + s.nom]));

  let total = 0;
  const parSalarie = new Map();   // id -> heures
  let dateMin = null, dateMax = null;

  for (const k in heuresAll) {
    const d = heuresAll[k];
    if (!d || !d.chantier || !d.heures) continue;
    if (normaliserChantier(d.chantier) !== ref) continue;
    // Clé : {id}{YYYY}_{MM}_{DD}ch{N}
    // L'id est un timestamp (13 chiffres aujourd'hui), suivi directement de l'année.
    // On le découpe en repérant l'année 4 chiffres + _MM_DD ch{N} en fin.
    const m = k.match(/^(\d+?)(\d{4})_(\d{2})_(\d{2})ch\d+$/);
    if (!m) continue;
    const idSal = m[1];
    const dateStr = `${m[2]}-${m[3]}-${m[4]}`;
    const h = parseFloat(d.heures) || 0;
    total += h;
    parSalarie.set(idSal, (parSalarie.get(idSal) || 0) + h);
    if (!dateMin || dateStr < dateMin) dateMin = dateStr;
    if (!dateMax || dateStr > dateMax) dateMax = dateStr;
  }

  const liste = [...parSalarie.entries()]
    .map(([id, h]) => ({ nom: salById[id] || ('Salarié #' + id), heures: h }))
    .sort((a, b) => b.heures - a.heures);

  return { total, liste, dateMin, dateMax };
}

/** Normalise un nom de chantier pour comparaison (casse, espaces, accents). */
function normaliserChantier(s) {
  return (s || '').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function formatHeures(h) {
  if (!h) return '0h';
  const heures = Math.floor(h);
  const min = Math.round((h - heures) * 60);
  if (min === 0) return heures + 'h';
  return heures + 'h' + String(min).padStart(2, '0');
}

function formatDateFr(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

/** Retourne la somme des heures prévues (devis) pour ce chantier
   sur l'ensemble du prévisionnel (toutes années / tous mois confondus).
   Compare les noms de chantier de manière souple (sans casse / espaces / accents). */
function getTotalDevisChantier(nom) {
  if (!nom) return 0;
  const cible = normaliserChantier(nom);
  let total = 0;
  try {
    const data = JSON.parse(localStorage.getItem('previsionnel_data') || '{}');
    // Structure : { '2026': { '0': {chantiers:[{client, hPrevues}]}, '1': {…}, … }, '2027': {…} }
    for (const annee in data) {
      const mois12 = data[annee];
      if (!mois12) continue;
      for (const m in mois12) {
        const liste = mois12[m]?.chantiers;
        if (!Array.isArray(liste)) continue;
        liste.forEach(c => {
          if (c && c.client && normaliserChantier(c.client) === cible) {
            total += parseFloat(c.hPrevues) || 0;
          }
        });
      }
    }
  } catch (_) {}
  return total;
}

function montrerTooltipChantier(input) {
  const nom = (input.value || '').trim();
  const k = (input.id || '').replace(/chantier$/, '');
  const note = noteDuChantier((nom || '').toUpperCase());

  const stats = nom ? getStatsChantier(nom) : null;
  const aStats = !!(stats && stats.total > 0);
  if (!aStats && !note) { cacherTooltip(); return; }

  const el = getTooltipEl();
  let html = '';
  if (nom) html += `<div class="ct-nom">${escapeHtml(nom)}</div>`;
  if (aStats) {
    const totalDevis = getTotalDevisChantier(nom);
    const depasse = totalDevis > 0 && stats.total > totalDevis;
    if (totalDevis > 0) {
      html += `<div class="ct-total" style="color:#fff;">Total devis : <strong>${formatHeures(totalDevis)}</strong></div>`;
    }
    const couleurPlan = depasse ? '#ef4444' : '';
    html += `<div class="ct-total">Total planifié : <strong style="color:${couleurPlan};">${formatHeures(stats.total)}</strong></div>`;
    if (stats.liste.length > 0) {
      html += '<div class="ct-label">Salariés intervenus</div>';
      stats.liste.forEach(s => {
        html += `<div class="ct-sal">
          <span class="ct-sal-nom">${escapeHtml(s.nom)}</span>
          <span class="ct-sal-h">${formatHeures(s.heures)}</span>
        </div>`;
      });
    }
    if (stats.dateMin && stats.dateMax) {
      html += `<div class="ct-periode">Du ${formatDateFr(stats.dateMin)} au ${formatDateFr(stats.dateMax)}</div>`;
    }
  }
  if (note) {
    html += `<div class="ct-note">📝 ${escapeHtml(note)}</div>`;
  }
  el.innerHTML = html;

  // Positionner près de l'input
  const r = input.getBoundingClientRect();
  el.style.visibility = 'hidden';
  el.classList.add('visible');
  const tt = el.getBoundingClientRect();
  let top  = r.bottom + 6;
  let left = r.left;
  if (top + tt.height > window.innerHeight - 10) top = r.top - tt.height - 6;
  if (left + tt.width  > window.innerWidth  - 10) left = window.innerWidth - tt.width - 10;
  if (left < 6) left = 6;
  el.style.top  = top + 'px';
  el.style.left = left + 'px';
  el.style.visibility = 'visible';
}

function cacherTooltip() {
  if (_tooltipTimer) { clearTimeout(_tooltipTimer); _tooltipTimer = null; }
  if (_tooltipEl) _tooltipEl.classList.remove('visible');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

/* Délégation d'événements sur tout le wrapper du planning. */
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.getElementById('planning-wrapper');
  if (!wrap) return;
  wrap.addEventListener('mouseover', e => {
    const t = e.target;
    if (t.tagName === 'INPUT' && t.id && t.id.endsWith('chantier')) {
      // Délai léger pour ne pas spammer
      if (_tooltipTimer) clearTimeout(_tooltipTimer);
      _tooltipTimer = setTimeout(() => montrerTooltipChantier(t), 350);
    }
  });
  wrap.addEventListener('mouseout', e => {
    const t = e.target;
    if (t.tagName === 'INPUT' && t.id && t.id.endsWith('chantier')) {
      cacherTooltip();
    }
  });
  // Cacher aussi à la frappe ou au focus pour ne pas gêner la saisie
  wrap.addEventListener('input', e => {
    if (e.target.tagName === 'INPUT') cacherTooltip();
  });
  wrap.addEventListener('focusin', e => {
    if (e.target.tagName === 'INPUT' && e.target.id && e.target.id.endsWith('chantier')) {
      cacherTooltip();
    }
  });
});
