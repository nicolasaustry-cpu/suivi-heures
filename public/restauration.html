<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restauration d'un client — Suiv'Heures</title>
<style>
  :root { --vert:#1f8a5b; --vert-f:#166b46; --gris:#5b6570; --bord:#e2e6ea; --rouge:#c0392b; --jaune:#fff8e1; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f4f6f8; color:#1f2933; }
  .wrap { max-width:840px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--gris); margin:0 0 22px; font-size:14px; }
  .carte { background:#fff; border:1px solid var(--bord); border-radius:10px; padding:18px; margin-bottom:16px; }
  label { display:block; font-weight:600; font-size:14px; margin:10px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--bord); border-radius:8px; font-size:15px; }
  button { cursor:pointer; border:0; border-radius:8px; padding:11px 16px; font-size:15px; font-weight:600; }
  .btn-p { background:var(--vert); color:#fff; }
  .btn-p:hover { background:var(--vert-f); }
  .btn-r { background:var(--rouge); color:#fff; }
  .btn-r:hover { filter:brightness(.92); }
  .msg { padding:10px 12px; border-radius:8px; font-size:14px; margin-top:12px; display:none; }
  .msg.err { background:#fdecea; color:var(--rouge); display:block; }
  .msg.ok { background:#e8f6ef; color:var(--vert-f); display:block; }
  .snap { border:1px solid var(--bord); border-radius:10px; padding:14px; margin-bottom:12px; }
  .snap.live { background:var(--jaune); border-color:#f0d98a; }
  .snap h3 { margin:0 0 6px; font-size:15px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:#eef1f4; color:var(--gris); margin-left:6px; }
  .kv { font-size:13px; color:#374151; margin:3px 0; }
  .kv b { color:#111; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { font-size:12px; background:#eef1f4; border-radius:6px; padding:2px 7px; color:#374151; }
  .hint { font-size:12.5px; color:var(--gris); margin-top:4px; }
  .spin { color:var(--gris); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
    <h1 style="margin:0">Restauration d'un client</h1>
    <a href="admin.html" style="background:var(--vert);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap">← Retour à l'admin</a>
  </div>
  <p class="sub">Outil interne — réservé à l'administrateur. Restaure les données d'un client depuis les sauvegardes de nuit, avec sauvegarde de sécurité de l'état actuel avant écriture.</p>

  <div class="carte">
    <label for="mdp">Mot de passe administrateur</label>
    <input id="mdp" type="password" autocomplete="off" placeholder="Ton mot de passe admin">
    <label for="cid">Code client à restaurer</label>
    <input id="cid" type="text" value="2CPEBAT26" placeholder="ex. 2CPEBAT26">
    <div style="margin-top:14px"><button class="btn-p" id="btnListe">Voir les sauvegardes</button></div>
    <div id="msg" class="msg"></div>
  </div>

  <div id="resultats"></div>

  <div style="margin-top:26px;text-align:center">
    <a href="admin.html" style="display:inline-block;background:#fff;border:1px solid var(--bord);color:#374151;text-decoration:none;padding:11px 20px;border-radius:8px;font-size:15px;font-weight:600">← Retour à l'écran admin</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function afficheMsg(txt, type){ const m=$("msg"); m.textContent=txt; m.className="msg "+(type||""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtDate(d){ if(!d) return "—"; try{ return new Date(d).toLocaleString("fr-FR"); }catch(_){ return String(d);} }

const TYPES = [
  { key:'heures',               champs:['heures'] },
  { key:'salaries',             champs:['salaries'] },
  { key:'chantiers',            champs:['chantiers'] },
  { key:'previsionnel',         champs:['previsionnel'] },
  { key:'notesChantiers',       champs:['notesChantiers','notesChantiersPhotos'] },
  { key:'coordonneesChantiers', champs:['coordonneesChantiers'] },
];
const TYPE_LIBELLES = {
  heures:'Heures / planning', salaries:'Salariés', chantiers:'Liste des chantiers',
  previsionnel:'Prévisionnel', notesChantiers:'Notes de chantier', coordonneesChantiers:'Coordonnées de chantier'
};

function chipsHTML(list){
  if(!list || !list.length) return '<span class="chip">aucun</span>';
  return list.map(c=>`<span class="chip" style="background:#fef3c7;color:#92400e">${esc(c)}</span>`).join('');
}
function enteteHTML(titre, tag, a){
  return `<h3>${esc(titre)} ${tag||''}</h3>
    <div class="kv"><b>Entreprise :</b> ${esc(a.entrepriseNom)||'(sans nom)'} &nbsp; <b>Code employé :</b> ${esc(a.codeEmploye)||'—'}</div>`;
}
function ligneTypeHTML(key, t, tLive, opts){
  opts = opts || {};
  let badge = '';
  if (tLive) {
    badge = (t.sig === tLive.sig)
      ? '<span class="chip" style="background:#eef1f4;color:#6b7280">identique à l\'actuel</span>'
      : '<span class="chip" style="background:#e8f6ef;color:#166b46;font-weight:700">≠ différent</span>';
  }
  const chk = opts.checkbox
    ? `<input type="checkbox" class="typechk" data-snap="${opts.snap}" data-type="${key}" checked style="width:18px;height:18px;flex:0 0 auto;margin-top:3px;cursor:pointer;">`
    : '';
  return `<div style="display:flex;gap:8px;padding:8px 0;border-top:1px solid #eef1f4;">
    ${chk}
    <div style="flex:1;min-width:0;">
      <div class="kv" style="margin:0"><b>${esc(t.libelle)}</b> — ${t.n} élément(s) &nbsp; ${badge}</div>
      <div class="chips">${chipsHTML(t.apercu)}</div>
    </div>
  </div>`;
}
function typesHTML(a, live, opts){
  return TYPES.map(def=>{
    const t = a.types && a.types[def.key];
    if (!t) return '';
    const tLive = (live && live.types) ? live.types[def.key] : null;
    return ligneTypeHTML(def.key, t, tLive, opts);
  }).join('');
}

async function chargerListe(){
  const motDePasse=$("mdp").value, clientId=$("cid").value.trim();
  if(!motDePasse){ afficheMsg("Saisis le mot de passe administrateur.","err"); return; }
  if(!clientId){ afficheMsg("Saisis le code client.","err"); return; }
  afficheMsg("Recherche des sauvegardes…","");
  $("resultats").innerHTML='<p class="spin">Chargement…</p>';
  try{
    const r=await fetch("/api/restauration/liste",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({motDePasse,clientId})});
    const d=await r.json();
    if(!d.ok){ afficheMsg(d.message||"Erreur.","err"); $("resultats").innerHTML=""; return; }
    afficheMsg(`${d.nbSauvegardes} sauvegarde(s) trouvée(s) pour ${esc(d.clientId)}.`,"ok");
    const live = d.live || null;
    let html="";
    if(live){
      html += `<div class="snap live">${enteteHTML("État ACTUEL (en ligne aujourd'hui)", '<span class="tag">live</span>', live)}
        ${typesHTML(live, null, {checkbox:false})}
        <div class="hint">C'est l'état à corriger. Pour chaque type, « ≠ différent » sur une sauvegarde = contenu différent de l'actuel (candidat au bon contenu).</div></div>`;
    }
    if(!d.sauvegardes.length){
      html += `<div class="carte">Aucune sauvegarde de nuit trouvée pour ce client. Il faudra passer par un snapshot Atlas.</div>`;
    }
    d.sauvegardes.forEach((s,i)=>{
      const tag = s.motif==="avant-restauration" ? '<span class="tag">sécurité</span>' : `<span class="tag">${esc(s.snapshotDate)}</span>`;
      html += `<div class="snap">
        ${enteteHTML("Sauvegarde du "+fmtDate(s.backupAt), tag, s.apercu)}
        <div class="hint" style="margin:6px 0"><b>Coche les données à restaurer depuis cette date :</b></div>
        ${typesHTML(s.apercu, live, {checkbox:true, snap:i})}
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button class="btn-r" data-at="${esc(s.backupAt)}" data-date="${esc(s.snapshotDate)}" data-snap="${i}">Restaurer les éléments cochés</button>
          <button class="lien-coche" data-snap="${i}" data-on="1" style="background:none;border:0;color:#2563eb;cursor:pointer;font-size:13px;text-decoration:underline">tout cocher</button>
          <button class="lien-coche" data-snap="${i}" data-on="0" style="background:none;border:0;color:#2563eb;cursor:pointer;font-size:13px;text-decoration:underline">tout décocher</button>
        </div>
      </div>`;
    });
    $("resultats").innerHTML=html;
    document.querySelectorAll(".btn-r").forEach(b=>b.addEventListener("click",()=>restaurerCoches(b.dataset.snap,b.dataset.at,b.dataset.date)));
    document.querySelectorAll(".lien-coche").forEach(b=>b.addEventListener("click",()=>{
      document.querySelectorAll('.typechk[data-snap="'+b.dataset.snap+'"]').forEach(c=>c.checked=(b.dataset.on==="1"));
    }));
  }catch(e){ afficheMsg("Erreur réseau : "+e.message,"err"); $("resultats").innerHTML=""; }
}

function champsPourType(key){
  const def = TYPES.find(t=>t.key===key);
  return def ? def.champs : [key];
}
function restaurerCoches(snap, backupAt, snapshotDate){
  const coches = [...document.querySelectorAll('.typechk[data-snap="'+snap+'"]')].filter(c=>c.checked);
  if(!coches.length){ afficheMsg("Coche au moins un type de donnée à restaurer.","err"); return; }
  const libelles = coches.map(c=>TYPE_LIBELLES[c.dataset.type]||c.dataset.type);
  let champs=[];
  coches.forEach(c=>{ champs = champs.concat(champsPourType(c.dataset.type)); });
  restaurer(backupAt, snapshotDate, champs, libelles);
}
async function restaurer(backupAt,snapshotDate,champs,libelles){
  const motDePasse=$("mdp").value, clientId=$("cid").value.trim();
  const quoi = (libelles && libelles.length) ? libelles.join(", ") : "toutes les données";
  if(!confirm(`Restaurer pour ${clientId}, depuis la sauvegarde du ${snapshotDate} :\n\n• ${quoi}\n\nL'état actuel sera d'abord sauvegardé (sécurité). Les autres données ne seront pas touchées.`)) return;
  afficheMsg("Restauration en cours…","");
  try{
    const body={motDePasse,clientId,backupAt};
    if(champs) body.champs=champs;
    const r=await fetch("/api/restauration/restaurer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.ok){ afficheMsg(d.message||"Erreur.","err"); return; }
    const champsTxt=(d.champsRestaures||[]).join(", ");
    afficheMsg(`✅ Restauration réussie pour ${esc(d.clientId)} (sauvegarde du ${esc(d.restaureDepuis.snapshotDate)}). Champs restaurés : ${esc(champsTxt)}. ${esc(d.securite)} — vérifie l'état ci-dessous.`,"ok");
    chargerListe();
  }catch(e){ afficheMsg("Erreur réseau : "+e.message,"err"); }
}

$("btnListe").addEventListener("click",chargerListe);
</script>
</body>
</html>
