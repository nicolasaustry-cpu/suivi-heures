<script>
let _vue = 'mois';
let _ecartMois = 0;

/* ── Impression sur UNE seule page (toute imprimante / PDF) ──
   Avant impression, on mesure le document à la largeur d'une page A4 (gabarit hors écran)
   et on applique une échelle pour qu'il tienne exactement sur une page. */
function _bevPxParMm() {
  const p = document.createElement('div');
  p.style.cssText = 'position:absolute;left:-9999px;top:0;width:100mm;height:0;visibility:hidden;';
  document.body.appendChild(p);
  const v = p.getBoundingClientRect().width / 100;
  p.remove();
  return v || 3.7795;
}
function ajusterEchelleBEV() {
  const doc = document.getElementById('bev-doc');
  if (!doc) return;
  doc.style.removeProperty('--bev-scale');
  const ppmm = _bevPxParMm();
  const Wmm = 200, Hmm = 282;            // zone utile A4 portrait (marges 5mm, sécurité incluse)
  const clone = doc.cloneNode(true);
  clone.classList.add('bev-mesure');
  clone.style.cssText = 'position:absolute;left:-99999px;top:0;zoom:1;';
  document.body.appendChild(clone);
  const hMm = clone.scrollHeight / ppmm;
  const wMm = clone.scrollWidth  / ppmm;
  clone.remove();
  let scale = Math.min(1, Hmm / (hMm || 1), Wmm / (wMm || 1));
  if (!isFinite(scale) || scale <= 0) scale = 1;
  if (scale < 1) scale = Math.max(0.3, scale * 0.98); // petite marge : jamais de 2e page
  doc.style.setProperty('--bev-scale', String(scale));
}
function imprimerBEV() { ajusterEchelleBEV(); window.print(); }
window.addEventListener('beforeprint', ajusterEchelleBEV);
let _prevuMois = 0;
let _compteMois = 0;
const EVENEMENTS = ['', 'Congé', 'Maladie', 'RTT', 'Récupération', 'Congé sans solde', 'Formation', 'Intempéries', 'Autre'];
function optionsEvt(sel) { return EVENEMENTS.map(function(e){ return '<option value="' + e + '"' + (e === sel ? ' selected' : '') + '>' + (e || '—') + '</option>'; }).join(''); }

/* ── Indemnités de petits déplacements ── */
const TRANCHES_IND = [
  ['',''],['IA','IA 0 à 5 km'],['IB','IB 5 à 10 km'],['II','II 10 à 20 km'],
  ['III','III 20 à 30 km'],['IV','IV 30 à 40 km'],['V','V 40 à 50 km'],
  ['VI','VI 50 à 65 km'],['VII','VII 65 à 80 km']
];
let _indemnites = {};   // { trajet, transport, repas }
let _tranches   = {};   // { 'YYYY-MM-DD': 'IA'|... }
function optionsTranche(sel) {
  return TRANCHES_IND.map(function(t){ return '<option value="' + t[0] + '"' + (t[0] === sel ? ' selected' : '') + '>' + (t[1] || '—') + '</option>'; }).join('');
}
function onIndemniteChange() {
  _indemnites = {
    trajet:    !!document.querySelector('.ind-chk[value="trajet"]').checked,
    transport: !!document.querySelector('.ind-chk[value="transport"]').checked,
    repas:     !!document.querySelector('.ind-chk[value="repas"]').checked
  };
  appliquerIndemnites();
}
function appliquerIndemnites() {
  const zone = document.getElementById('zone');
  const actif = !!(_indemnites.trajet || _indemnites.transport || _indemnites.repas);
  if (zone) zone.classList.toggle('ind-on', actif);
  rendreRecapIndemnites();
}
function rendreRecapIndemnites() {
  const wrap = document.getElementById('recap-indemnites');
  if (!wrap) return;
  const items = [['trajet','Trajet'],['transport','Transport'],['repas','Repas']].filter(function(it){ return _indemnites[it[0]]; });
  if (!items.length) { wrap.innerHTML = ''; return; }
  const codes = ['IA','IB','II','III','IV','V','VI','VII'];
  const cnt = {}; codes.forEach(function(c){ cnt[c] = 0; });
  document.querySelectorAll('#corps .tranche-sel').forEach(function(sel){ if (cnt[sel.value] !== undefined) cnt[sel.value]++; });
  const tot = codes.reduce(function(a,c){ return a + cnt[c]; }, 0);
  let html = '<table class="bev-recap"><thead><tr><th>Indemnité</th>' + codes.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '<th>Total</th></tr></thead><tbody>';
  items.forEach(function(it){
    html += '<tr><td>' + it[1] + '</td>' + codes.map(function(c){ return '<td>' + (cnt[c] || '') + '</td>'; }).join('') + '<td>' + (tot || '') + '</td></tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
function rendreRecapEvenements() {
  const wrap = document.getElementById('recap-evenements');
  if (!wrap) return;
  const evts = EVENEMENTS.filter(function(e){ return e; });   // sans la valeur vide
  const cnt = {}; evts.forEach(function(e){ cnt[e] = 0; });
  document.querySelectorAll('#corps .evt-cell').forEach(function(td){
    const m = (td.textContent || '').trim();
    if (cnt[m] !== undefined) cnt[m]++;
  });
  const tot = evts.reduce(function(a,e){ return a + cnt[e]; }, 0);
  if (!tot) { wrap.innerHTML = ''; return; }   // aucun événement ce mois → tableau masqué
  let html = '<table class="bev-recap"><thead><tr><th>Événement</th>' + evts.map(function(e){ return '<th>' + e + '</th>'; }).join('') + '<th>Total</th></tr></thead><tbody>';
  html += '<tr><td>Nombre de jours</td>' + evts.map(function(e){ return '<td>' + (cnt[e] || '') + '</td>'; }).join('') + '<td>' + tot + '</td></tr>';
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
let _salaries = [];
const MOIS_NOMS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function moisLabel(ym) { const p = ym.split('-'); return MOIS_NOMS[parseInt(p[1])-1] + '-' + p[0]; }
function nomEntreprise() { try { return (JSON.parse(localStorage.getItem('entreprisedata')||'{}').nom) || ''; } catch(e){ return ''; } }
const AUJOURDHUI = cle(new Date());

/* ── Helpers calendrier / alternance (repris du planning) ── */
function lundiDeLaSemaine(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const j = x.getDay();
  const decal = (j === 0) ? -6 : (1 - j);
  x.setDate(x.getDate() + decal);
  x.setHours(0,0,0,0);
  return x;
}
function nbSemainesEntre(lundiRef, lundiCible) {
  const ms = lundiCible - lundiRef;
  return Math.round(ms / (7 * 24 * 3600 * 1000));
}
function semaineAB(s, d) {
  const bascules = Array.isArray(s.bascules) ? s.bascules.slice() : [];
  if (!bascules.length) return 'A';
  bascules.sort((a, b) => a.date.localeCompare(b.date));
  const lundiCible = lundiDeLaSemaine(d);
  let active = null;
  for (const b of bascules) {
    const lb = lundiDeLaSemaine(new Date(b.date + 'T00:00:00'));
    if (lb <= lundiCible) active = { lundi: lb, semaine: b.semaine };
  }
  if (!active) {
    const first = bascules[0];
    const lb = lundiDeLaSemaine(new Date(first.date + 'T00:00:00'));
    const n = nbSemainesEntre(lundiCible, lb);
    return (n % 2 === 0) ? first.semaine : (first.semaine === 'A' ? 'B' : 'A');
  }
  const n = nbSemainesEntre(active.lundi, lundiCible);
  return (n % 2 === 0) ? active.semaine : (active.semaine === 'A' ? 'B' : 'A');
}
function grilleHeuresPourDate(s, d) {
  if (s && s.alternance) {
    const sem = semaineAB(s, d);
    return (sem === 'B' ? s.heuresParJourB : s.heuresParJourA) || {};
  }
  return s.heuresParJour || {};
}

/* ── Utilitaires ── */
const JOURS_KEYS = ['', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];   // getDay() 1..6
function r2(x) { return Math.round(x * 100) / 100; }
function fmt(x) { return r2(x).toFixed(2); }
function cle(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function labelJour(d) {
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function classeEcart(x) { return x > 0 ? 'pos' : (x < 0 ? 'neg' : 'nul'); }
function signe(x) { x = r2(x); return x > 0 ? '+' + fmt(x) : fmt(x); }
function getToken() { return (typeof SYNC !== 'undefined' && SYNC.getToken) ? SYNC.getToken() : null; }
function dansContrat(sal, d) {
  if (sal.dateEntree && cle(d) < sal.dateEntree) return false;
  if (sal.dateSortie && cle(d) > sal.dateSortie) return false;
  return true;
}

/* Réalisé (heures décimales) par date pour un salarié, à partir des saisies d'un mois. */
function realiseParJour(saisies, salarieId) {
  const map = {};
  (saisies || []).forEach(s => {
    if (String(s.salarieId) !== String(salarieId)) return;
    let min = 0;
    (s.chantiers || []).forEach(c => { min += (c.dureeMin || 0) + (c.deplacement || 0); });
    map[s.date] = (map[s.date] || 0) + min / 60;
  });
  return map;
}

/* Licence : Plus = réalisé (saisies) ; Standard = planifié (Planning). */
function estPlus() {
  if (typeof SYNC !== 'undefined' && SYNC.estPlus) return SYNC.estPlus();
  return localStorage.getItem('syncType') === 'plus';
}
function labelColReel() { return estPlus() ? 'Réalisé' : 'Planifié'; }

/* Planifié = cumul journalier des heures chantier saisies dans le Planning
   (clés heuresdata : <salarieId><AAAA_MM_JJ>ch1..ch5). */
function planifieParJour(salarieId, ym) {
  let heures = {};
  try { heures = JSON.parse(localStorage.getItem('heuresdata') || '{}'); } catch (e) {}
  const [an, mo] = ym.split('-').map(Number);
  const nb = new Date(an, mo, 0).getDate();
  const map = {};
  for (let j = 1; j <= nb; j++) {
    const k    = cle(new Date(an, mo - 1, j));
    const safe = k.replace(/-/g, '_');
    let t = 0;
    for (let i = 1; i <= 5; i++) {
      t += parseFloat(heures[salarieId + safe + 'ch' + i] && heures[salarieId + safe + 'ch' + i].heures || 0) || 0;
    }
    if (t) map[k] = t;
  }
  return map;
}

/* Construit les lignes jour par jour d'un mois (ym = "YYYY-MM").
   Nouveau modèle BEV :
   - contrat      = heures de contrat du jour
   - tempsEvt     = heures d'événement = absence posée au Planning ce jour
   - base         = Contrat - Temps Évt (Nouvelle Base)
   - planifie     = heures chantier planifiées (Planning)
   - realise      = heures réellement pointées (saisies)
   - ecartRB      = Réalisé - Nouvelle Base
   - ecartRetenu  = modifiable, défaut = ecartRB
   - tempsCompte  = Nouvelle Base + Écart retenu  (= Réalisé par défaut) */
/* Jours fériés français + jours d'école (neutralisés dans le contrat) */
var _bevCacheF = {};
function _bevPaques(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),jo=((h+l-7*mm+114)%31)+1;return new Date(y,mo-1,jo);}
function _bevFeries(y){
  if(_bevCacheF[y])return _bevCacheF[y];
  var f={},pad=function(n){return String(n).padStart(2,'0');},isod=function(dd){return dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());};
  [[0,1],[4,1],[4,8],[6,14],[7,15],[10,1],[10,11],[11,25]].forEach(function(x){f[isod(new Date(y,x[0],x[1]))]=1;});
  var p=_bevPaques(y);
  [1,39,50].forEach(function(n){var dd=new Date(p);dd.setDate(p.getDate()+n);f[isod(dd)]=1;});
  _bevCacheF[y]=f;return f;
}
function estFerieBev(dateStr){var y=parseInt(dateStr.slice(0,4),10);return !!_bevFeries(y)[dateStr];}
function estJourEcoleBev(sal,dateStr){return !!(sal&&sal.apprenti&&Array.isArray(sal.joursEcole)&&sal.joursEcole.indexOf(dateStr)!==-1);}

function lignesDuMois(sal, ym, saisies, retenues) {
  const [an, mo] = ym.split('-').map(Number);
  const planifMap = planifieParJour(sal.id, ym);
  const realMap   = realiseParJour(saisies, sal.id);
  let _hAbs = {};
  try { _hAbs = JSON.parse(localStorage.getItem('heuresdata') || '{}'); } catch (e) {}
  const nbJours = new Date(an, mo, 0).getDate();
  const lignes = [];
  for (let j = 1; j <= nbJours; j++) {
    const d = new Date(an, mo - 1, j);
    const k = cle(d);
    const key = JOURS_KEYS[d.getDay()];
    let contrat = 0;
    if (key && dansContrat(sal, d) && !estFerieBev(k) && !estJourEcoleBev(sal, k)) {
      const grille = grilleHeuresPourDate(sal, d);
      contrat = Number(grille[key]) || 0;
    }
    const safe = k.replace(/-/g, '_');
    const _abs = _hAbs[sal.id + safe + 'abs'];
    const tempsEvt = parseFloat(_abs && _abs.heures || 0) || 0;
    const motif    = (_abs && _abs.motif) || '';   // événement = motif d'absence saisi au Planning
    const base     = Math.max(0, r2(contrat - tempsEvt));
    const planifie = r2(planifMap[k] || 0);
    const realise  = r2(realMap[k] || 0);
    const ecartRB  = r2(realise - base);
    const ecartRetenu = (retenues && retenues[k] != null) ? r2(Number(retenues[k])) : ecartRB;   // valeur sauvegardée sinon reporté de l'Écart Réalisé/Base
    const tempsCompte = r2(base + ecartRetenu);   // Temps pris en compte = Nouvelle Base + Écart retenu
    lignes.push({
      date: k, label: labelJour(d), we: (d.getDay() === 0 || d.getDay() === 6),
      passe: (k < AUJOURDHUI),
      contrat: r2(contrat), tempsEvt: r2(tempsEvt), base: base, motif: motif,
      planifie: planifie, realise: realise, ecartRB: ecartRB,
      ecartRetenu: ecartRetenu, tempsCompte: tempsCompte
    });
  }
  // Client « planning seul » : si aucun réalisé sur le mois, l'écart se calcule
  // sur le Planifié (Planifié − Base) au lieu du Réalisé, et la colonne Réalisé sera masquée.
  const totalRealise = r2(lignes.reduce(function (s, l) { return s + (l.realise || 0); }, 0));
  const modePlanifie = totalRealise === 0;
  if (modePlanifie) {
    lignes.forEach(function (l) {
      l.ecartRB = r2(l.planifie - l.base);
      l.ecartRetenu = (retenues && retenues[l.date] != null) ? r2(Number(retenues[l.date])) : l.ecartRB;
      l.tempsCompte = r2(l.base + l.ecartRetenu);
    });
  }
  lignes.modePlanifie = modePlanifie;
  return lignes;
}

        '<td><input type="number" step="0.25" class="ret no-print-border" data-date="' + l.date + '" data-base="' + l.base + '" data-realise="' + (mp ? l.planifie : l.realise) + '" data-passe="1" value="' + fmt(l.ecartRetenu) + '" onfocus="this.select()" onmouseup="return false"><span class="ret-print" style="display:none;">' + fmt(l.ecartRetenu) + '</span></td>' +
        '<td class="tcompte">' + fmt(l.tempsCompte) + '</td>';
    } else {

      '<td>' + fmt(l.contrat) + '</td>' +
      '<td class="evt-cell">' + (l.motif || '') + '</td>' +
      '<td>' + fmt(l.tempsEvt) + '</td>' +
      '<td><b class="base">' + fmt(l.base) + '</b></td>' +
      '<td>' + fmt(l.planifie) + '</td>' +

      '<td class="col-tranche"><select class="tranche-sel" data-date="' + l.date + '">' + optionsTranche(_tranches[l.date] || '') + '</select><span class="tranche-print">' + (_tranches[l.date] || '') + '</span></td>' +
    '</tr>';
  });
  _prevuMois  = tbasePasse;   // base des jours passés (pour l'encart Heures payées)

    '</tr></thead><tbody id="corps">' + corps + '</tbody>' +
    '<tfoot><tr><td>Totaux</td>' +
      '<td>' + fmt(tcontrat) + '</td><td></td><td>' + fmt(ttevt) + '</td>' +
      '<td><b class="base">' + fmt(tbasePasse) + '</b></td>' +
      '<td>' + fmt(tplan) + '</td>' +
      '<td>' + fmt(treal) + '</td>' +

    '<tbody><tr><td id="enc-paye"></td><td><input type="number" step="0.25" id="enc-reporte" value="' + fmt(reporte) + '" onfocus="this.select()" onmouseup="return false"></td><td id="enc-payees"></td></tr></tbody></table>' +
    '</div>' +
    '<div class="signatures"><div class="sig-box"><div class="lbl">Pour l\'entreprise</div><div class="sub">Date et signature</div></div>' +

    '</div>';

  document.getElementById('corps').addEventListener('input', recalcMois);
  document.getElementById('corps').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('ret')) {
      e.preventDefault();
      const inputs = Array.prototype.slice.call(document.querySelectorAll('#corps .ret'));
      const i = inputs.indexOf(e.target);
      if (i > -1 && i + 1 < inputs.length) { const next = inputs[i + 1]; next.focus(); next.select(); }
      else { e.target.blur(); }
    }
  });
  document.getElementById('enc-reporte').addEventListener('input', majEncart);
  document.querySelector('.ind-chk[value="trajet"]').checked    = !!_indemnites.trajet;
  document.querySelector('.ind-chk[value="transport"]').checked = !!_indemnites.transport;
  document.querySelector('.ind-chk[value="repas"]').checked     = !!_indemnites.repas;
  document.getElementById('corps').addEventListener('change', function(e){
    if (e.target.classList && e.target.classList.contains('tranche-sel')) {
      const sp = e.target.parentNode.querySelector('.tranche-print');
      if (sp) sp.textContent = e.target.value || '';
      rendreRecapIndemnites();
    }
  });
  appliquerIndemnites();
  rendreRecapEvenements();
  majEncart();
}

function recalcMois() {
  const rows = document.querySelectorAll('#corps tr');
  let tret = 0, tbase = 0, tcompte = 0;
  rows.forEach(row => {
    const inp = row.querySelector('.ret');
    if (!inp) return;
    const base    = parseFloat(inp.dataset.base) || 0;
    const realise = parseFloat(inp.dataset.realise) || 0;
    const er      = parseFloat(inp.value) || 0;       // Écart retenu (modifiable)
    const tc      = r2(base + er);                    // Temps pris en compte = Nouvelle Base + Écart retenu
    const cellTC = row.querySelector('.tcompte');
    if (cellTC) cellTC.textContent = fmt(tc);
    const sp = row.querySelector('.ret-print'); if (sp) sp.textContent = fmt(er);
    if (inp.dataset.passe === '1') { tret += er; tbase += base; tcompte += tc; }
  });
  const tRet  = document.getElementById('t-retenu'); if (tRet)  tRet.textContent  = signe(tret);
  const tComp = document.getElementById('t-compte'); if (tComp) tComp.textContent = fmt(tcompte);
  _ecartMois  = tret;
  _prevuMois  = tbase;
  _compteMois = tcompte;
  majEncart();
}

function majEncart() {
  const el = document.getElementById('enc-reporte');
  if (!el) return;
  const rep  = parseFloat(el.value) || 0;
  const paye = r2(_ecartMois - rep);                          // écart d'heures payés = Écart retenu - reporté
  const p = document.getElementById('enc-paye');
  if (p) { p.textContent = signe(paye); p.className = classeEcart(paye); }
  const tpay = document.getElementById('enc-payees');
  if (tpay) tpay.textContent = fmt(r2(_compteMois - rep));    // heures payées = Temps pris en compte - reporté
}

async function enregistrer() {
  if (_vue !== 'mois') return;
  const sal = _salaries.find(s => String(s.id) === document.getElementById('sel-salarie').value);
  const ym  = document.getElementById('sel-mois').value;
  const token = getToken();
  if (!sal || !ym || !token) return;
  const retenues = {};
  document.querySelectorAll('#corps .ret').forEach(inp => {
    const v       = parseFloat(inp.value) || 0;
    const base    = parseFloat(inp.dataset.base) || 0;
    const realise = parseFloat(inp.dataset.realise) || 0;
    const defaut  = Math.round((realise - base) * 100) / 100;   // Écart Réalisé/Base (valeur reportée par défaut)
    if (Math.abs(v - defaut) > 0.001) retenues[inp.dataset.date] = v;   // on ne persiste que les ajustements manuels
  });
  const valide = document.getElementById('chk-valide').checked;
  const evenements = {};
  document.querySelectorAll('#corps .evt').forEach(sel => { if (sel.value) evenements[sel.dataset.date] = sel.value; });
  const repEl = document.getElementById('enc-reporte');
  const reporte = repEl ? (parseFloat(repEl.value) || 0) : 0;
  const indemnites = {
    trajet:    !!document.querySelector('.ind-chk[value="trajet"]').checked,
    transport: !!document.querySelector('.ind-chk[value="transport"]').checked,
    repas:     !!document.querySelector('.ind-chk[value="repas"]').checked
  };
  const tranches = {};
  document.querySelectorAll('#corps .tranche-sel').forEach(function(sel){ if (sel.value) tranches[sel.dataset.date] = sel.value; });
  const btn = document.getElementById('btn-save');
  const ancien = btn.innerHTML; btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const r = await fetch('/api/bev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ salarieId: sal.id, mois: ym, retenues, valide, reporte, evenements, indemnites, tranches })
    });
    const d = await r.json();
    btn.innerHTML = d.ok ? '<i class="ti ti-check"></i> Enregistré' : '⚠ Échec';
  } catch (e) { btn.innerHTML = '⚠ Erreur'; }
  setTimeout(() => { btn.innerHTML = ancien; btn.disabled = false; }, 1800);
}

/* Réinitialiser la colonne Écart retenu : chaque jour reprend l'Écart Réalisé/Base, puis on persiste (efface les ajustements) */
function reinitEcartRetenu() {
  if (_vue !== 'mois') return;
  if (!confirm("Réinitialiser la colonne « Écart retenu » ?\nChaque jour reprendra la valeur de l'Écart Réalisé/Base ; les ajustements manuels seront effacés.")) return;
  document.querySelectorAll('#corps .ret').forEach(inp => {
    const base    = parseFloat(inp.dataset.base) || 0;
    const realise = parseFloat(inp.dataset.realise) || 0;
    inp.value = fmt(realise - base);   // report de l'Écart Réalisé/Base
  });
  recalcMois();    // met à jour Temps pris en compte, totaux et encart
  enregistrer();   // persiste : plus aucun ajustement enregistré → report redevenu définitif
}

/* ── Vue annuelle ── */
async function chargerAnnee() {
  const sal = _salaries.find(s => String(s.id) === document.getElementById('sel-salarie').value);
  const an  = parseInt(document.getElementById('sel-annee').value);
  const token = getToken();
  const zone = document.getElementById('zone');
  if (!sal || !an || !token) { zone.innerHTML = '<div class="bev-vide">Sélectionnez un salarié et une année.</div>'; return; }

  document.getElementById('titre-doc').innerHTML =
    '<div class="td-ent">' + nomEntreprise() + '</div>' +
    '<div class="td-bord">Bordereau d\'Eléments Variables — Année ' + an + '</div>' +
    '<div class="td-sal">' + sal.prenom + ' ' + sal.nom + '</div>';
  zone.innerHTML = '<div class="bev-vide">Calcul en cours…</div>';

  const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const reqs = [];
  for (let m = 1; m <= 12; m++) {
    const ym = an + '-' + String(m).padStart(2, '0');
    reqs.push(Promise.all([
      fetch('/api/saisies/' + ym, { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json()).catch(() => ({})),
      fetch('/api/bev/' + ym + '/' + sal.id, { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json()).catch(() => ({}))
    ]));
  }
  const res = await Promise.all(reqs);

  let corps = '', TC=0, TTE=0, TBASE=0, TPLAN=0, TREAL=0, TCOMPTE=0, TREPORTE=0, TRTTRECUP=0;
  const evtsAnnee = EVENEMENTS.filter(function(e){ return e; });   // motifs possibles (sans la valeur vide)
  const TEVT = {}; evtsAnnee.forEach(function(e){ TEVT[e] = 0; });
  let corpsEvt = '';
  res.forEach((paire, idx) => {
    const ym = an + '-' + String(idx+1).padStart(2, '0');
    const saisies  = (paire[0] && paire[0].ok) ? (paire[0].saisies || []) : [];
    const retenues = (paire[1] && paire[1].ok) ? (paire[1].retenues || {}) : {};
    const reporte  = (paire[1] && paire[1].ok) ? (Number(paire[1].reporte) || 0) : 0;
    const lignes = lignesDuMois(sal, ym, saisies, retenues);
    let cContrat=0, cTevt=0, cBase=0, cPlan=0, cReal=0, cCompte=0, cRttRecup=0, moisPasse=false;
    const cntEvt = {}; evtsAnnee.forEach(function(e){ cntEvt[e] = 0; });
    lignes.forEach(l => {
      cContrat += l.contrat; cTevt += l.tempsEvt; cPlan += l.planifie;
      if (l.passe) { cReal += l.realise; cCompte += l.tempsCompte; cBase += l.base; moisPasse = true; }
      if (l.motif === 'RTT' || l.motif === 'Récupération') cRttRecup += l.tempsEvt;
      if (cntEvt[l.motif] !== undefined) cntEvt[l.motif]++;
    });
    const totEvtMois = evtsAnnee.reduce(function(a,e){ return a + cntEvt[e]; }, 0);
    evtsAnnee.forEach(function(e){ TEVT[e] += cntEvt[e]; });
    // Mois entièrement à venir et sans contrat : ligne vide
    if (cContrat === 0 && !moisPasse) {
      corps += '<tr class="futur"><td>' + moisNoms[idx] + '</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
      corpsEvt += '<tr class="futur"><td>' + moisNoms[idx] + '</td>' + evtsAnnee.map(function(){ return '<td></td>'; }).join('') + '<td></td></tr>';
      return;
    }
    const blanc = !moisPasse;                       // mois pas encore commencé : pas de réalisé
    const payees = moisPasse ? r2(cCompte - reporte) : 0;
    TC += cContrat; TTE += cTevt; TBASE += cBase; TPLAN += cPlan; TRTTRECUP += cRttRecup;
    if (moisPasse) { TREAL += cReal; TCOMPTE += cCompte; TREPORTE += reporte; }
    corps += '<tr' + (blanc ? ' class="futur"' : '') + '><td>' + moisNoms[idx] + '</td>' +
      '<td>' + fmt(cContrat) + '</td>' +
      '<td>' + fmt(cTevt) + '</td>' +
      '<td><b class="base">' + fmt(cBase) + '</b></td>' +
      '<td>' + fmt(cPlan) + '</td>' +
      '<td>' + (blanc ? '' : fmt(cReal)) + '</td>' +
      '<td>' + (blanc ? '' : fmt(cCompte)) + '</td>' +
      '<td>' + (blanc ? '' : fmt(payees)) + '</td>' +
      '<td>' + (blanc ? '' : fmt(reporte)) + '</td>' +
      '<td>' + fmt(cRttRecup) + '</td>' +
      '<td>' + (blanc ? '' : fmt(r2(reporte - cRttRecup))) + '</td></tr>';
    corpsEvt += '<tr><td>' + moisNoms[idx] + '</td>' +
      evtsAnnee.map(function(e){ return '<td>' + (cntEvt[e] || '') + '</td>'; }).join('') +
      '<td>' + (totEvtMois || '') + '</td></tr>';
  });
  zone.innerHTML =
    '<table class="bev"><thead><tr><th>Mois</th><th>Contrat</th><th>Temps Évt</th><th>Nouvelle Base</th><th>Planifié</th><th>Réalisé</th><th>Temps pris en compte</th><th>Heures payées</th><th>Heures dues au salarié</th><th>Heures RTT et Récup.</th><th>Solde compteur heure</th></tr></thead>' +
    '<tbody>' + corps + '</tbody>' +
    '<tfoot><tr><td>Total année</td>' +
      '<td>' + fmt(TC) + '</td>' +
      '<td>' + fmt(TTE) + '</td>' +
      '<td><b class="base">' + fmt(TBASE) + '</b></td>' +
      '<td>' + fmt(TPLAN) + '</td>' +
      '<td>' + fmt(TREAL) + '</td>' +
      '<td>' + fmt(TCOMPTE) + '</td>' +
      '<td>' + fmt(r2(TCOMPTE - TREPORTE)) + '</td>' +
      '<td>' + fmt(TREPORTE) + '</td>' +
      '<td>' + fmt(TRTTRECUP) + '</td>' +
      '<td>' + fmt(r2(TREPORTE - TRTTRECUP)) + '</td></tr></tfoot></table>' +
    '<div style="font-weight:700;color:#334155;margin:18px 0 4px;font-size:0.95rem;">Événements — nombre de jours par mois</div>' +
    '<table class="bev"><thead><tr><th>Mois</th>' + evtsAnnee.map(function(e){ return '<th>' + e + '</th>'; }).join('') + '<th>Total</th></tr></thead>' +
    '<tbody>' + corpsEvt + '</tbody>' +
    '<tfoot><tr><td>Total année</td>' + evtsAnnee.map(function(e){ return '<td>' + (TEVT[e] || '') + '</td>'; }).join('') +
      '<td>' + (evtsAnnee.reduce(function(a,e){ return a + TEVT[e]; }, 0) || '') + '</td></tr></tfoot></table>' +
    '<div class="signatures"><div class="sig-box"><div class="lbl">Pour l\'entreprise</div><div class="sub">Date et signature</div></div>' +
    '<div class="sig-box"><div class="lbl">Le salarié</div><div class="sub">Date et signature</div></div></div>';
}

/* ── Pilotage ── */
function changerVue(v) {
  _vue = v;
  document.getElementById('btn-vue-mois').classList.toggle('actif', v === 'mois');
  document.getElementById('btn-vue-annee').classList.toggle('actif', v === 'annee');
  document.getElementById('bloc-mois').style.display  = (v === 'mois')  ? 'block' : 'none';
  document.getElementById('bloc-annee').style.display = (v === 'annee') ? 'block' : 'none';
  document.getElementById('btn-save').style.display   = (v === 'mois')  ? 'inline-block' : 'none';
  document.getElementById('lbl-valide').style.display = (v === 'mois')  ? 'flex' : 'none';
  rafraichir();
}
function rafraichir() {
  if (_vue === 'mois') chargerMois(); else chargerAnnee();
}
function remplirSalaries() {
  _salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]').filter(s => !s.administratif);
  const sel = document.getElementById('sel-salarie');
  const courant = sel.value;
  sel.innerHTML = _salaries.map(s => `<option value="${s.id}">${(s.prenom||'')+' '+(s.nom||'')}</option>`).join('');
  if (_salaries.some(s => String(s.id) === courant)) sel.value = courant;
}

window.addEventListener('DOMContentLoaded', () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) document.getElementById('entreprise-nom').textContent = ent.nom;
  const now = new Date();
  document.getElementById('sel-mois').value  = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('sel-annee').value = now.getFullYear();
  remplirSalaries();
  rafraichir();
});
window.addEventListener('donnees-chargees', () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) document.getElementById('entreprise-nom').textContent = ent.nom;
  remplirSalaries();
  rafraichir();
});
</script>
<script>
  /* Décalages des éléments figés = hauteurs réelles du bandeau et de la barre de contrôles */
  (function () {
    function majFigBev() {
      var root = document.documentElement.style;
      var h = document.querySelector('.main-header');
      var c = document.querySelector('.bev-controls');
      if (h) root.setProperty('--bandeau-h', h.offsetHeight + 'px');
      if (c) root.setProperty('--controls-h', c.offsetHeight + 'px');
    }
    window.addEventListener('load', majFigBev);
    window.addEventListener('resize', majFigBev);
    majFigBev();
  })();
</script>
