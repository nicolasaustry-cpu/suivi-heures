<script>
/* ════════════════════════════════════════════════
   Vue équipe — grille gérant
   Colonnes = salariés, lignes = jours (Lun→Sam).
   Contenu = chantiers planifiés (heuresdata) + chantiers
   ajoutés sur mobile (réalisé). Couleur selon l'état réel.
   ════════════════════════════════════════════════ */

let _ancre        = lundiDe(new Date());   // lundi de la semaine affichée
let _saisies      = [];                     // réalisé chargé depuis le serveur
let _notesChantiers = {};                   // note générale par chantier (lecture/édition)
let _notesChantiersPhotos = {};             // photos par chantier (page Notes unifiée)
const _moisCharges = new Set();             // mois (YYYY-MM) déjà récupérés

const JOURS_NOM = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ── Utilitaires dates ── */
function lundiDe(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const j = d.getDay();                     // 0=dim,1=lun…
  const delta = (j === 0) ? -6 : (1 - j);   // ramener au lundi
  d.setDate(d.getDate() + delta);
  return d;
}
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function norm(s) { return (s || '').trim().toLowerCase(); }
function fmtH(h) {
  const v = Math.round((parseFloat(h) || 0) * 100) / 100;
  if (!v) return '';
  return (Number.isInteger(v) ? String(v) : String(v).replace('.', ',')) + 'h';
}
function joursSemaine() {                    // Lun→Sam (dimanche exclu, comme le Planning)
  const arr = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(_ancre);
    d.setDate(_ancre.getDate() + i);
    arr.push(d);
  }
  return arr;
}

/* ── État réel d'un chantier saisi ── */
function etatChantier(c) {
  if (c.heureDepart  && String(c.heureDepart).trim())  return 'parti';
  if (c.heureArrivee && String(c.heureArrivee).trim()) return 'cours';
  return 'plan';
}

/* ── Récupération des données pour les mois de la semaine ──
   Deux contextes : licence (PC, jeton) ou mobile (gérant, code employé). */
let _accesRefuse = false;

async function chargerRealiseSemaine() {
  const mois = [...new Set(joursSemaine().map(d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`))];
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken && SYNC.getToken())
    || localStorage.getItem('syncToken');

  if (token) {
    const _t = (typeof SYNC !== 'undefined' && SYNC.getType && SYNC.getType()) || localStorage.getItem('syncType');
    _modeStandard = (_t === 'standard');
    _peutReordonner = !_modeStandard;   // Standard = planning seul, pas de réordonnancement
    if (_modeStandard) {
      const lg = document.querySelector('.legende');
      if (lg) lg.style.display = 'none';
    }
    // Contexte licence (PC). Filet : si la grille n'a pas encore les
    // salariés/planning (ouverture directe), on les récupère une fois.
    // On en profite pour charger les notes + photos de chantier (affichage popup).
    const aSal = (JSON.parse(localStorage.getItem('salariesdata') || '[]')).length > 0;
    const aPhotos = !!localStorage.getItem('notesChantiersPhotosdata');
    if (!aSal || !aPhotos) {
      try {
        const r = await fetch('/api/data', { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await r.json();
        if (d.ok && d.data) {
          if (!aSal) {
            localStorage.setItem('salariesdata', JSON.stringify(d.data.salaries || []));
            localStorage.setItem('heuresdata',   JSON.stringify(d.data.heures   || {}));
            if (d.data.entreprise) localStorage.setItem('entreprisedata', JSON.stringify(d.data.entreprise));
          }
          if (d.data.notesChantiers) localStorage.setItem('notesChantiersdata', JSON.stringify(d.data.notesChantiers));
          localStorage.setItem('notesChantiersPhotosdata', JSON.stringify(d.data.notesChantiersPhotos || {}));
        }
      } catch (_) {}
    }
    for (const m of mois) {
      if (_moisCharges.has(m)) continue;
      try {
        const r = await fetch(`/api/saisies/${m}`, { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await r.json();
        if (d.ok && d.saisies) _saisies.push(...d.saisies);
        if (d.ok && d.ordreMobile) localStorage.setItem('ordreMobiledata', JSON.stringify(d.ordreMobile));
        _moisCharges.add(m);
      } catch (_) {}
    }
    return;
  }

  // Contexte mobile : salarié gérant connecté par code employé.
  const codeEmploye = localStorage.getItem('saisie_codeEmploye');
  let salarieId = null;
  try { salarieId = JSON.parse(localStorage.getItem('saisie_salarie') || 'null')?.id; } catch (_) {}
  if (!codeEmploye || !salarieId) return;

  for (const m of mois) {
    if (_moisCharges.has(m)) continue;
    try {
      const r = await fetch('/api/saisies/equipe-mois', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codeEmploye, salarieId, mois: m })
      });
      if (r.status === 403) { _accesRefuse = true; continue; }
      const d = await r.json();
      if (d.ok) {
        if (d.saisies)  _saisies.push(...d.saisies);
        if (d.salaries) localStorage.setItem('salariesdata', JSON.stringify(d.salaries));
        if (d.heures)   localStorage.setItem('heuresdata',   JSON.stringify(d.heures));
        if (d.ordreMobile) localStorage.setItem('ordreMobiledata', JSON.stringify(d.ordreMobile));
        if (d.notesChantiers) localStorage.setItem('notesChantiersdata', JSON.stringify(d.notesChantiers));
        if (d.notesChantiersPhotos) localStorage.setItem('notesChantiersPhotosdata', JSON.stringify(d.notesChantiersPhotos));
        _peutReordonner = true;   // contexte gérant mobile : réordonnancement autorisé
        _moisCharges.add(m);
      }
    } catch (_) {}
  }
}

/* ── Réordonnancement mobile (gérant), par glisser-déposer tactile ── */
let _peutReordonner = false;
let _modeStandard = (localStorage.getItem('syncType') === 'standard'); // Vue équipe « planning seul »
let _drag = null;

/* Applique l'ordre mobile (s'il existe) à une liste de noms de chantiers (tri stable). */
function appliquerOrdreMobile(salId, dateStr, noms) {
  let o = {};
  try { o = JSON.parse(localStorage.getItem('ordreMobiledata') || '{}'); } catch (_) {}
  const ordre = o[String(salId) + '_' + dateStr];
  if (!Array.isArray(ordre) || !ordre.length) return noms;
  const rang = {}; ordre.forEach((n, i) => { rang[n] = i; });
  return noms.slice().sort((a, b) => ((rang[a] != null ? rang[a] : 999) - (rang[b] != null ? rang[b] : 999)));
}

/* Active le glisser-déposer sur chaque poignée (⠿) des pavés. */
function initDragReorder() {
  if (!_peutReordonner) return;
  document.querySelectorAll('.grille .drag-grip').forEach(g => {
    g.addEventListener('touchstart', dragStartTouch, { passive: false });
    g.addEventListener('mousedown',  dragStartMouse);
  });
}

/* — Début / déplacement / fin communs — */
function dragBegin(chip, cell) {
  _drag = { chip, cell };
  chip.style.opacity = '0.55';
  chip.style.outline = '2px dashed #2563eb';
  chip.style.outlineOffset = '-2px';
  document.body.style.userSelect = 'none';
  document.body.style.webkitUserSelect = 'none';
}
function dragPoint(x, y) {
  if (!_drag) return;
  const { chip, cell } = _drag;
  const el = document.elementFromPoint(x, y);
  const cible = el && el.closest ? el.closest('.chip') : null;
  if (!cible || cible === chip) return;
  if (cible.closest('td[data-cell]') !== cell) return; // rester dans la même case (jour × salarié)
  const r = cible.getBoundingClientRect();
  if (y > r.top + r.height / 2) cible.after(chip); else cible.before(chip);
}
function dragFinish() {
  if (!_drag) return;
  const { chip, cell } = _drag;
  chip.style.opacity = '';
  chip.style.outline = '';
  chip.style.outlineOffset = '';
  document.body.style.userSelect = '';
  document.body.style.webkitUserSelect = '';
  const cle  = cell.getAttribute('data-cell');
  const noms = [...cell.querySelectorAll('.chip')].map(c => c.getAttribute('data-nom'));
  _drag = null;
  enregistrerOrdreCellule(cle, noms);
}

/* — Tactile (mobile) : touchmove NON-PASSIF + preventDefault pour bloquer le défilement — */
function dragStartTouch(e) {
  const chip = e.target.closest('.chip');
  const cell = chip && chip.closest('td[data-cell]');
  if (!chip || !cell || cell.querySelectorAll('.chip').length < 2) return;
  e.preventDefault();   // empêche défilement + sélection dès le départ
  e.stopPropagation();
  dragBegin(chip, cell);
  document.addEventListener('touchmove',   dragMoveTouch, { passive: false });
  document.addEventListener('touchend',    dragEndTouch);
  document.addEventListener('touchcancel', dragEndTouch);
}
function dragMoveTouch(e) {
  if (!_drag) return;
  e.preventDefault();   // bloque le défilement du calendrier pendant le glisser
  const t = e.touches && e.touches[0];
  if (t) dragPoint(t.clientX, t.clientY);
}
function dragEndTouch() {
  document.removeEventListener('touchmove',   dragMoveTouch, { passive: false });
  document.removeEventListener('touchend',    dragEndTouch);
  document.removeEventListener('touchcancel', dragEndTouch);
  dragFinish();
}

/* — Souris (PC / tablette) — */
function dragStartMouse(e) {
  const chip = e.target.closest('.chip');
  const cell = chip && chip.closest('td[data-cell]');
  if (!chip || !cell || cell.querySelectorAll('.chip').length < 2) return;
  e.preventDefault();
  dragBegin(chip, cell);
  document.addEventListener('mousemove', dragMoveMouse);
  document.addEventListener('mouseup',   dragEndMouse);
}
function dragMoveMouse(e) {
  if (!_drag) return;
  dragPoint(e.clientX, e.clientY);
}
function dragEndMouse() {
  document.removeEventListener('mousemove', dragMoveMouse);
  document.removeEventListener('mouseup',   dragEndMouse);
  dragFinish();
}
/* Mémorise (local + serveur) le nouvel ordre d'une case. cle = "<salarieId>_<YYYY-MM-DD>" */
async function enregistrerOrdreCellule(cle, noms) {
  let o = {};
  try { o = JSON.parse(localStorage.getItem('ordreMobiledata') || '{}'); } catch (_) {}
  o[cle] = noms;
  localStorage.setItem('ordreMobiledata', JSON.stringify(o));

  const i = cle.indexOf('_');
  const salId = cle.slice(0, i), date = cle.slice(i + 1);
  try {
    const headers = { 'Content-Type': 'application/json' };
    const body = { salarieId: salId, date, ordre: noms };
    const codeEmploye = localStorage.getItem('saisie_codeEmploye');
    if (codeEmploye) {
      // Mobile : gérant par code employé
      body.codeEmploye = codeEmploye;
      try { body.gerantId = JSON.parse(localStorage.getItem('saisie_salarie') || 'null')?.id; } catch (_) {}
    } else {
      // PC : token licence
      const token = (typeof SYNC !== 'undefined' && SYNC.getToken && SYNC.getToken())
        || localStorage.getItem('syncToken');
      if (token) headers['Authorization'] = 'Bearer ' + token;
    }
    await fetch('/api/saisies/ordre-mobile', {
      method: 'POST',
      headers,
      body: JSON.stringify(body)
    });
  } catch (_) {}
}

/* Convertit une heure de RDV ("HH:MM") en minutes, ou null si absente. */
function _rdvEnMinutes(c){
  const s = c && c.rdv ? String(c.rdv).trim() : '';
  const m = s.match(/^(\d{1,2})[:hH](\d{0,2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + (m[2] ? parseInt(m[2],10) : 0);
}
/* Réordonne les pavés porteurs d'un RDV par heure croissante, sans déplacer
   les autres pavés. Ne s'active que s'il y a au moins deux RDV. */
function trierChipsParRdv(chips){
  const positions = [], avecRdv = [];
  chips.forEach((c, i) => {
    const mn = _rdvEnMinutes(c);
    if(mn !== null){ positions.push(i); avecRdv.push({ c, mn }); }
  });
  if(avecRdv.length < 2) return chips;
  avecRdv.sort((a, b) => a.mn - b.mn);
  positions.forEach((pos, j) => { chips[pos] = avecRdv[j].c; });
  return chips;
}

/* ── Construit les pavés d'une cellule (salarié × jour) ── */
function chipsCellule(sal, dateStr, heures, realParSalDate) {
  const safeDate = dateStr.replace(/-/g, '_');

  // 1) Chantiers planifiés (Planning) : un pavé par case ch1..ch5 nommée
  const planifies = [];
  for (let i = 1; i <= 5; i++) {
    const data = heures[`${sal.id}${safeDate}ch${i}`];
    if (data && data.chantier && String(data.chantier).trim()) {
      planifies.push({ nom: String(data.chantier).trim(), h: parseFloat(data.heures) || 0, note: (data.note || '').trim(), rdv: (data.rdv || '').trim() });
    }
  }

  // 2) Réalisé du salarié ce jour-là
  const rs   = (realParSalDate[sal.id] && realParSalDate[sal.id][dateStr]) ? realParSalDate[sal.id][dateStr] : [];
  const pris = new Array(rs.length).fill(false);

  const chips = [];

  // 2a) Pavés planifiés, colorés selon le réalisé correspondant (par nom)
  planifies.forEach(p => {
    let etat = 'plan', hReal = 0, noteR = '';
    const idx = rs.findIndex((c, j) => !pris[j] && norm(c.nom) === norm(p.nom));
    if (idx >= 0) { pris[idx] = true; etat = etatChantier(rs[idx]); hReal = (rs[idx].dureeMin || 0) / 60; noteR = (rs[idx].note || '').trim(); }
    chips.push({ nom: p.nom, hPlan: p.h, hReal, etat, ajoute: false, note: p.note || noteR, rdv: p.rdv || '' });
  });

  // 2b) Pavés ajoutés : réalisé non rattaché à un chantier planifié
  rs.forEach((c, j) => {
    if (pris[j]) return;
    chips.push({ nom: c.nom, hPlan: 0, hReal: (c.dureeMin || 0) / 60, etat: etatChantier(c), ajoute: true, note: (c.note || '').trim() });
  });

  // Ordre mobile (fixé par le gérant) : on réordonne TOUS les pavés (prévus + ajoutés)
  const ordreNoms = appliquerOrdreMobile(sal.id, dateStr, chips.map(c => c.nom));
  const rang = {}; ordreNoms.forEach((n, i) => { rang[n] = i; });
  chips.sort((a, b) => ((rang[a.nom] != null ? rang[a.nom] : 999) - (rang[b.nom] != null ? rang[b.nom] : 999)));

  return trierChipsParRdv(chips);
}

function fmtHM(h) {
  if (!h || h <= 0) return '—';
  return (Math.round(h * 100) / 100).toFixed(2).replace('.', ',') + ' h';

    : '';
  return `<div class="chip s-${c.etat}" data-nom="${escapeHtmlLocal(c.nom)}" data-rdv="${escapeHtmlLocal(c.rdv || '')}">

    <div class="chip-hrs">${hrsHtml}</div>

function escapeHtmlLocal(s) {
  return String(s || '').replace(/[&<>"']/g, m => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]
  ));
}

/* ── Rendu de la grille ── */
function genererGrille(opts) {
  opts = opts || {};
  chargerNotesChantiers();
  // Conserver la position de défilement (ex. après un changement d'ordre) au lieu d'aller à aujourd'hui
  const wrap0 = document.getElementById('grille-wrap');
  const savSL = (opts.conserverScroll && wrap0) ? wrap0.scrollLeft : null;
  const savST = (opts.conserverScroll && wrap0) ? wrap0.scrollTop  : null;

  const zone0 = document.getElementById('zone-grille');
  if (_accesRefuse) {
    zone0.outerHTML = `<div class="msg-info" id="zone-grille">Cette page est réservée aux gérants et administratifs.</div>`;
    return;
  }
  const salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  const heures   = JSON.parse(localStorage.getItem('heuresdata')   || '{}');
  const zone     = document.getElementById('zone-grille');

  const dates    = joursSemaine();
  const weekStart = dates[0], weekEnd = dates[5];

  majLibelleSemaine(weekStart, weekEnd);

  // Salariés présents au moins un jour de la semaine
  const sals = salaries.filter(s => {
    if (s.administratif && !s.planningPrevu) return false;   // administratifs SANS planning : exclus ; AVEC planning autorisé : visibles
    const e = s.dateEntree ? new Date(s.dateEntree) : null;
    const o = s.dateSortie ? new Date(s.dateSortie + 'T23:59:59') : null;
    if (e && e > weekEnd)   return false;
    if (o && o < weekStart) return false;
    return true;
  });

  if (!sals.length) {
    zone.outerHTML = `<div class="msg-info" id="zone-grille">Aucun salarié présent sur cette semaine.</div>`;
    return;
  }

  // Index du réalisé : real[salarieId][date] = [chantiers]
  const real = {};
  (_saisies || []).forEach(s => {
    if (!real[s.salarieId]) real[s.salarieId] = {};
    if (!real[s.salarieId][s.date]) real[s.salarieId][s.date] = [];
    (s.chantiers || []).forEach(c => real[s.salarieId][s.date].push(c));
  });

  const ajdStr = ymd(new Date());

  // En-tête : colonne Jour figée + une colonne par salarié
  let html = '<table class="grille"><thead><tr><th class="corner">Jour</th>';
  sals.forEach(s => { html += `<th>${escapeHtmlLocal(s.prenom)} ${escapeHtmlLocal(s.nom)}</th>`; });
  html += '</tr></thead><tbody>';

  dates.forEach(d => {
    const dateStr = ymd(d);
    const estAjd  = (dateStr === ajdStr);
    const jnom    = JOURS_NOM[d.getDay()];
    html += `<tr class="${estAjd ? 'ligne-aujourdhui' : ''}">`;
    html += `<th class="jour ${estAjd ? 'aujourdhui' : ''}">
               <div class="jnum">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</div>
               <div class="jnom">${jnom}.</div>
             </th>`;
    sals.forEach(s => {
      const chips = chipsCellule(s, dateStr, heures, real);
      const btnCell = `<button type="button" class="cell-add" data-sal="${s.id}" data-date="${dateStr}" onclick="ouvrirAjoutEquipe(this)" title="Ajouter un chantier / RDV" style="width:100%;margin-top:5px;background:#eef2f7;color:#475569;border:1px dashed #cbd5e1;border-radius:7px;font-size:0.72rem;font-weight:700;padding:4px;cursor:pointer;">➕ chantier</button>`;
      html += `<td data-cell="${s.id}_${dateStr}">` + (chips.length ? chips.map(htmlChip).join('') : '<div class="vide">—</div>') + btnCell + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  zone.outerHTML = `<div id="zone-grille">${html}</div>`;
  initDragReorder();
  initChipNotes();

  if (opts.conserverScroll) {
    const wrap = document.getElementById('grille-wrap');
    if (wrap) {
      if (savSL != null) wrap.scrollLeft = savSL;
      if (savST != null) wrap.scrollTop  = savST;
    }
    return;
  }

  // Défilement auto vers le jour courant si présent dans la semaine
  const ligneAjd = document.querySelector('.grille tr.ligne-aujourdhui');
  if (ligneAjd) ligneAjd.scrollIntoView({ block: 'center', behavior: 'auto' });
}

  const lbl = document.getElementById('ae-sousTitre');
  if (lbl) {
    let nom = '';
    try {
      const sal = (JSON.parse(localStorage.getItem('salariesdata') || '[]')).find(s => String(s.id) === String(_ajoutEquipe.salId));
      if (sal) nom = ((sal.prenom || '') + ' ' + (sal.nom || '')).trim();
    } catch (_) {}
    lbl.textContent = (nom ? nom + ' — ' : '') + _ajoutEquipe.date;
  }
  document.getElementById('ov-ajout-equipe').style.display = 'flex';
  setTimeout(() => { const i = document.getElementById('ae-chantier'); if (i) i.focus(); }, 50);
}

function fermerAjoutEquipe() {
  const ov = document.getElementById('ov-ajout-equipe');
  if (ov) ov.style.display = 'none';
}

async function validerAjoutEquipe() {
  const chantier = (document.getElementById('ae-chantier').value || '').trim();
  const rdv      = (document.getElementById('ae-rdv').value || '').trim();
  const delai    = (document.getElementById('ae-delai').value || '').trim();
  if (!chantier) { alert('Indiquez le nom du chantier.'); return; }

  const btn = document.getElementById('ae-valider');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const headers = { 'Content-Type': 'application/json' };
    const body = {
      salarieId: _ajoutEquipe.salId,
      date: _ajoutEquipe.date,
      chantier, rdv, rdvDelai: delai,
      creerChantier: true
    };
    const codeEmploye = localStorage.getItem('saisie_codeEmploye');
    if (codeEmploye) {
      body.codeEmploye = codeEmploye;
      try { body.gerantId = JSON.parse(localStorage.getItem('saisie_salarie') || 'null')?.id; } catch (_) {}
    } else {
      const token = (typeof SYNC !== 'undefined' && SYNC.getToken && SYNC.getToken())
        || localStorage.getItem('syncToken');
      if (token) headers['Authorization'] = 'Bearer ' + token;
    }

    const r = await fetch('/api/saisies/rdv', { method: 'POST', headers, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) { alert(d.message || 'Ajout impossible.'); return; }

    // Mise à jour locale immédiate du planning, puis re-rendu
    _insererChantierLocal(_ajoutEquipe.salId, _ajoutEquipe.date, chantier,
      d.rdv || '', (d.rdvDelai !== '' && d.rdvDelai != null) ? d.rdvDelai : null, d.rdvAuteur || 'gerant');

    // Note de chantier (optionnelle : texte + photos) → page Notes unifiée
    if ((_aeNoteTexte && _aeNoteTexte.trim()) || _aeNotePhotos.length) {
      await _enregistrerNoteEquipe(chantier, _aeNoteTexte, _aeNotePhotos);
    }

    fermerAjoutEquipe();
    genererGrille({ conserverScroll: true });
  } catch (e) {
    alert('Connexion impossible, réessayez.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Ajouter'; }
  }
}

async function _enregistrerNoteEquipe(chantier, texte, photos) {
  texte = (texte || '').trim();
  photos = Array.isArray(photos) ? photos : [];
  if (!texte && !photos.length) return;
  const nomU = (chantier || '').trim().toUpperCase();
  try {
    const codeEmploye = localStorage.getItem('saisie_codeEmploye');
    let d = null;
    if (codeEmploye) {
      let salarieId = null;
      try { salarieId = JSON.parse(localStorage.getItem('saisie_salarie') || 'null')?.id; } catch (_) {}
      const r = await fetch('/api/saisies/note-chantier', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codeEmploye, salarieId, chantier: nomU, texte, photos })
      });
      d = await r.json();
    } else {
      const token = (typeof SYNC !== 'undefined' && SYNC.getToken && SYNC.getToken()) || localStorage.getItem('syncToken');
      const r = await fetch('/api/data/note-chantier', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ chantier: nomU, texte, photos, auteur: 'Gérant' })
      });
      d = await r.json();
    }
    if (d && d.ok) {
      if (d.note != null) {
        _notesChantiers[nomU] = d.note;
        localStorage.setItem('notesChantiersdata', JSON.stringify(_notesChantiers));
      }
      if (d.photos != null) {
        _notesChantiersPhotos[nomU] = d.photos;
        localStorage.setItem('notesChantiersPhotosdata', JSON.stringify(_notesChantiersPhotos));
      }
    }
  } catch (_) {}
}

/* ── Éditeur de note riche (texte + dictée + photos) pour la Vue équipe ── */
const PHOTOS_MAX_AE = 3;
let _aeNoteTexte = '';
let _aeNotePhotos = [];
let _aeNotePhotosCharge = false;
let _naeRecognition = null, _naeEnEcoute = false;

function ouvrirNoteAE() {
  const chantier = (document.getElementById('ae-chantier').value || '').trim();
  if (!chantier) { alert('Indiquez d\'abord le nom du chantier.'); return; }
  const nomU = chantier.toUpperCase();
  if (!_aeNotePhotosCharge) {
    try { _notesChantiersPhotos = JSON.parse(localStorage.getItem('notesChantiersPhotosdata') || '{}'); } catch (_) {}
    _aeNotePhotos = (_notesChantiersPhotos[nomU] || []).slice();
    _aeNotePhotosCharge = true;
  }
  document.getElementById('nae-nom').textContent = chantier;
  document.getElementById('nae-texte').value = _aeNoteTexte || '';
  rendrePhotosNAE();
  document.getElementById('ov-note-ae').style.display = 'flex';
  setTimeout(() => { const t = document.getElementById('nae-texte'); if (t) t.focus(); }, 50);
}

function fermerNoteAE() {
  arreterDicteeAE();
  document.getElementById('ov-note-ae').style.display = 'none';
}

function validerNoteAE() {
  _aeNoteTexte = (document.getElementById('nae-texte').value || '').trim();
  fermerNoteAE();
  _majBoutonNoteAE();
}

function _majBoutonNoteAE() {
  const b = document.getElementById('ae-note-btn');
  if (!b) return;
  const nbP = _aeNotePhotos.length;
  const actif = !!((_aeNoteTexte && _aeNoteTexte.trim()) || nbP);
  if (actif) {
    b.textContent = '📝 Note ✓' + (nbP ? ' — ' + nbP + ' photo' + (nbP > 1 ? 's' : '') : '');
    b.style.background = '#dcfce7'; b.style.color = '#166534';
  } else {
    b.textContent = '📝 Ajouter une note / photos';
    b.style.background = '#eef2f7'; b.style.color = '#475569';
  }
}

function arreterDicteeAE() {
  if (_naeRecognition && _naeEnEcoute) { try { _naeRecognition.stop(); } catch (e) {} }
  _naeEnEcoute = false;
  const lbl = document.getElementById('dicter-label-nae');
  const btn = document.getElementById('btn-dicter-nae');
  if (lbl) lbl.textContent = 'Dicter';
  if (btn) btn.style.background = '#eef2f7';
}

function dicterNAE() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('btn-dicter-nae');
  const lbl = document.getElementById('dicter-label-nae');
  if (!SR) { alert('La dictée vocale n\'est pas disponible sur ce navigateur. Utilisez le micro du clavier.'); return; }
  if (!navigator.onLine) { alert('La dictée vocale a besoin d\'une connexion. Hors ligne, tapez la note (le micro du clavier peut fonctionner).'); return; }
  if (_naeEnEcoute) { arreterDicteeAE(); return; }
  _naeRecognition = new SR();
  _naeRecognition.lang = 'fr-FR';
  _naeRecognition.interimResults = false;
  _naeRecognition.onresult = function (e) {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    const ta = document.getElementById('nae-texte');
    ta.value = (ta.value ? ta.value.trim() + ' ' : '') + t;
  };
  _naeRecognition.onend = arreterDicteeAE;
  _naeRecognition.onerror = function (e) { arreterDicteeAE(); if (e && e.error === 'network') alert('Dictée interrompue : connexion indisponible.'); };
  try { _naeRecognition.start(); _naeEnEcoute = true; if (lbl) lbl.textContent = 'Écoute…'; if (btn) btn.style.background = '#fde68a'; }
  catch (e) { arreterDicteeAE(); }
}

function rendrePhotosNAE() {
  const strip = document.getElementById('nae-strip');
  const cpt = document.getElementById('nae-cpt');
  const btn = document.getElementById('btn-photo-nae');
  if (!strip || !cpt || !btn) return;
  strip.innerHTML = '';
  _aeNotePhotos.forEach((src, i) => {
    const v = document.createElement('div');
    v.style.cssText = 'position:relative;width:72px;height:72px;';
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;';
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '✕';
    x.style.cssText = 'position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:#dc2626;color:#fff;font-size:0.7rem;cursor:pointer;line-height:1;';
    x.onclick = function () { _aeNotePhotos.splice(i, 1); rendrePhotosNAE(); _majBoutonNoteAE(); };
    v.appendChild(img); v.appendChild(x);
    strip.appendChild(v);
  });
  cpt.textContent = _aeNotePhotos.length + '/' + PHOTOS_MAX_AE;
  const plein = _aeNotePhotos.length >= PHOTOS_MAX_AE;
  btn.disabled = plein;
  btn.style.opacity = plein ? '0.45' : '1';
}

function prendrePhotoNAE() {
  if (_aeNotePhotos.length >= PHOTOS_MAX_AE) return;
  document.getElementById('nae-photo-input').click();
}

function photoChoisieNAE(input) {
  const fichier = input.files && input.files[0];
  input.value = '';
  if (!fichier) return;
  compresserPhotoNAE(fichier, function (dataUrl) {
    if (!dataUrl) { alert('Impossible de lire cette photo.'); return; }
    if (_aeNotePhotos.length >= PHOTOS_MAX_AE) return;
    _aeNotePhotos.push(dataUrl);
    rendrePhotosNAE();
    _majBoutonNoteAE();
  });
}

function compresserPhotoNAE(fichier, cb) {
  const url = URL.createObjectURL(fichier);
  const img = new Image();
  img.onload = function () {
    try {
      const MAXC = 1280;
      let w = img.width, h = img.height;
      if (w > MAXC || h > MAXC) { const r = Math.min(MAXC / w, MAXC / h); w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg', 0.7));
    } catch (e) { URL.revokeObjectURL(url); cb(null); }
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

function _insererChantierLocal(salId, dateStr, chantier, rdv, rdvDelai, auteur) {
  let h = {};
  try { h = JSON.parse(localStorage.getItem('heuresdata') || '{}'); } catch (_) {}
  const safeDate = dateStr.replace(/-/g, '_');
  const prefixe = String(salId) + safeDate + 'ch';
  let cle = null;
  for (let i = 1; i <= 5; i++) {
    const k = prefixe + i, e = h[k];
    if (e && (e.chantier || '').trim().toUpperCase() === chantier.toUpperCase()) { cle = k; break; }
  }
  if (!cle) {
    for (let i = 1; i <= 5; i++) {
      const k = prefixe + i, e = h[k];
      if (!e || !((e.chantier || '').trim())) { h[k] = e || { chantier: '', heures: 0 }; h[k].chantier = chantier; cle = k; break; }
    }
  }
  if (!cle) return;
  if (rdv) {
    h[cle].rdv = rdv;
    h[cle].rdvAuteur = auteur || 'gerant';
    if (rdvDelai != null) h[cle].rdvDelai = rdvDelai; else delete h[cle].rdvDelai;
  }
  localStorage.setItem('heuresdata', JSON.stringify(h));
}

function ajusterHauteur() {
  const bar  = document.getElementById('top-bar');
  const wrap = document.getElementById('grille-wrap');
  if (!bar || !wrap) return;
  const h = bar.offsetHeight;
  wrap.style.marginTop = h + 'px';
  wrap.style.height    = (window.innerHeight - h) + 'px';
}

/* Impression : la marge haute et la barre fixe (posées en ligne) créent un grand vide.
   On les neutralise juste avant l'impression, puis on restaure après. */
window.addEventListener('beforeprint', () => {
  const bar  = document.getElementById('top-bar');
  const wrap = document.getElementById('grille-wrap');
  if (bar)  bar.style.position = 'static';
  if (wrap) { wrap.style.marginTop = '0'; wrap.style.height = 'auto'; }
});
window.addEventListener('afterprint', () => {
  const bar = document.getElementById('top-bar');
  if (bar) bar.style.position = '';
  ajusterHauteur();
});

/* ── Init ── */
window.addEventListener('DOMContentLoaded', async () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) { const el = document.getElementById('entreprise-nom'); if (el) el.textContent = ent.nom; }

  // Contexte « saisie mobile » : proposer un retour direct vers l'écran de saisie
  if (localStorage.getItem('saisie_codeEmploye')) {
    const b = document.getElementById('btn-retour-saisie');
    if (b) b.style.display = '';
  }

  ajusterHauteur();
  window.addEventListener('resize', ajusterHauteur);

  await chargerRealiseSemaine();
  genererGrille();
  ajusterHauteur();
});

// Quand les données serveur arrivent (salariés, planning…), recharger la grille.
window.addEventListener('donnees-chargees', async () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) { const el = document.getElementById('entreprise-nom'); if (el) el.textContent = ent.nom; }
  await chargerRealiseSemaine();
  genererGrille();
  ajusterHauteur();
});
</script>

<div id="edit-equipe-modal" style="display:none;position:fixed;inset:0;z-index:3200;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:14px;max-width:360px;width:100%;box-shadow:0 12px 44px rgba(0,0,0,0.3);overflow:hidden;">
    <div style="background:#0f3a8a;color:#fff;padding:12px 16px;font-weight:700;">Modifier « <span id="ee-nom"></span> »</div>
    <div style="padding:16px;">
      <label style="font-size:0.82rem;color:#374151;">Salarié</label>
      <select id="ee-salarie" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0 12px;font-size:0.95rem;"></select>
      <label style="font-size:0.82rem;color:#374151;">Date</label>
      <input type="date" id="ee-jour" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0 12px;font-size:0.95rem;">
      <div id="ee-conflit" style="display:none;font-size:0.82rem;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:8px;padding:10px;margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;">
        <button id="ee-valider" onclick="validerEditionEquipe()" style="flex:1;background:#16a34a;border:none;color:#fff;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;">Déplacer</button>
        <button onclick="fermerEditionEquipe()" style="flex:0 0 auto;background:#eef2f7;border:none;color:#475569;border-radius:8px;padding:10px 14px;cursor:pointer;">Annuler</button>
      </div>
      <button onclick="supprimerEditionEquipe()" style="width:100%;margin-top:10px;background:#fee2e2;border:none;color:#b91c1c;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;">🗑️ Supprimer du planning</button>
    </div>
  </div>
</div>

<script>
(function(){
  function _eeISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function _eeEsc(s){ return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
  var _editEquipe = null;

  window.ouvrirEditionEquipe = function(btn){
    var chip = btn.closest('.chip'); var cell = btn.closest('td[data-cell]');
    if(!chip || !cell) return;
    var nom = chip.getAttribute('data-nom'); var rdv = chip.getAttribute('data-rdv')||'';
    var dc = cell.getAttribute('data-cell'); var us = dc.indexOf('_');
    var salId = dc.slice(0, us); var dateStr = dc.slice(us+1);
    _editEquipe = { salIdSource: salId, dateSource: dateStr, nom: nom, rdv: rdv };
    document.getElementById('ee-nom').textContent = nom;
    var salaries = []; try{ salaries = JSON.parse(localStorage.getItem('salariesdata')||'[]'); }catch(e){}
    document.getElementById('ee-salarie').innerHTML = salaries.map(function(s){ return '<option value="'+s.id+'" '+(String(s.id)===String(salId)?'selected':'')+'>'+_eeEsc(((s.prenom||'')+' '+(s.nom||'')).trim())+'</option>'; }).join('');
    document.getElementById('ee-jour').value = dateStr;
    var box=document.getElementById('ee-conflit'); box.style.display='none'; box.innerHTML='';
    document.getElementById('edit-equipe-modal').style.display='flex';
  };

  window.fermerEditionEquipe = function(){ document.getElementById('edit-equipe-modal').style.display='none'; _editEquipe=null; };

  window.validerEditionEquipe = function(force){
    if(!_editEquipe) return;
    var heures={}, salaries=[];
    try{ heures=JSON.parse(localStorage.getItem('heuresdata')||'{}'); }catch(e){}
    try{ salaries=JSON.parse(localStorage.getItem('salariesdata')||'[]'); }catch(e){}
    var salIdT=document.getElementById('ee-salarie').value;
    var dateT=document.getElementById('ee-jour').value;
    var nom=_editEquipe.nom, rdv=_editEquipe.rdv, salIdS=_editEquipe.salIdSource, dateS=_editEquipe.dateSource;
    var safeS=dateS.replace(/-/g,'_'), safeT=dateT.replace(/-/g,'_');
    var slotSourceK=null, slotSourceData=null, i, k, d;
    for(i=1;i<=5;i++){ k=salIdS+safeS+'ch'+i; d=heures[k]; if(d && String(d.chantier||'').trim()===nom){ slotSourceK=k; slotSourceData=d; break; } }
    if(!slotSourceK){ alert('Chantier introuvable.'); return; }
    if(String(salIdT)===String(salIdS) && dateT===dateS){ window.fermerEditionEquipe(); return; }
    var conflits=[], salT=salaries.find(function(s){return String(s.id)===String(salIdT);});
    var absT=parseFloat((heures[salIdT+safeT+'abs']||{}).heures)||0;
    var estEcole = salT && salT.apprenti && Array.isArray(salT.joursEcole) && salT.joursEcole.indexOf(dateT)!==-1;
    if(estEcole) conflits.push('🎓 '+((salT&&salT.prenom)||'Le salarié')+' est à l\'école ce jour-là.');
    else if(absT>0) conflits.push('🚫 '+((salT&&salT.prenom)||'Le salarié')+' est absent ce jour-là.');
    var cibleK=null;
    for(i=1;i<=5;i++){ k=salIdT+safeT+'ch'+i; d=heures[k]; var n=String(d&&d.chantier||'').trim(); if(!n || n.toUpperCase()==='TEMPS NON AFFECTE'){ cibleK=k; break; } }
    if(!cibleK){ var b1=document.getElementById('ee-conflit'); b1.innerHTML='⛔ La journée de ce salarié est pleine (5 chantiers). Libère un créneau avant de déplacer.'; b1.style.display='block'; return; }
    if(rdv){ for(i=1;i<=5;i++){ k=salIdT+safeT+'ch'+i; d=heures[k]; if(d && String(d.rdv||'').trim()===rdv){ conflits.push('🕐 '+((salT&&salT.prenom)||'Le salarié')+' a déjà un RDV à '+rdv+'.'); break; } } }
    if(conflits.length && !force){
      var b2=document.getElementById('ee-conflit');
      b2.innerHTML=conflits.join('<br>')+'<div style="margin-top:8px;"><button onclick="validerEditionEquipe(true)" style="background:#dc2626;border:none;color:#fff;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;">Forcer le déplacement</button></div>';
      b2.style.display='block'; return;
    }
    var copie={}; for(var p in slotSourceData) copie[p]=slotSourceData[p];
    delete heures[slotSourceK];
    heures[cibleK]=copie;
    localStorage.setItem('heuresdata', JSON.stringify(heures));
    if(window.SYNC && SYNC.declencherSauvegarde) SYNC.declencherSauvegarde();
    window.fermerEditionEquipe();
    genererGrille({conserverScroll:true});
  };

  window.supprimerEditionEquipe = function(){
    if(!_editEquipe) return;
    if(!confirm('Supprimer « '+_editEquipe.nom+' » du planning de ce jour ?')) return;
    var heures={}; try{ heures=JSON.parse(localStorage.getItem('heuresdata')||'{}'); }catch(e){}
    var safeS=_editEquipe.dateSource.replace(/-/g,'_');
    for(var i=1;i<=5;i++){ var k=_editEquipe.salIdSource+safeS+'ch'+i; var d=heures[k]; if(d && String(d.chantier||'').trim()===_editEquipe.nom){ delete heures[k]; break; } }
    localStorage.setItem('heuresdata', JSON.stringify(heures));
    if(window.SYNC && SYNC.declencherSauvegarde) SYNC.declencherSauvegarde();
    window.fermerEditionEquipe();
    genererGrille({conserverScroll:true});
  };

  /* Swipe horizontal « au bord » pour changer de semaine (mobile) */
  (function(){
    var wrap = document.getElementById('grille-wrap');
    if(!wrap) return;
    var x0=0, y0=0, actif=false;
    wrap.addEventListener('touchstart', function(e){
      if(e.touches.length!==1 || (e.target.closest && e.target.closest('.drag-grip'))){ actif=false; return; }
      x0=e.touches[0].clientX; y0=e.touches[0].clientY; actif=true;
    }, {passive:true});
    wrap.addEventListener('touchend', function(e){
      if(!actif) return; actif=false;
      var dx=e.changedTouches[0].clientX - x0, dy=e.changedTouches[0].clientY - y0;
      if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy)*1.5) return;   // pas un swipe horizontal net
      var maxS = wrap.scrollWidth - wrap.clientWidth;
      if(dx < 0 && wrap.scrollLeft >= maxS - 3){ if(typeof semaineDecalage==='function') semaineDecalage(1); }        // vers la gauche au bord droit → semaine suivante
      else if(dx > 0 && wrap.scrollLeft <= 3){ if(typeof semaineDecalage==='function') semaineDecalage(-1); }         // vers la droite au bord gauche → semaine précédente
    }, {passive:true});
  })();
})();
</script>
