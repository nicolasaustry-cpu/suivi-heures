  body { margin:0; font-family:Arial,sans-serif; background:#f4f6f8; color:#222; }
  html, body { overflow-x:hidden; }   /* pas de défilement horizontal de la page */
  /* Sur mobile : masquer en-tête desktop ET nav (le gérant n'a besoin que de la grille).
     Sélecteur volontairement spécifique + !important pour battre theme-volitis.css. */
  @media (max-width: 760px) {
    .top-bar .main-header { display:none !important; }
    .top-bar .nav         { display:none !important; }
  }

  /* ══ BARRE FIXE (header + nav + outils) ══ */
  .top-bar { position:fixed; top:0; left:0; right:0; z-index:100; background:#f4f6f8; box-shadow:0 2px 8px rgba(0,0,0,0.10); }
  .nav { background:#e8edf3; display:flex; justify-content:center; gap:1rem; padding:0.5rem; flex-wrap:wrap; }
  .nav a { text-decoration:none; color:#2563eb; font-weight:bold; font-size:0.9rem; }
  .nav a.active { text-decoration:underline; }
  .nav a.nav-plus { color:#16a34a; }

  .fixed-tools { background:#fff; border-bottom:1px solid #ccc; padding:0.45rem 0.8rem; }
  .wk-nav { display:flex; align-items:center; gap:0.7rem; justify-content:center; flex-wrap:wrap; }
  .wk-btn { border:1px solid #cbd5e1; background:#fff; color:#0f3a8a; border-radius:6px; padding:5px 12px; font-weight:700; cursor:pointer; font-size:0.95rem; line-height:1; }

  .sw { width:12px; height:12px; border-radius:3px; border:1px solid #cbd5e1; display:inline-block; flex:0 0 auto; }

  /* ══ GRILLE ══ */
  #grille-wrap { overflow:auto; -webkit-overflow-scrolling:touch; }
  table.grille { border-collapse:separate; border-spacing:0; width:max-content; font-size:0.8rem; }
  table.grille thead th {
    position:sticky; top:0; z-index:3; background:#0f3a8a; color:#fff; font-weight:700;
    padding:8px 6px; text-align:center; min-width:160px; width:160px; max-width:160px;
    border-right:1px solid rgba(255,255,255,0.18); border-bottom:1px solid #0a2a66;
  }
  table.grille thead th.corner { left:0; z-index:5; min-width:66px; width:66px; border-right:3px solid #f59e0b; }
  table.grille tbody th.jour {
    position:sticky; left:0; z-index:4; background:#0f3a8a; color:#fff; font-weight:700;
    padding:8px 5px; min-width:66px; width:66px; text-align:center; vertical-align:top;
    border-right:3px solid #f59e0b; border-bottom:1px solid #c7cfdb;
  }
  table.grille tbody th.jour .jnum { font-size:0.95rem; }
  table.grille tbody th.jour .jnom { font-size:0.72rem; opacity:0.9; font-weight:600; }
  table.grille tbody th.jour.aujourdhui { background:#15357a; box-shadow:inset 4px 0 0 #f59e0b; }
  table.grille tbody td { background:#fff; vertical-align:top; padding:6px; min-width:160px; width:160px; max-width:160px; border-right:1px solid #e3e7ee; border-bottom:1px solid #c7cfdb; }
  table.grille tbody tr.ligne-aujourdhui td { background:#fbfdff; }

  .chip { border:1px solid #EEC489; border-radius:7px; padding:6px 8px; margin-bottom:6px; background:#FCEBD2; display:flex; flex-direction:column; min-height:45px; }
  .chip:last-child { margin-bottom:0; }
  .chip.s-cours { background:#D4E7FB; border-color:#4F9BE8; }
  .chip.s-parti { background:#DCF0C6; border-color:#6FB23C; }
  .chip .cn { font-weight:700; line-height:1.25; display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-bottom:5px; color:#6E4A12; font-size:0.8rem; }
  .chip .cn .nm { overflow-wrap:anywhere; word-break:break-word; }
  .chip.s-cours .cn { color:#0B3E78; }
  .chip.s-parti .cn { color:#1E5E12; }
  .chip-hrs { margin-top:auto; padding-top:4px; font-size:0.6rem; line-height:1.3; color:#4b5563; white-space:nowrap; }
  .chip-hrs .hr { margin-left:5px; }
  .chip-hrs .hr.depasse { color:#dc2626; font-weight:700; }
  .chip .pin-etat { font-size:0.85rem; line-height:1; }
  .vide { color:#9ca3af; text-align:center; padding:6px 2px; }

  /* ── PC : tableau agrandi (~+50 %) et centré horizontalement ── */
  @media (min-width: 761px) {
    table.grille { font-size:1.2rem; margin-left:auto; margin-right:auto; }
    table.grille thead th { min-width:225px; width:225px; max-width:225px; padding:12px 9px; font-size:1.1rem; }
    table.grille thead th.corner { min-width:99px; width:99px; }
    table.grille tbody th.jour { min-width:99px; width:99px; padding:12px 8px; }
    table.grille tbody th.jour .jnum { font-size:1.42rem; }
    table.grille tbody th.jour .jnom { font-size:1.05rem; }
    table.grille tbody td { padding:9px; min-width:225px; width:225px; max-width:225px; }
    .chip { padding:9px 13px; margin-bottom:9px; border-radius:9px; min-height:75px; }
    .chip .cn { font-size:1.2rem; gap:6px; margin-bottom:7px; }
    .chip-hrs { font-size:0.8rem; padding-top:6px; }
    .chip .pin-etat { font-size:1.28rem; }
    .vide { font-size:1.2rem; padding:9px 3px; }
  }

  .msg-info { padding:1rem; color:#6b7280; }

<div id="grille-wrap">

<script src="assets/script.js"></script>

<script src="assets/aide.js"></script>
<script>
/* ════════════════════════════════════════════════
   Vue équipe — grille gérant
   Colonnes = salariés, lignes = jours (Lun→Sam).
   Contenu = chantiers planifiés (heuresdata) + chantiers
   ajoutés sur mobile (réalisé). Couleur selon l'état réel.
   ════════════════════════════════════════════════ */

let _ancre        = lundiDe(new Date());   // lundi de la semaine affichée
let _saisies      = [];                     // réalisé chargé depuis le serveur
const _moisCharges = new Set();             // mois (YYYY-MM) déjà récupérés

const JOURS_NOM = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ── Utilitaires dates ── */
function lundiDe(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const j = d.getDay();                     // 0=dim,1=lun…
  const delta = (j === 0) ? -6 : (1 - j);   // ramener au lundi
  d.setDate(d.getDate() + delta);
  return d;
}
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function norm(s) { return (s || '').trim().toLowerCase(); }
function fmtH(h) {
  const v = Math.round((parseFloat(h) || 0) * 100) / 100;
  if (!v) return '';
  return (Number.isInteger(v) ? String(v) : String(v).replace('.', ',')) + 'h';
}
function joursSemaine() {                    // Lun→Sam (dimanche exclu, comme le Planning)
  const arr = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(_ancre);
    d.setDate(_ancre.getDate() + i);
    arr.push(d);
  }
  return arr;
}

/* ── État réel d'un chantier saisi ── */
function etatChantier(c) {
  if (c.heureDepart  && String(c.heureDepart).trim())  return 'parti';
  if (c.heureArrivee && String(c.heureArrivee).trim()) return 'cours';
  return 'plan';
}

/* ── Récupération des données pour les mois de la semaine ──
   Deux contextes : licence (PC, jeton) ou mobile (gérant, code employé). */
let _accesRefuse = false;

async function chargerRealiseSemaine() {
  const mois = [...new Set(joursSemaine().map(d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`))];
  const token = (typeof SYNC !== 'undefined' && SYNC.getToken && SYNC.getToken())
    || localStorage.getItem('syncToken');

  if (token) {
    // Contexte licence (PC). Filet : si la grille n'a pas encore les
    // salariés/planning (ouverture directe), on les récupère une fois.
    const aSal = (JSON.parse(localStorage.getItem('salariesdata') || '[]')).length > 0;
    if (!aSal) {
      try {
        const r = await fetch('/api/data', { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await r.json();
        if (d.ok && d.data) {
          localStorage.setItem('salariesdata', JSON.stringify(d.data.salaries || []));
          localStorage.setItem('heuresdata',   JSON.stringify(d.data.heures   || {}));
          if (d.data.entreprise) localStorage.setItem('entreprisedata', JSON.stringify(d.data.entreprise));
        }
      } catch (_) {}
    }
    for (const m of mois) {
      if (_moisCharges.has(m)) continue;
      try {
        const r = await fetch(`/api/saisies/${m}`, { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await r.json();
        if (d.ok && d.saisies) _saisies.push(...d.saisies);
        _moisCharges.add(m);
      } catch (_) {}
    }
    return;
  }

  // Contexte mobile : salarié gérant connecté par code employé.
  const codeEmploye = localStorage.getItem('saisie_codeEmploye');
  let salarieId = null;
  try { salarieId = JSON.parse(localStorage.getItem('saisie_salarie') || 'null')?.id; } catch (_) {}
  if (!codeEmploye || !salarieId) return;

  for (const m of mois) {
    if (_moisCharges.has(m)) continue;
    try {
      const r = await fetch('/api/saisies/equipe-mois', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codeEmploye, salarieId, mois: m })
      });
      if (r.status === 403) { _accesRefuse = true; continue; }
      const d = await r.json();
      if (d.ok) {
        if (d.saisies)  _saisies.push(...d.saisies);
        if (d.salaries) localStorage.setItem('salariesdata', JSON.stringify(d.salaries));
        if (d.heures)   localStorage.setItem('heuresdata',   JSON.stringify(d.heures));
        if (d.ordreMobile) localStorage.setItem('ordreMobiledata', JSON.stringify(d.ordreMobile));
        _peutReordonner = true;   // contexte gérant mobile : réordonnancement autorisé
        _moisCharges.add(m);
      }
    } catch (_) {}
  }
}

/* ── Réordonnancement mobile (gérant) ── */
let _peutReordonner = false;

function escJs(s) {
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
/* Applique l'ordre mobile (s'il existe) à une liste de noms de chantiers (tri stable). */
function appliquerOrdreMobile(salId, dateStr, noms) {
  let o = {};
  try { o = JSON.parse(localStorage.getItem('ordreMobiledata') || '{}'); } catch (_) {}
  const ordre = o[String(salId) + '_' + dateStr];
  if (!Array.isArray(ordre) || !ordre.length) return noms;
  const rang = {}; ordre.forEach((n, i) => { rang[n] = i; });
  return noms.slice().sort((a, b) => ((rang[a] != null ? rang[a] : 999) - (rang[b] != null ? rang[b] : 999)));
}
/* Noms des chantiers planifiés d'une journée, dans l'ordre mobile courant. */
function planifiesOrdonnes(salId, dateStr, heures) {
  const safeDate = dateStr.replace(/-/g, '_');
  const noms = [];
  for (let i = 1; i <= 5; i++) {
    const dd = heures[`${salId}${safeDate}ch${i}`];
    if (dd && dd.chantier && String(dd.chantier).trim()) noms.push(String(dd.chantier).trim());
  }
  return appliquerOrdreMobile(salId, dateStr, noms);
}
/* Déplace un chantier planifié dans l'ordre du jour (sens = -1 monter, +1 descendre). */
async function deplacerChantierMobile(salId, dateStr, nom, sens) {
  const heures = JSON.parse(localStorage.getItem('heuresdata') || '{}');
  const noms = planifiesOrdonnes(salId, dateStr, heures);
  const i = noms.indexOf(nom);
  const j = i + sens;
  if (i < 0 || j < 0 || j >= noms.length) return;
  const tmp = noms[i]; noms[i] = noms[j]; noms[j] = tmp;

  // Mémorisation locale immédiate + re-rendu
  let o = {};
  try { o = JSON.parse(localStorage.getItem('ordreMobiledata') || '{}'); } catch (_) {}
  o[String(salId) + '_' + dateStr] = noms;
  localStorage.setItem('ordreMobiledata', JSON.stringify(o));
  genererGrille();

  // Enregistrement serveur (réservé au gérant)
  try {
    let gerantId = null;
    try { gerantId = JSON.parse(localStorage.getItem('saisie_salarie') || 'null')?.id; } catch (_) {}
    await fetch('/api/saisies/ordre-mobile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        codeEmploye: localStorage.getItem('saisie_codeEmploye'),
        gerantId, salarieId: salId, date: dateStr, ordre: noms
      })
    });
  } catch (_) {}
}

/* ── Construit les pavés d'une cellule (salarié × jour) ── */
function chipsCellule(sal, dateStr, heures, realParSalDate) {
  const safeDate = dateStr.replace(/-/g, '_');

  // 1) Chantiers planifiés (Planning) : un pavé par case ch1..ch5 nommée
  const planifies = [];
  for (let i = 1; i <= 5; i++) {
    const data = heures[`${sal.id}${safeDate}ch${i}`];
    if (data && data.chantier && String(data.chantier).trim()) {
      planifies.push({ nom: String(data.chantier).trim(), h: parseFloat(data.heures) || 0 });
    }
  }
  // Ordre mobile (fixé par le gérant) : on réordonne les pavés planifiés
  const ordreNoms = appliquerOrdreMobile(sal.id, dateStr, planifies.map(p => p.nom));
  const rangP = {}; ordreNoms.forEach((n, i) => { rangP[n] = i; });
  planifies.sort((a, b) => ((rangP[a.nom] != null ? rangP[a.nom] : 999) - (rangP[b.nom] != null ? rangP[b.nom] : 999)));

  // 2) Réalisé du salarié ce jour-là
  const rs   = (realParSalDate[sal.id] && realParSalDate[sal.id][dateStr]) ? realParSalDate[sal.id][dateStr] : [];
  const pris = new Array(rs.length).fill(false);

  const chips = [];

  // 2a) Pavés planifiés, colorés selon le réalisé correspondant (par nom)
  planifies.forEach(p => {
    let etat = 'plan', hReal = 0;
    const idx = rs.findIndex((c, j) => !pris[j] && norm(c.nom) === norm(p.nom));
    if (idx >= 0) { pris[idx] = true; etat = etatChantier(rs[idx]); hReal = (rs[idx].dureeMin || 0) / 60; }
    chips.push({ nom: p.nom, hPlan: p.h, hReal, etat, ajoute: false, salId: sal.id, date: dateStr });
  });

  // 2b) Pavés ajoutés : réalisé non rattaché à un chantier planifié (pas de planifié)
  rs.forEach((c, j) => {
    if (pris[j]) return;
    chips.push({ nom: c.nom, hPlan: 0, hReal: (c.dureeMin || 0) / 60, etat: etatChantier(c), ajoute: true });
  });

  return chips;
}

function fmtHM(h) {
  if (!h || h <= 0) return '—';
  return (Math.round(h * 100) / 100).toFixed(2).replace('.', ',') + ' h';
}

function htmlChip(c) {
  const icone = c.etat === 'parti' ? '<span class="pin-etat">✅</span>'
              : c.etat === 'cours' ? '<span class="pin-etat">📍</span>' : '';
  const tag     = c.ajoute ? '<span class="tag-add">ajouté</span>' : '';
  const depasse = (c.hPlan > 0 && c.hReal > c.hPlan) ? ' depasse' : '';
  const btnStyle = 'border:none;background:#eef2ff;color:#3730a3;border-radius:5px;font-size:0.72rem;line-height:1;padding:2px 6px;cursor:pointer;';
  const reorder = (!c.ajoute && _peutReordonner)
    ? `<span style="margin-left:auto;display:inline-flex;gap:3px;flex:0 0 auto;">`
      + `<button type="button" title="Monter" style="${btnStyle}" onclick="event.stopPropagation();deplacerChantierMobile('${escJs(c.salId)}','${escJs(c.date)}','${escJs(c.nom)}',-1)">▲</button>`
      + `<button type="button" title="Descendre" style="${btnStyle}" onclick="event.stopPropagation();deplacerChantierMobile('${escJs(c.salId)}','${escJs(c.date)}','${escJs(c.nom)}',1)">▼</button>`
      + `</span>`
    : '';
  return `<div class="chip s-${c.etat}">
    <div class="cn" style="display:flex;align-items:center;gap:4px;">${icone}<span class="nm">${escapeHtmlLocal(c.nom)}</span>${tag}${reorder}</div>
    <div class="chip-hrs"><span class="hp">h plan. : ${fmtHM(c.hPlan)}</span><span class="hr${depasse}">h réal : ${fmtHM(c.hReal)}</span></div>
  </div>`;
}

function escapeHtmlLocal(s) {
  return String(s || '').replace(/[&<>"']/g, m => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]
  ));
}

/* ── Rendu de la grille ── */
function genererGrille() {
  const zone0 = document.getElementById('zone-grille');
  if (_accesRefuse) {
    zone0.outerHTML = `<div class="msg-info" id="zone-grille">Cette page est réservée aux gérants.</div>`;
    return;
  }
  const salaries = JSON.parse(localStorage.getItem('salariesdata') || '[]');
  const heures   = JSON.parse(localStorage.getItem('heuresdata')   || '{}');
  const zone     = document.getElementById('zone-grille');

  const dates    = joursSemaine();
  const weekStart = dates[0], weekEnd = dates[5];

  majLibelleSemaine(weekStart, weekEnd);

  // Salariés présents au moins un jour de la semaine
  const sals = salaries.filter(s => {
    const e = s.dateEntree ? new Date(s.dateEntree) : null;
    const o = s.dateSortie ? new Date(s.dateSortie + 'T23:59:59') : null;
    if (e && e > weekEnd)   return false;
    if (o && o < weekStart) return false;
    return true;
  });

  if (!sals.length) {
    zone.outerHTML = `<div class="msg-info" id="zone-grille">Aucun salarié présent sur cette semaine.</div>`;
    return;
  }

  // Index du réalisé : real[salarieId][date] = [chantiers]
  const real = {};
  (_saisies || []).forEach(s => {
    if (!real[s.salarieId]) real[s.salarieId] = {};
    if (!real[s.salarieId][s.date]) real[s.salarieId][s.date] = [];
    (s.chantiers || []).forEach(c => real[s.salarieId][s.date].push(c));
  });

  const ajdStr = ymd(new Date());

  // En-tête : colonne Jour figée + une colonne par salarié
  let html = '<table class="grille"><thead><tr><th class="corner">Jour</th>';
  sals.forEach(s => { html += `<th>${escapeHtmlLocal(s.prenom)} ${escapeHtmlLocal(s.nom)}</th>`; });
  html += '</tr></thead><tbody>';

  dates.forEach(d => {
    const dateStr = ymd(d);
    const estAjd  = (dateStr === ajdStr);
    const jnom    = JOURS_NOM[d.getDay()];
    html += `<tr class="${estAjd ? 'ligne-aujourdhui' : ''}">`;
    html += `<th class="jour ${estAjd ? 'aujourdhui' : ''}">
               <div class="jnum">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</div>
               <div class="jnom">${jnom}.</div>
             </th>`;
    sals.forEach(s => {
      const chips = chipsCellule(s, dateStr, heures, real);
      html += '<td>' + (chips.length ? chips.map(htmlChip).join('') : '<div class="vide">—</div>') + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  zone.outerHTML = `<div id="zone-grille">${html}</div>`;

  // Défilement auto vers le jour courant si présent dans la semaine
  const ligneAjd = document.querySelector('.grille tr.ligne-aujourdhui');
  if (ligneAjd) ligneAjd.scrollIntoView({ block: 'center', behavior: 'auto' });
}

function majLibelleSemaine(debut, fin) {
  const opt = { day: 'numeric', month: 'long' };
  const lbl = document.getElementById('wk-label');
  if (lbl) lbl.textContent = `Semaine du ${debut.toLocaleDateString('fr-FR', opt)} au ${fin.toLocaleDateString('fr-FR', opt)}`;
}

/* ── Navigation semaine ── */
async function semaineDecalage(n) {
  _ancre.setDate(_ancre.getDate() + n * 7);
  await chargerRealiseSemaine();
  genererGrille();
}
async function semaineAujourdhui() {
  _ancre = lundiDe(new Date());
  await chargerRealiseSemaine();
  genererGrille();
}

/* ── Hauteur de la zone de défilement sous la barre fixe ── */
function ajusterHauteur() {
  const bar  = document.getElementById('top-bar');
  const wrap = document.getElementById('grille-wrap');
  if (!bar || !wrap) return;
  const h = bar.offsetHeight;
  wrap.style.marginTop = h + 'px';
  wrap.style.height    = (window.innerHeight - h) + 'px';
}

/* ── Init ── */
window.addEventListener('DOMContentLoaded', async () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) { const el = document.getElementById('entreprise-nom'); if (el) el.textContent = ent.nom; }

  ajusterHauteur();
  window.addEventListener('resize', ajusterHauteur);

  await chargerRealiseSemaine();
  genererGrille();
  ajusterHauteur();
});

// Quand les données serveur arrivent (salariés, planning…), recharger la grille.
window.addEventListener('donnees-chargees', async () => {
  const ent = JSON.parse(localStorage.getItem('entreprisedata') || '{}');
  if (ent.nom) { const el = document.getElementById('entreprise-nom'); if (el) el.textContent = ent.nom; }
  await chargerRealiseSemaine();
  genererGrille();
  ajusterHauteur();
});
</script>
