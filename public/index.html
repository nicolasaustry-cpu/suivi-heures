<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Entreprise – Suivi des heures</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="main-header">
  <div class="entreprise-nom" id="entreprise-nom"></div>
  <h1 class="page-title">Entreprise</h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div id="licence-status"></div>
  </div>
</header>

<div class="nav">
  <a href="index.html" class="active">Entreprise</a>
  <a href="salaries.html">Salariés</a>
  <a href="planning.html">Planning</a>
  <a href="rapports.html">Rapports</a>
  <a href="chantiers.html">Prévisionnel</a>
</div>

<!-- Informations de l'entreprise -->
<section>
  <h2>Informations de l'entreprise</h2>
  <div class="flex" style="flex-direction:column;align-items:flex-start;background:#e0f2fe;padding:1rem;border-radius:8px;gap:1rem;">
    <div>
      <label>Nom de l'entreprise :</label><br>
      <input id="nom-entreprise" placeholder="Ex : Dupont Bâtiment" style="width:300px;">
    </div>
    <button class="btn btn-success" onclick="sauverEntreprise()">💾 Sauvegarder</button>
  </div>
</section>

<!-- Licence -->
<section>
  <h2>Licence</h2>
  <div class="flex" style="align-items:flex-end;gap:1rem;">
    <div>
      <label>Code client :</label><br>
      <input id="code-client" placeholder="XXXX-YYYY-ZZZZ" style="width:220px;">
    </div>
    <button class="btn btn-primary" onclick="activerLicence()">Activer la licence</button>
  </div>
  <div id="msg-licence" style="margin-top:0.5rem;"></div>
</section>

<!-- Script unique en bas de page -->
<script src="assets/script.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", () => {
    initEntreprise();
    // Pré-remplir le champ code si déjà enregistré
    const code = localStorage.getItem("licenceCode");
    if (code) document.getElementById("code-client").value = code;
  });
</script>

</body>
</html>
