<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Entreprise – Suivi des heures</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="main-header">
  <div class="entreprise-nom" id="entreprise-nom"></div>
  <h1 class="page-title">Entreprise</h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div id="licence-status"></div>
  </div>
</header>

<div class="nav">
  <a href="index.html" class="active">Entreprise</a>
  <a href="salaries.html">Salariés</a>
<a href="chantiers.html">Prévisionnel</a>
  <a href="planning.html">Planning</a>
  <a href="rapports.html">Rapports</a>
</div>

<!-- Informations de l'entreprise -->
<section>
  <h2>Informations de l'entreprise</h2>
  <div class="flex" style="flex-direction:column;align-items:flex-start;background:#e0f2fe;padding:1rem;border-radius:8px;gap:1rem;">
    <div>
      <label>Nom de l'entreprise :</label><br>
      <input id="nom-entreprise" placeholder="Ex : Dupont Bâtiment" style="width:300px;">
    </div>
    <div>
      <label>Code employé <span style="font-size:0.8rem;color:#6b7280;">(communiqué aux salariés pour la saisie mobile)</span> :</label><br>
      <input id="code-employe" placeholder="Ex : VOLITIS-SAL" style="width:220px;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
    </div>
    <button class="btn btn-success" onclick="sauverEntreprise()">💾 Sauvegarder</button>
  </div>
</section>

<!-- Licence -->
<section>
  <h2>Licence</h2>
  <div class="flex" style="align-items:flex-end;gap:1rem;">
    <div>
      <label>Code client :</label><br>
      <input id="code-client" placeholder="XXXX-YYYY-ZZZZ" style="width:220px;">
    </div>
    <button class="btn btn-primary" onclick="activerLicence()">Activer la licence</button>
  </div>
  <div id="msg-licence" style="margin-top:0.5rem;"></div>
</section>

<!-- Script unique en bas de page -->
<script src="assets/script.js"></script>
<script src="assets/sync.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", () => {
    initEntreprise();
    // Pré-remplir le champ code licence si déjà enregistré
    const code = localStorage.getItem("licenceCode");
    if (code) document.getElementById("code-client").value = code;
    // Pré-remplir le code employé
    const ent = JSON.parse(localStorage.getItem("entreprisedata") || "{}");
    const inputCode = document.getElementById("code-employe");
    if (inputCode && ent.codeEmploye) inputCode.value = ent.codeEmploye;

  // Afficher message si redirigé depuis une page protégée
  const params = new URLSearchParams(window.location.search);
  const erreur = params.get('erreur');
  if (erreur === 'licence' || erreur === 'plus') {
    const msg = document.createElement('div');
    const txtLicence = '⚠ Accès refusé : veuillez saisir votre code licence.';
    const txtPlus    = '⚠ Cette page est réservée aux licences Plus ★. Contactez Volitis pour upgrader.';
    msg.style.cssText = 'background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:0.8rem 1rem;border-radius:6px;margin-bottom:1rem;font-weight:600;';
    msg.textContent = erreur === 'plus' ? txtPlus : txtLicence;
    const section = document.querySelector('section');
    if (section) section.prepend(msg);
  }

  // Surcharge de activerLicence pour passer par le serveur
  window.activerLicence = async function() {
    const code = document.getElementById("code-client")?.value.trim();
    if (!code) { alert("Veuillez saisir un code client."); return; }
    const btn = document.querySelector('button[onclick="activerLicence()"]');
    if (btn) { btn.textContent = "Vérification..."; btn.disabled = true; }
    const ok = await SYNC.connecter(code);
    if (btn) { btn.textContent = "Activer la licence"; btn.disabled = false; }
    if (ok) {
      SYNC.afficherNotif("✔ Licence activée !");
    } else {
      alert("Code licence invalide ou expiré.");
    }
  };
  });
</script>

</body>
</html>
